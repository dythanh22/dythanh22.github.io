project:
  type: website
  output-dir: _site
  preview:
    port: 4321
    browser: true
  render:
    - index.qmd
    - about.qmd
    - bai-hoc/**
    - "!du-an/**"
    - "!nghien-cuu/**"
  resources:
    - legacy/**/*
    - assets/img/**

website:
  title: "dythanh22"
  description: "Ghi chú học tập — kiến trúc mô hình và tối ưu inference"
  site-url: https://dythanh22.github.io
  repo-url: https://github.com/dythanh22/dythanh22.github.io
  repo-actions: [edit, issue]
  reader-mode: true
  page-navigation: true
  bread-crumbs: true
  back-to-top-navigation: true

  navbar:
    background: dark
    search: true
    pinned: true
    tools:
      - icon: github
        href: https://github.com/dythanh22
        text: GitHub
    left:
      - href: index.qmd
        text: Trang chủ
      - text: Bài học
        menu:
          - href: bai-hoc/index.qmd
            text: Tất cả chuỗi
          - href: bai-hoc/architecture-models/index.qmd
            text: Architecture Models
          - href: bai-hoc/ai-optimize/index.qmd
            text: AI Optimization
      - href: about.qmd
        text: Giới thiệu

  # Sidebar: thứ tự lộ trình (CNN → sequence → generative → embeddings → attention → U-Net).
  # Trong mỗi model, `auto` + frontmatter `order` giữ thứ tự chương.
  sidebar:
    - id: architecture-models
      title: "Architecture Models"
      style: docked
      search: true
      collapse-level: 2
      contents:
        - bai-hoc/architecture-models/index.qmd
        - section: "1. CNN"
          contents:
            - auto: bai-hoc/architecture-models/AlexNet
            - auto: bai-hoc/architecture-models/VGG
            - auto: bai-hoc/architecture-models/ResNet
            - auto: bai-hoc/architecture-models/DenseNet
        - section: "2. Sequence"
          contents:
            - auto: bai-hoc/architecture-models/RNN
            - auto: bai-hoc/architecture-models/LSTM
            - auto: bai-hoc/architecture-models/GRU
        - section: "3. Generative"
          contents:
            - auto: bai-hoc/architecture-models/VAE
            - auto: bai-hoc/architecture-models/GAN
            - auto: bai-hoc/architecture-models/Denoising-Diffusion-Probabilistic-Models
        - section: "4. Embeddings"
          contents:
            - auto: bai-hoc/architecture-models/Word2Vec
        - section: "5. Attention"
          contents:
            - auto: bai-hoc/architecture-models/Transformer
            - auto: bai-hoc/architecture-models/BERT
            - auto: bai-hoc/architecture-models/Vision-Transformer
        - section: "6. Dense prediction"
          contents:
            - auto: bai-hoc/architecture-models/UNet

    - id: ai-optimize
      title: "AI Optimization"
      style: docked
      search: true
      collapse-level: 2
      contents:
        - bai-hoc/ai-optimize/index.qmd
        - bai-hoc/ai-optimize/lesson-01-modern-gpu-inference-architecture.qmd
        - bai-hoc/ai-optimize/lesson-02-onnx-fundamentals.qmd
        - bai-hoc/ai-optimize/lesson-03-onnx-runtime-deep-dive.qmd
        - bai-hoc/ai-optimize/lesson-04-tensorrt-internals.qmd
        - bai-hoc/ai-optimize/lesson-05-quantization-deep-dive.qmd
        - bai-hoc/ai-optimize/lesson-06-nvidia-triton-inference-server.qmd
        - bai-hoc/ai-optimize/lesson-07-profiling-and-benchmarking.qmd
        - bai-hoc/ai-optimize/lesson-08-safe-model-rollouts.qmd
        - bai-hoc/ai-optimize/lesson-09-llm-inference-systems.qmd
        - bai-hoc/ai-optimize/lesson-10-end-to-end-capstone.qmd

  page-footer:
    left: "© 2026 dythanh22 · Ghi chú học tập theo chuỗi"
    center:
      - href: bai-hoc/index.qmd
        text: Bài học
      - href: about.qmd
        text: Giới thiệu
      - href: bai-hoc/index.xml
        text: RSS
    right:
      - icon: github
        href: https://github.com/dythanh22/dythanh22.github.io

format:
  html:
    lang: vi
    theme:
      light: [cosmo, assets/css/custom.scss]
      dark: [darkly, assets/css/custom.scss]
    css: assets/css/custom.scss
    toc: true
    toc-depth: 3
    toc-title: "Mục lục"
    number-sections: false
    code-copy: true
    code-overflow: scroll
    highlight-style:
      light: github
      dark: github-dark
    fig-cap-location: bottom
    fig-align: center
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      - text: |
          <meta property="og:site_name" content="dythanh22">
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    include-after-body:
      - file: assets/js/lesson-progress.html
      - file: assets/js/home-continue.html

