<text x="370.0" y="24.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">Projection block: y = F(x) + Wₛ x khi chiều đổi</text>
<text x="370.0" y="46.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">Option B — 1×1 / tuyến tính trên shortcut; không ReLU trên skip</text>
