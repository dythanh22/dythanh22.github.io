<text x="370.0" y="280.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">Dùng tại ranh giới stage (64→128, …); identity ở mọi block còn lại</text>
