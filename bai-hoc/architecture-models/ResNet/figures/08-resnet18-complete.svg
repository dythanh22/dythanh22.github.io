<text x="450.0" y="200.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#1A1A1A" text-anchor="middle">y = ReLU(F(x)+x) trong stage  ·  y = ReLU(F(x)+Wₛx) tại chuyển stage</text>
<text x="450.0" y="228.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">18 lớp có trọng số · ~11.7M params (≪ VGG-16 ~138M nhờ GAP)</text>
<text x="450.0" y="255.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">Cam = stage có projection downsample; xanh = identity-only</text>
