<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="densenet-08-title">
<title id="densenet-08-title">Concat vs ResNet add</title>
<rect class="fig-bg" width="760" height="260" fill="none"/>

<text x="380.0" y="24.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">ResNet cộng vs DenseNet concat — khác biệt định nghĩa</text>
<rect x="40.0" y="60.0" width="320.0" height="130.0" rx="4" fill="#EEF1F5" stroke="#2F6FED" stroke-width="2"/>
<text x="200.0" y="102.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="middle">ResNet (add)</text>
<text x="200.0" y="120.2" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#1A1A1A" text-anchor="middle">x_ℓ = H_ℓ(x_{ℓ−1}) + x_{ℓ−1}</text>
<text x="200.0" y="138.2" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="500" fill="#5C6570" text-anchor="middle">Channel cố định · rộng</text>
<text x="200.0" y="155.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">Trộn feature vào cùng kênh</text>
<rect x="400.0" y="60.0" width="320.0" height="130.0" rx="4" fill="#EEF1F5" stroke="#C45C0A" stroke-width="2"/>
<text x="560.0" y="102.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="middle">DenseNet (concat)</text>
<text x="560.0" y="120.2" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#1A1A1A" text-anchor="middle">x_ℓ = H_ℓ([x₀,…,x_{ℓ−1}])</text>
<text x="560.0" y="138.2" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="500" fill="#5C6570" text-anchor="middle">Mỗi lớp mỏng (+k)</text>
<text x="560.0" y="155.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">Feature reuse tường minh</text>
<text x="380.0" y="220.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="500" fill="#5C6570" text-anchor="middle">Nhầm concat ↔ add = kiến trúc khác hẳn · DenseNet-B không expand về C gốc</text>
</svg>
