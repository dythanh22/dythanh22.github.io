<text x="410.0" y="44.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">Ví dụ nhỏ: C_in=2, C₀=4, k=2, 2×2 lớp → logits K=3</text>
