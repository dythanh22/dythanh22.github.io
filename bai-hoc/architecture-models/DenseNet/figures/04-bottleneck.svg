<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="240" viewBox="0 0 780 240" role="img" aria-labelledby="densenet-04-title">
<title id="densenet-04-title">DenseNet-B bottleneck</title>
<rect class="fig-bg" width="780" height="240" fill="#F7F8FA"/>
<style><![CDATA[.fig-bg { fill: #F7F8FA; }@media (prefers-color-scheme: dark) { .fig-bg { fill: #1B1F24; } }]]></style>
<text x="390.0" y="24.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">Bottleneck DenseNet-B: BN-ReLU-Conv1×1 (4k) → BN-ReLU-Conv3×3 (k)</text>
<text x="390.0" y="44.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">3×3 luôn thấy đúng 4k channel — chi phí không gian không phụ thuộc C</text>
<rect x="117.5" y="80.0" width="95.0" height="60.0" rx="4" fill="#EEF1F5" stroke="#2F6FED" stroke-width="2"/>
<text x="165.0" y="105.2" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#1A1A1A" text-anchor="middle">C_in</text>
<text x="165.0" y="122.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#5C6570" text-anchor="middle">vd. 256</text>
<rect x="242.5" y="80.0" width="130.0" height="60.0" rx="4" fill="#EEF1F5" stroke="#2F6FED" stroke-width="2"/>
<text x="307.5" y="105.2" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#1A1A1A" text-anchor="middle">1×1 reduce</text>
<text x="307.5" y="122.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#5C6570" text-anchor="middle">C → 4k=128</text>
<line x1="220.5" y1="110.0" x2="226.5" y2="110.0" stroke="#5C6570" stroke-width="2"/>
<polygon points="226.5,105.0 234.5,110.0 226.5,115.0" fill="#5C6570"/>
<rect x="402.5" y="80.0" width="130.0" height="60.0" rx="4" fill="#EEF1F5" stroke="#C45C0A" stroke-width="2"/>
<text x="467.5" y="105.2" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#1A1A1A" text-anchor="middle">3×3 produce</text>
<text x="467.5" y="122.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#5C6570" text-anchor="middle">4k → k=32</text>
<line x1="380.5" y1="110.0" x2="386.5" y2="110.0" stroke="#5C6570" stroke-width="2"/>
<polygon points="386.5,105.0 394.5,110.0 386.5,115.0" fill="#5C6570"/>
<rect x="562.5" y="80.0" width="100.0" height="60.0" rx="4" fill="#EEF1F5" stroke="#2F6FED" stroke-width="2"/>
<text x="612.5" y="105.2" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#1A1A1A" text-anchor="middle">+k maps</text>
<text x="612.5" y="122.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#5C6570" text-anchor="middle">→ concat</text>
<line x1="540.5" y1="110.0" x2="546.5" y2="110.0" stroke="#5C6570" stroke-width="2"/>
<polygon points="546.5,105.0 554.5,110.0 546.5,115.0" fill="#5C6570"/>
<text x="390.0" y="180.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">Khác ResNet bottleneck: không 1×1 expand · không cộng residual · chỉ phát k rồi concat</text>
<text x="390.0" y="205.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">cost ≈ (C·4k + 9·4k·k)·H·W  vs plain 9·C·k·H·W</text>
</svg>
