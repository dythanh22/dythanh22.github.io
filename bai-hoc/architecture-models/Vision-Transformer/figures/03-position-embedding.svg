<text x="410.0" y="24.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">Position: z₀ = x_patches + E_pos  (cộng, không concat)</text>
<text x="410.0" y="46.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">E_pos học được 1D · shape (1,N,D) broadcast batch · N = #patch + 1 ([CLS])</text>
