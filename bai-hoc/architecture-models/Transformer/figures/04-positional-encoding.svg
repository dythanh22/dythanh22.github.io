<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="290" viewBox="0 0 800 290" role="img" aria-labelledby="tf-04-title">
<title id="tf-04-title">Sinusoidal positional encoding</title>
<rect class="fig-bg" width="800" height="290" fill="#F7F8FA"/>
<style><![CDATA[.fig-bg { fill: #F7F8FA; }@media (prefers-color-scheme: dark) { .fig-bg { fill: #1B1F24; } }]]></style>
<text x="400.0" y="24.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">PE(pos, 2i)=sin(θ) · PE(pos, 2i+1)=cos(θ)</text>
<text x="400.0" y="46.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">θ = pos / 10000^{2i/d} · 0 tham số · ngoại suy chuỗi dài · quay tương đối</text>
<rect x="40.0" y="80.0" width="280.0" height="100.0" rx="4" fill="#EEF1F5" stroke="#2F6FED" stroke-width="2"/>
<text x="180.0" y="116.2" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#1A1A1A" text-anchor="middle">Chiều chẵn 2i</text>
<text x="180.0" y="133.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#1A1A1A" text-anchor="middle">sin(pos / 10000^{2i/d})</text>
<text x="180.0" y="151.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">tần số cao khi i nhỏ</text>
<rect x="360.0" y="80.0" width="280.0" height="100.0" rx="4" fill="#EEF1F5" stroke="#C45C0A" stroke-width="2"/>
<text x="500.0" y="116.2" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#1A1A1A" text-anchor="middle">Chiều lẻ 2i+1</text>
<text x="500.0" y="133.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#1A1A1A" text-anchor="middle">cos(pos / 10000^{2i/d})</text>
<text x="500.0" y="151.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">cùng θ · cặp đơn vị</text>
<rect x="680.0" y="90.0" width="100.0" height="80.0" rx="4" fill="#EEF1F5" stroke="#2F6FED" stroke-width="2"/>
<text x="730.0" y="125.2" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#1A1A1A" text-anchor="middle">∈ [−1,1]</text>
<text x="730.0" y="142.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">L × d</text>
<rect x="120.0" y="210.0" width="560.0" height="50.0" rx="4" fill="#EEF1F5" stroke="#C45C0A" stroke-width="2"/>
<text x="400.0" y="238.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#1A1A1A" text-anchor="middle">PE(pos+k) = R(k) · PE(pos)  ·  ma trận quay chỉ phụ thuộc offset k</text>
<text x="400.0" y="275.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">input(pos) = e(pos) + PE(pos) · đa tỷ lệ như đồng hồ</text>
</svg>
