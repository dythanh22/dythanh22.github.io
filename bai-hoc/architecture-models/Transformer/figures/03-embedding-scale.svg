<text x="400.0" y="270.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">Tra cứu chỉ mục (không matmul) · gradient thưa theo hàng W_E</text>
