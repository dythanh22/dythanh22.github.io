<text x="750.0" y="121.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="700" fill="#C45C0A" text-anchor="middle">Không scale:</text>
<text x="750.0" y="139.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="500" fill="#5C6570" text-anchor="middle">softmax → one-hot</text>
<text x="750.0" y="157.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="500" fill="#5C6570" text-anchor="middle">∇ ≈ 0</text>
<text x="750.0" y="175.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="600" fill="#1A1A1A" text-anchor="middle">Có √d_k: mượt</text>
<text x="420.0" y="280.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">O ∈ ℝ^{n×d_v} · mỗi hàng W tổng = 1 (tổ hợp lồi của V)</text>
</svg>
