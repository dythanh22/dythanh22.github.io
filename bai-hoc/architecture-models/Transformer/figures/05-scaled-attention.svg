<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img" aria-labelledby="tf-05-title">
<title id="tf-05-title">Scaled Dot-Product Attention</title>
<rect class="fig-bg" width="840" height="300" fill="none"/>

<text x="420.0" y="24.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">Attention(Q,K,V) = softmax(QKᵀ / √d_k) V</text>
<text x="420.0" y="46.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">Scale bắt buộc: Var(qᵀk)=d_k → chia √d_k đưa Var→1 · tránh softmax bão hòa</text>
