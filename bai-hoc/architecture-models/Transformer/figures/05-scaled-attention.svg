<text x="470.0" y="147.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">theo hàng</text>
<line x1="392.0" y1="135.0" x2="400.0" y2="135.0" stroke="#5C6570" stroke-width="2"/>
