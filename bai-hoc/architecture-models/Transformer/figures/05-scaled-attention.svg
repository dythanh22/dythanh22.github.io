<text x="195.0" y="130.6" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="middle">QKᵀ</text>
<text x="195.0" y="147.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">n×m</text>
<line x1="106.0" y1="102.5" x2="142.0" y2="127.0" stroke="#5C6570" stroke-width="1.5"/>
<line x1="106.0" y1="172.5" x2="142.0" y2="143.0" stroke="#5C6570" stroke-width="1.5"/>
