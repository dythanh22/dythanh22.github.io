<text x="330.0" y="147.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">d_k=64 → 8</text>
<line x1="252.0" y1="135.0" x2="260.0" y2="135.0" stroke="#5C6570" stroke-width="2"/>
