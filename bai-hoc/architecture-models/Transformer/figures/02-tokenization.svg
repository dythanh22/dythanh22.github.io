<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="280" viewBox="0 0 780 280" role="img" aria-labelledby="tf-02-title">
<title id="tf-02-title">Word-level tokenization</title>
<rect class="fig-bg" width="780" height="280" fill="none"/>

<text x="390.0" y="24.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">Tokenization cấp từ: text → ID · PAD=0 UNK=1 BOS=2 EOS=3</text>
<text x="390.0" y="46.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">Lowercase · tách khoảng trắng · vocab từ 4 · OOV → UNK</text>
<rect x="40.0" y="110.0" width="120.0" height="50.0" rx="4" fill="#EEF1F5" stroke="#2F6FED" stroke-width="2"/>
<text x="100.0" y="130.2" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#1A1A1A" text-anchor="middle">"The cat"</text>
<text x="100.0" y="147.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">raw text</text>
<rect x="200.0" y="110.0" width="100.0" height="50.0" rx="4" fill="#EEF1F5" stroke="#2F6FED" stroke-width="2"/>
<text x="250.0" y="129.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#1A1A1A" text-anchor="middle">lowercase</text>
<text x="250.0" y="147.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">split</text>
<line x1="172.0" y1="135.0" x2="180.0" y2="135.0" stroke="#5C6570" stroke-width="2"/>
<polygon points="180.0,130.0 188.0,135.0 180.0,140.0" fill="#5C6570"/>
<rect x="340.0" y="110.0" width="120.0" height="50.0" rx="4" fill="#EEF1F5" stroke="#C45C0A" stroke-width="2"/>
<text x="400.0" y="130.2" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#1A1A1A" text-anchor="middle">[2, 7, 12, 3]</text>
<text x="400.0" y="147.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">BOS … EOS</text>
<line x1="312.0" y1="135.0" x2="320.0" y2="135.0" stroke="#5C6570" stroke-width="2"/>
<polygon points="320.0,130.0 328.0,135.0 320.0,140.0" fill="#5C6570"/>
<rect x="174.0" y="195.0" width="90.0" height="50.0" rx="4" fill="#EEF1F5" stroke="#C45C0A" stroke-width="2"/>
<text x="219.0" y="215.2" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#1A1A1A" text-anchor="middle">PAD</text>
<text x="219.0" y="232.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">ID=0</text>
<rect x="288.0" y="195.0" width="90.0" height="50.0" rx="4" fill="#EEF1F5" stroke="#2F6FED" stroke-width="2"/>
<text x="333.0" y="215.2" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#1A1A1A" text-anchor="middle">UNK</text>
<text x="333.0" y="232.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">ID=1</text>
<rect x="402.0" y="195.0" width="90.0" height="50.0" rx="4" fill="#EEF1F5" stroke="#2F6FED" stroke-width="2"/>
<text x="447.0" y="215.2" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#1A1A1A" text-anchor="middle">BOS</text>
<text x="447.0" y="232.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">ID=2</text>
<rect x="516.0" y="195.0" width="90.0" height="50.0" rx="4" fill="#EEF1F5" stroke="#2F6FED" stroke-width="2"/>
<text x="561.0" y="215.2" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#1A1A1A" text-anchor="middle">EOS</text>
<text x="561.0" y="232.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">ID=3</text>
<text x="390.0" y="265.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">|V| = n + 4 · word_to_id / id_to_word song phương</text>
</svg>
