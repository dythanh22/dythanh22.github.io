<text x="620.0" y="250.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">maximize ELBO ≈ max evidence</text>
<text x="390.0" y="275.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">Chỉ recon → AE xác định · chỉ KL → bỏ qua dữ liệu · cả hai → VAE</text>
