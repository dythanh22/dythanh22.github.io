<title id="vae-06-title">ELBO loss</title>
<rect class="fig-bg" width="780" height="290" fill="none"/>

<text x="390.0" y="24.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">ELBO = 𝔼[log p_θ(x|z)] − D_KL(q_φ ‖ p(z))</text>
<text x="390.0" y="46.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">Minimize L = L_recon + D_KL  ·  cân bằng reconstruction vs regularization</text>
