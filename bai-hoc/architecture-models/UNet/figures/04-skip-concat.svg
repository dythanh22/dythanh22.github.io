<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320" role="img" aria-labelledby="unet-04-title">
<title id="unet-04-title">U-Net skip connection</title>
<rect class="fig-bg" width="860" height="320" fill="#F7F8FA"/>
<style><![CDATA[.fig-bg { fill: #F7F8FA; }@media (prefers-color-scheme: dark) { .fig-bg { fill: #1B1F24; } }]]></style>
<text x="430.0" y="24.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">Skip: center-crop encoder rồi Concat channel (không cộng)</text>
<text x="430.0" y="46.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">δ=(H_e−H_d)/2 · x_skip = Concat(x_crop, x_dec) ∈ ℝ^{(C_e+C_d)×H_d×W_d}</text>
<rect x="40.0" y="100.0" width="160.0" height="70.0" rx="4" fill="#EEF1F5" stroke="#2F6FED" stroke-width="2"/>
<text x="120.0" y="121.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="middle">x_enc</text>
<text x="120.0" y="138.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">C_e × H_e × W_e</text>
<text x="120.0" y="156.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="600" fill="#C45C0A" text-anchor="middle">H_e &gt; H_d</text>
<rect x="250.0" y="100.0" width="150.0" height="70.0" rx="4" fill="#EEF1F5" stroke="#C45C0A" stroke-width="2"/>
<text x="325.0" y="121.2" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#1A1A1A" text-anchor="middle">Center crop</text>
<text x="325.0" y="138.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">δ_h, δ_w</text>
<text x="325.0" y="156.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">→ H_d × W_d</text>
<line x1="206.0" y1="135.0" x2="236.0" y2="135.0" stroke="#5C6570" stroke-width="2"/>
<polygon points="236.0,130.0 244.0,135.0 236.0,140.0" fill="#5C6570"/>
<rect x="250.0" y="210.0" width="150.0" height="55.0" rx="4" fill="#EEF1F5" stroke="#2F6FED" stroke-width="2"/>
<text x="325.0" y="232.7" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#1A1A1A" text-anchor="middle">x_dec (up)</text>
<text x="325.0" y="250.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">C_d × H_d × W_d</text>
<rect x="460.0" y="140.0" width="150.0" height="70.0" rx="4" fill="#EEF1F5" stroke="#C45C0A" stroke-width="2"/>
<text x="535.0" y="161.9" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A" text-anchor="middle">Concat ⊕</text>
<text x="535.0" y="178.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">trục channel</text>
<text x="535.0" y="196.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#C45C0A" text-anchor="middle">C_e + C_d</text>
<line x1="408.0" y1="135.0" x2="450.0" y2="165.0" stroke="#C45C0A" stroke-width="2"/>
<line x1="408.0" y1="237.5" x2="450.0" y2="185.0" stroke="#5C6570" stroke-width="2"/>
<polygon points="450.0,175.0 458.0,170.0 458.0,180.0" fill="#C45C0A"/>
<rect x="660.0" y="140.0" width="150.0" height="70.0" rx="4" fill="#EEF1F5" stroke="#2F6FED" stroke-width="2"/>
<text x="735.0" y="161.6" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="middle">x_skip</text>
<text x="735.0" y="178.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">(C_e+C_d)×H_d×W_d</text>
<text x="735.0" y="196.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">→ 2×Conv</text>
<line x1="616.0" y1="175.0" x2="646.0" y2="175.0" stroke="#5C6570" stroke-width="2"/>
<polygon points="646.0,170.0 654.0,175.0 646.0,180.0" fill="#5C6570"/>
<text x="430.0" y="295.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">Cộng trộn không đảo · Concat giữ tín hiệu độc lập · ≠ ResNet residual</text>
</svg>
