<text x="640.0" y="227.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">H_out = 2H − 4 (valid)</text>
<text x="450.0" y="275.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">4 decoder block · phản chiếu encoder · channel 1024→512→256→128→64</text>
