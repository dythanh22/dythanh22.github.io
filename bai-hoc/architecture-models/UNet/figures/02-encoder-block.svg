<text x="440.0" y="46.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">Mỗi Conv: H→H−2 · hai đầu ra: skip (trước pool) + pool (xuống mức sau)</text>
