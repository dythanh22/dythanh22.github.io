<text x="390.0" y="170.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">Ch.1 Cell  ·  Ch.2 h₀  ·  Ch.3 Forward  ·  Ch.4 BPTT  ·  Ch.5 Vanish  ·  Ch.6 Complete</text>
