<rect x="461.0" y="70.0" width="120.0" height="56.0" rx="4" fill="#EEF1F5" stroke="#2F6FED" stroke-width="2"/>
<text x="521.0" y="93.2" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#1A1A1A" text-anchor="middle">Gradient</text>
<text x="521.0" y="110.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#5C6570" text-anchor="middle">vanish / explode</text>
<line x1="441.0" y1="98.0" x2="447.0" y2="98.0" stroke="#5C6570" stroke-width="2"/>
<polygon points="447.0,93.0 455.0,98.0 447.0,103.0" fill="#5C6570"/>
<rect x="607.0" y="70.0" width="110.0" height="56.0" rx="4" fill="#EEF1F5" stroke="#2F6FED" stroke-width="2"/>
<text x="662.0" y="93.2" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#1A1A1A" text-anchor="middle">Full RNN</text>
<text x="662.0" y="110.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#5C6570" text-anchor="middle">+ Wₕᵧ → yₜ</text>
<line x1="587.0" y1="98.0" x2="593.0" y2="98.0" stroke="#5C6570" stroke-width="2"/>
