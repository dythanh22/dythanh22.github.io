<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-labelledby="gan-06-title">
<title id="gan-06-title">Mode collapse detection</title>
<rect class="fig-bg" width="800" height="300" fill="#F7F8FA"/>
<style><![CDATA[.fig-bg { fill: #F7F8FA; }@media (prefers-color-scheme: dark) { .fig-bg { fill: #1B1F24; } }]]></style>
<text x="400.0" y="24.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">Mode collapse: diversity_score = (1/D) Σ_j σ_j</text>
<text x="400.0" y="46.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">σ_j = std theo feature · is_collapsed ⇔ score &lt; threshold</text>
<rect x="50.0" y="80.0" width="300.0" height="100.0" rx="4" fill="#EEF1F5" stroke="#2F6FED" stroke-width="2"/>
<text x="200.0" y="116.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="middle">Generator khỏe</text>
<text x="200.0" y="133.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">G(z₁) ≠ G(z₂) ≠ …</text>
<text x="200.0" y="151.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">σ_j lớn · phủ nhiều mode</text>
<rect x="450.0" y="80.0" width="300.0" height="100.0" rx="4" fill="#EEF1F5" stroke="#C45C0A" stroke-width="2"/>
<text x="600.0" y="116.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="middle">Mode collapse</text>
<text x="600.0" y="133.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">G(z₁) ≈ G(z₂) ≈ c</text>
<text x="600.0" y="151.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#C45C0A" text-anchor="middle">σ_j ≈ 0 · bỏ qua z</text>
<rect x="200.0" y="210.0" width="400.0" height="55.0" rx="4" fill="#EEF1F5" stroke="#C45C0A" stroke-width="2"/>
<text x="400.0" y="232.7" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#1A1A1A" text-anchor="middle">diversity_score = mean_j(std_j(X))</text>
<text x="400.0" y="250.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">threshold ~0.1 (norm [0,1]) · chẩn đoán, không sửa</text>
<text x="400.0" y="285.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">Complete / partial / intra-class collapse · D đánh giá từng mẫu, không ép coverage</text>
</svg>
