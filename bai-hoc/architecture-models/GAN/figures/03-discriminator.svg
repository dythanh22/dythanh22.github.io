<text x="645.0" y="148.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">∇_a L = D(x) − y  (BCE)</text>
<text x="645.0" y="166.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">logit a = log(D/(1−D))</text>
<text x="400.0" y="270.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">D maximize V · G minimize V · cùng critic đánh giá thật và fake</text>
