<text x="390.0" y="220.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">Nội suy: z_t=(1−t)z₁+tz₂ → morph mượt G(z₁)→G(z₂)</text>
