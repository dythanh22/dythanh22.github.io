<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-labelledby="gru-03-title">
<title id="gru-03-title">Update gate</title>
<rect class="fig-bg" width="800" height="300" fill="none"/>

<text x="400.0" y="24.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">Update gate: zₜ = σ(W_z · [hₜ₋₁, xₜ] + b_z)</text>
<text x="400.0" y="46.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">Leaky integration: hₜ = zₜ⊙hₜ₋₁ + (1−zₜ)⊙h̃ₜ  ·  z≈1 giữ cũ</text>
<rect x="40.0" y="100.0" width="100.0" height="50.0" rx="4" fill="#EEF1F5" stroke="#2F6FED" stroke-width="2"/>
<text x="90.0" y="128.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#1A1A1A" text-anchor="middle">[hₜ₋₁, xₜ]</text>
<rect x="180.0" y="100.0" width="95.0" height="50.0" rx="4" fill="#EEF1F5" stroke="#2F6FED" stroke-width="2"/>
<text x="227.5" y="119.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#1A1A1A" text-anchor="middle">W_z + b_z</text>
<text x="227.5" y="137.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">→ σ</text>
<line x1="150.0" y1="125.0" x2="162.0" y2="125.0" stroke="#5C6570" stroke-width="2"/>
<polygon points="162.0,120.0 170.0,125.0 162.0,130.0" fill="#5C6570"/>
<rect x="320.0" y="100.0" width="70.0" height="50.0" rx="4" fill="#EEF1F5" stroke="#C45C0A" stroke-width="2"/>
<text x="355.0" y="120.9" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A" text-anchor="middle">zₜ</text>
<text x="355.0" y="137.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">(0,1)</text>
<line x1="285.0" y1="125.0" x2="302.0" y2="125.0" stroke="#5C6570" stroke-width="2"/>
<polygon points="302.0,120.0 310.0,125.0 302.0,130.0" fill="#5C6570"/>
<rect x="162.0" y="185.0" width="140.0" height="70.0" rx="4" fill="#EEF1F5" stroke="#C45C0A" stroke-width="2"/>
<text x="232.0" y="206.6" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="middle">z≈1</text>
<text x="232.0" y="223.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">hₜ ≈ hₜ₋₁</text>
<text x="232.0" y="241.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="500" fill="#C45C0A" text-anchor="middle">bộ nhớ</text>
<rect x="330.0" y="185.0" width="140.0" height="70.0" rx="4" fill="#EEF1F5" stroke="#2F6FED" stroke-width="2"/>
<text x="400.0" y="206.6" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="middle">z≈0.5</text>
<text x="400.0" y="223.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">trộn 50/50</text>
<text x="400.0" y="241.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="500" fill="#2F6FED" text-anchor="middle">mượt</text>
<rect x="498.0" y="185.0" width="140.0" height="70.0" rx="4" fill="#EEF1F5" stroke="#C45C0A" stroke-width="2"/>
<text x="568.0" y="206.6" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="middle">z≈0</text>
<text x="568.0" y="223.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">hₜ ≈ h̃ₜ</text>
<text x="568.0" y="241.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="500" fill="#C45C0A" text-anchor="middle">thay thế</text>
<text x="400.0" y="280.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">z + (1−z) = 1 mỗi chiều · timescale thích ứng độc lập theo chiều</text>
</svg>
