<text x="660.0" y="116.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="600" fill="#1A1A1A" text-anchor="middle">score(x,y)=P(xy)/(P(x)P(y))</text>
<text x="660.0" y="134.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">xây vocab offline</text>
