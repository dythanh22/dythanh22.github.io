<text x="270.0" y="156.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">start&gt;0 → ##</text>
<line x1="156.0" y1="135.0" x2="176.0" y2="135.0" stroke="#5C6570" stroke-width="2"/>
