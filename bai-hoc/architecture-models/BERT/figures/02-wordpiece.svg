<title id="bert-02-title">WordPiece tokenization</title>
<rect class="fig-bg" width="800" height="290" fill="none"/>

<text x="400.0" y="24.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">WordPiece: greedy longest-match · ## cho continuation</text>
<text x="400.0" y="46.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">unhappy → un + ##happy · thất bại bất kỳ vị trí → toàn từ = [UNK]</text>
