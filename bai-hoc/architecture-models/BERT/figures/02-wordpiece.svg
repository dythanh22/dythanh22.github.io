<text x="460.0" y="187.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">continuation</text>
<line x1="358.0" y1="125.0" x2="390.0" y2="95.0" stroke="#5C6570" stroke-width="2"/>
<line x1="358.0" y1="145.0" x2="390.0" y2="175.0" stroke="#C45C0A" stroke-width="2"/>
