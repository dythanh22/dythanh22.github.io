<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img" aria-labelledby="bert-08-title">
<title id="bert-08-title">Fine-tuning architecture</title>
<rect class="fig-bg" width="840" height="300" fill="#F7F8FA"/>
<style><![CDATA[.fig-bg { fill: #F7F8FA; }@media (prefers-color-scheme: dark) { .fig-bg { fill: #1B1F24; } }]]></style>
<text x="420.0" y="24.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">Fine-tune: encoder pretrained + head nhẹ · end-to-end</text>
<text x="420.0" y="46.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">Sequence: logits = h_CLS W + b · Token: logits_i = h_i W + b (W chia sẻ)</text>
<rect x="40.0" y="70.0" width="340.0" height="110.0" rx="4" fill="#EEF1F5" stroke="#2F6FED" stroke-width="2"/>
<text x="210.0" y="102.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="middle">Phân loại chuỗi</text>
<text x="210.0" y="119.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">đọc h_CLS (sau pooler)</text>
<text x="210.0" y="137.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">W ∈ ℝ^{H×K} · 1 dự đoán/mẫu</text>
<text x="210.0" y="155.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">sentiment, NLI, topic…</text>
<rect x="440.0" y="70.0" width="340.0" height="110.0" rx="4" fill="#EEF1F5" stroke="#C45C0A" stroke-width="2"/>
<text x="610.0" y="102.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="middle">Phân loại token</text>
<text x="610.0" y="119.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">đọc mọi h_i (không chỉ CLS)</text>
<text x="610.0" y="137.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">cùng W mọi vị trí</text>
<text x="610.0" y="155.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">NER, POS, slot filling…</text>
<rect x="173.0" y="210.0" width="100.0" height="50.0" rx="4" fill="#EEF1F5" stroke="#2F6FED" stroke-width="2"/>
<text x="223.0" y="229.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#1A1A1A" text-anchor="middle">Pretrain</text>
<text x="223.0" y="247.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">MLM+NSP</text>
<rect x="301.0" y="210.0" width="110.0" height="50.0" rx="4" fill="#EEF1F5" stroke="#2F6FED" stroke-width="2"/>
<text x="356.0" y="229.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#1A1A1A" text-anchor="middle">Encoder</text>
<text x="356.0" y="247.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">mọi θ cập nhật</text>
<line x1="279.0" y1="235.0" x2="287.0" y2="235.0" stroke="#5C6570" stroke-width="2"/>
<polygon points="287.0,230.0 295.0,235.0 287.0,240.0" fill="#5C6570"/>
<rect x="439.0" y="210.0" width="100.0" height="50.0" rx="4" fill="#EEF1F5" stroke="#2F6FED" stroke-width="2"/>
<text x="489.0" y="229.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#1A1A1A" text-anchor="middle">Head</text>
<text x="489.0" y="247.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">init mới</text>
<line x1="417.0" y1="235.0" x2="425.0" y2="235.0" stroke="#5C6570" stroke-width="2"/>
<polygon points="425.0,230.0 433.0,235.0 425.0,240.0" fill="#5C6570"/>
<rect x="567.0" y="210.0" width="100.0" height="50.0" rx="4" fill="#EEF1F5" stroke="#2F6FED" stroke-width="2"/>
<text x="617.0" y="229.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#1A1A1A" text-anchor="middle">CE loss</text>
<text x="617.0" y="247.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">∇ end-to-end</text>
<line x1="545.0" y1="235.0" x2="553.0" y2="235.0" stroke="#5C6570" stroke-width="2"/>
<polygon points="553.0,230.0 561.0,235.0 553.0,240.0" fill="#5C6570"/>
<text x="420.0" y="280.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">≠ ELMo feature-based: BERT fine-tune không đóng băng encoder (trừ khi freeze chủ đích)</text>
</svg>
