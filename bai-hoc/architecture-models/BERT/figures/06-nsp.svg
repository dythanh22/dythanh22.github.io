<text x="400.0" y="24.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">NSP: h_CLS → W∈ℝ^{H×2} → IsNext / NotNext</text>
