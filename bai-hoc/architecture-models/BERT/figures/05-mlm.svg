<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="310" viewBox="0 0 840 310" role="img" aria-labelledby="bert-05-title">
<title id="bert-05-title">Masked Language Modeling</title>
<rect class="fig-bg" width="840" height="310" fill="#F7F8FA"/>
<style><![CDATA[.fig-bg { fill: #F7F8FA; }@media (prefers-color-scheme: dark) { .fig-bg { fill: #1B1F24; } }]]></style>
<text x="420.0" y="24.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">MLM: che ~15% token · chiến lược 80-10-10 · loss chỉ tại ℳ</text>
<text x="420.0" y="46.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">Bidirectional (không causal mask) · z_i = h_i W + b · CE trên vị trí masked</text>
<rect x="120.0" y="75.0" width="180.0" height="90.0" rx="4" fill="#EEF1F5" stroke="#C45C0A" stroke-width="2"/>
<text x="210.0" y="107.6" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A" text-anchor="middle">80%</text>
<text x="210.0" y="124.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">[MASK]</text>
<text x="210.0" y="141.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">tín hiệu rõ</text>
<rect x="330.0" y="75.0" width="180.0" height="90.0" rx="4" fill="#EEF1F5" stroke="#2F6FED" stroke-width="2"/>
<text x="420.0" y="107.6" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A" text-anchor="middle">10%</text>
<text x="420.0" y="124.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">random</text>
<text x="420.0" y="141.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">không tin token</text>
<rect x="540.0" y="75.0" width="180.0" height="90.0" rx="4" fill="#EEF1F5" stroke="#2F6FED" stroke-width="2"/>
<text x="630.0" y="107.6" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A" text-anchor="middle">10%</text>
<text x="630.0" y="124.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">giữ nguyên</text>
<text x="630.0" y="141.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">thu hẹp mismatch</text>
<rect x="80.0" y="195.0" width="320.0" height="55.0" rx="4" fill="#EEF1F5" stroke="#2F6FED" stroke-width="2"/>
<text x="240.0" y="217.3" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#1A1A1A" text-anchor="middle">Chọn |ℳ|≈0.15n vị trí</text>
<text x="240.0" y="235.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">nhãn khác = −100 (ignore)</text>
<rect x="440.0" y="195.0" width="320.0" height="55.0" rx="4" fill="#EEF1F5" stroke="#C45C0A" stroke-width="2"/>
<text x="600.0" y="217.3" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#1A1A1A" text-anchor="middle">L_MLM = −(1/|ℳ|) Σ log Softmax(z_i)[x_i]</text>
<text x="600.0" y="235.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">chỉ gradient tại vị trí masked</text>
<text x="420.0" y="280.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">100% [MASK] → train–test mismatch · 15% cân bằng tín hiệu vs ngữ cảnh còn lại</text>
</svg>
