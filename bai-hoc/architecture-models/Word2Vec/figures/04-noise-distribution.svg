<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="740" height="240" viewBox="0 0 740 240" role="img" aria-labelledby="word2vec-04-title">
<title id="word2vec-04-title">Noise distribution alpha 0.75</title>
<rect class="fig-bg" width="740" height="240" fill="none"/>

<text x="370.0" y="24.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">Noise Pₙ(w) ∝ count(w)^α · α=0.75 làm phẳng Zipf</text>
<text x="370.0" y="44.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">α=0 uniform · α=1 unigram · 0.75 = compromise thực nghiệm</text>
<rect x="157.0" y="80.0" width="120.0" height="60.0" rx="4" fill="#EEF1F5" stroke="#2F6FED" stroke-width="2"/>
<text x="217.0" y="105.2" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#1A1A1A" text-anchor="middle">Unigram α=1</text>
<text x="217.0" y="122.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#5C6570" text-anchor="middle">[0.90, .09, .01]</text>
<rect x="305.0" y="80.0" width="130.0" height="60.0" rx="4" fill="#EEF1F5" stroke="#C45C0A" stroke-width="2"/>
<text x="370.0" y="105.2" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#1A1A1A" text-anchor="middle">Flattened 0.75</text>
<text x="370.0" y="122.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#5C6570" text-anchor="middle">[0.83, .15, .03]</text>
<line x1="285.0" y1="110.0" x2="289.0" y2="110.0" stroke="#5C6570" stroke-width="2"/>
<polygon points="289.0,105.0 297.0,110.0 289.0,115.0" fill="#5C6570"/>
<rect x="463.0" y="80.0" width="120.0" height="60.0" rx="4" fill="#EEF1F5" stroke="#2F6FED" stroke-width="2"/>
<text x="523.0" y="105.2" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#1A1A1A" text-anchor="middle">Uniform α=0</text>
<text x="523.0" y="122.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#5C6570" text-anchor="middle">[1/3, 1/3, 1/3]</text>
<line x1="443.0" y1="110.0" x2="447.0" y2="110.0" stroke="#5C6570" stroke-width="2"/>
<polygon points="447.0,105.0 455.0,110.0 447.0,115.0" fill="#5C6570"/>
<text x="370.0" y="180.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">counts [100,10,1] · Z=Σ count^α · scale-invariant · order-preserving</text>
<text x="370.0" y="205.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">Chuẩn hóa SAU lũy thừa — không (count/Σ)^α rồi dừng</text>
</svg>
