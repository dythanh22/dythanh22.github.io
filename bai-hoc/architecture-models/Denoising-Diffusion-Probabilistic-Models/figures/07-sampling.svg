<text x="240.0" y="250.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">Không song song theo t (phụ thuộc tuần tự)</text>
