<text x="600.0" y="250.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">DDPM: ổn định · không mode collapse</text>
<text x="420.0" y="285.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">σ_t² = β_t (Ho) hoặc β̃_t posterior · inference mode, không gradient</text>
