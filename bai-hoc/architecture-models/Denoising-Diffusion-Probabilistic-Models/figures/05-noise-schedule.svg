<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" role="img" aria-labelledby="ddpm-05-title">
<title id="ddpm-05-title">Noise schedule</title>
<rect class="fig-bg" width="820" height="300" fill="none"/>

<text x="410.0" y="24.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">Noise schedule: β_t → α_t=1−β_t → ᾱ_t=∏α_s</text>
<text x="410.0" y="46.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">Linear (Ho 2020) vs Cosine (Nichol 2021) · T=1000, β₁=10⁻⁴, β_T=0.02</text>
<rect x="50.0" y="80.0" width="320.0" height="110.0" rx="4" fill="#EEF1F5" stroke="#C45C0A" stroke-width="2"/>
<text x="210.0" y="112.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="middle">Linear schedule</text>
<text x="210.0" y="129.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#1A1A1A" text-anchor="middle">β_t = β₁ + (t−1)/(T−1)(β_T−β₁)</text>
<text x="210.0" y="147.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#C45C0A" text-anchor="middle">ᾱ lãng phí đầu/cuối</text>
<text x="210.0" y="165.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">vùng giữa hữu ích hẹp</text>
<rect x="430.0" y="80.0" width="340.0" height="110.0" rx="4" fill="#EEF1F5" stroke="#2F6FED" stroke-width="2"/>
<text x="600.0" y="112.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="middle">Cosine schedule</text>
<text x="600.0" y="129.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#1A1A1A" text-anchor="middle">ᾱ_t = f(t)/f(0), f=cos²(…)</text>
<text x="600.0" y="147.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">s=0.008 · SNR mượt hơn</text>
<text x="600.0" y="165.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">nhiều t ở vùng giữa</text>
<rect x="150.0" y="220.0" width="520.0" height="50.0" rx="4" fill="#EEF1F5" stroke="#2F6FED" stroke-width="2"/>
<text x="410.0" y="248.8" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#1A1A1A" text-anchor="middle">ᾱ_t: tín hiệu còn lại · √ᾱ_t scale x₀ · √(1−ᾱ_t) scale ε · ᾱ_T≈0</text>
<text x="410.0" y="285.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">Schedule cố định (không học) · xương sống mọi phép tính downstream</text>
</svg>
