<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img" aria-labelledby="ddpm-04-title">
<title id="ddpm-04-title">Reverse diffusion step</title>
<rect class="fig-bg" width="840" height="300" fill="#F7F8FA"/>
<style><![CDATA[.fig-bg { fill: #F7F8FA; }@media (prefers-color-scheme: dark) { .fig-bg { fill: #1B1F24; } }]]></style>
<text x="420.0" y="24.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">Reverse: x_{t-1} từ ε_θ(x_t,t) + σ_t z</text>
<text x="420.0" y="46.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">μ_θ = α_t^{-1/2}(x_t − (1−α_t)/√(1−ᾱ_t) · ε_θ) · z=0 khi t=1</text>
