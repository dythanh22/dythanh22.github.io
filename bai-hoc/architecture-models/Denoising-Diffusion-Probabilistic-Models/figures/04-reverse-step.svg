<text x="750.0" y="134.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="500" fill="#5C6570" text-anchor="middle">t&gt;1: z~𝒩</text>
<text x="750.0" y="152.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="500" fill="#C45C0A" text-anchor="middle">t=1: z=0</text>
<text x="750.0" y="170.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">(cuối tất định)</text>
<text x="420.0" y="280.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">Dự đoán ε hiệu quả hơn dự đoán x₀ · đa dạng từ σ_t z mỗi bước</text>
</svg>
