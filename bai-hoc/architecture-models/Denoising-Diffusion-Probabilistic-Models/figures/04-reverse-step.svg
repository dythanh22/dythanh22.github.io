<text x="410.0" y="147.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C6570" text-anchor="middle">trừ nhiễu · /√α_t</text>
<line x1="294.0" y1="115.0" x2="308.0" y2="115.0" stroke="#5C6570" stroke-width="2"/>
