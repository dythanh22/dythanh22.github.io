<text x="319.5" y="245.9" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A" text-anchor="middle">→</text>
<line x1="270.0" y1="241.0" x2="278.0" y2="241.0" stroke="#5C6570" stroke-width="2"/>
<polygon points="278.0,236.0 286.0,241.0 278.0,246.0" fill="#5C6570"/>
