<text x="410.0" y="245.2" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#1A1A1A" text-anchor="middle">x_t</text>
<line x1="353.0" y1="241.0" x2="361.0" y2="241.0" stroke="#5C6570" stroke-width="2"/>
<polygon points="361.0,236.0 369.0,241.0 361.0,246.0" fill="#5C6570"/>
<rect x="473.0" y="220.0" width="55.0" height="42.0" rx="4" fill="#EEF1F5" stroke="#2F6FED" stroke-width="2"/>
<text x="500.5" y="245.9" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A" text-anchor="middle">→</text>
<line x1="451.0" y1="241.0" x2="459.0" y2="241.0" stroke="#5C6570" stroke-width="2"/>
