<text x="591.0" y="245.2" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#1A1A1A" text-anchor="middle">x_T</text>
<line x1="534.0" y1="241.0" x2="542.0" y2="241.0" stroke="#5C6570" stroke-width="2"/>
<polygon points="542.0,236.0 550.0,241.0 542.0,246.0" fill="#5C6570"/>
<text x="410.0" y="285.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="500" fill="#5C6570" text-anchor="middle">Cùng schedule ᾱ_t · train học denoiser · sample chạy reverse Markov</text>
