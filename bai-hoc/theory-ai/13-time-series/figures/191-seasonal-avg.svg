<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="sa-191-title">
  <title id="sa-191-title">Seasonal averages; Jan=125, Feb=115, Dec=210</title>
  <style>
    .ink { fill: #1A1A1A; }
    .muted { fill: #5C6570; }
    .accent { fill: none; stroke: #2F6FED; }
    .accent-fill { fill: #2F6FED; }
    .hi { fill: none; stroke: #C45C0A; }
    .hi-fill { fill: #C45C0A; }
    .axis { fill: none; stroke: #1A1A1A; }
    .guide { fill: none; stroke: #5C6570; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; stroke: none; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; }
      .muted { fill: #9AA0A6; }
      .accent { stroke: #8AB4F8; }
      .accent-fill { fill: #8AB4F8; }
      .hi { stroke: #F9AB00; }
      .hi-fill { fill: #F9AB00; }
      .axis { stroke: #E8EAED; }
      .guide { stroke: #9AA0A6; }
    }
  </style>
  <text id="sa-191-heading" class="ink" x="360" y="26" text-anchor="middle" font-size="15" font-weight="600">Seasonal average over 3 years (12 months)</text>

  <!-- values: 125,115,135,145,155,165,175,170,160,150,140,210 -->
  <!-- plot x0=56, bar w=40, gap=12, stride=52; y_base=310; h=(v-80)*1.05; y=310-h -->
  <line class="axis" x1="48" y1="48" x2="48" y2="310" stroke-width="1.25"/>
  <line class="axis" x1="48" y1="310" x2="696" y2="310" stroke-width="1.25"/>
  <text class="muted" x="40" y="314" text-anchor="end" font-size="11">80</text>
  <text class="muted" x="40" y="177" text-anchor="end" font-size="11">150</text>
  <text class="muted" x="40" y="56" text-anchor="end" font-size="11">220</text>
  <line class="guide" x1="48" y1="173.5" x2="696" y2="173.5" stroke-width="1" stroke-dasharray="4 4" opacity="0.45"/>

  <!-- Jan 125 highlight accent; h=(125-80)*1.05=47.25; y=262.75 -->
  <rect class="accent-fill" x="56" y="262.8" width="40" height="47.2" rx="2"/>
  <text class="accent-fill" x="76" y="254" text-anchor="middle" font-size="11">125</text>
  <!-- Feb 115; h=36.75; y=273.25 -->
  <rect class="accent-fill" x="108" y="273.3" width="40" height="36.8" rx="2"/>
  <text class="accent-fill" x="128" y="265" text-anchor="middle" font-size="11">115</text>
  <!-- Mar..Nov muted -->
  <rect class="muted" x="160" y="252.3" width="40" height="57.8" rx="2" opacity="0.55"/>
  <text class="muted" x="180" y="244" text-anchor="middle" font-size="11">135</text>
  <rect class="muted" x="212" y="241.8" width="40" height="68.3" rx="2" opacity="0.55"/>
  <text class="muted" x="232" y="233" text-anchor="middle" font-size="11">145</text>
  <rect class="muted" x="264" y="231.3" width="40" height="78.8" rx="2" opacity="0.55"/>
  <text class="muted" x="284" y="223" text-anchor="middle" font-size="11">155</text>
  <rect class="muted" x="316" y="220.8" width="40" height="89.3" rx="2" opacity="0.55"/>
  <text class="muted" x="336" y="213" text-anchor="middle" font-size="11">165</text>
  <rect class="muted" x="368" y="210.3" width="40" height="99.8" rx="2" opacity="0.55"/>
  <text class="muted" x="388" y="202" text-anchor="middle" font-size="11">175</text>
  <rect class="muted" x="420" y="215.5" width="40" height="94.5" rx="2" opacity="0.55"/>
  <text class="muted" x="440" y="207" text-anchor="middle" font-size="11">170</text>
  <rect class="muted" x="472" y="226.0" width="40" height="84.0" rx="2" opacity="0.55"/>
  <text class="muted" x="492" y="218" text-anchor="middle" font-size="11">160</text>
  <rect class="muted" x="524" y="236.5" width="40" height="73.5" rx="2" opacity="0.55"/>
  <text class="muted" x="544" y="228" text-anchor="middle" font-size="11">150</text>
  <rect class="muted" x="576" y="247.0" width="40" height="63.0" rx="2" opacity="0.55"/>
  <text class="muted" x="596" y="239" text-anchor="middle" font-size="11">140</text>
  <!-- Dec 210 hi; h=(210-80)*1.05=136.5; y=173.5 -->
  <rect class="hi-fill" x="628" y="173.5" width="40" height="136.5" rx="2"/>
  <text class="hi-fill" x="648" y="165" text-anchor="middle" font-size="11">210</text>

  <text class="muted" x="76" y="328" text-anchor="middle" font-size="11">Jan</text>
  <text class="muted" x="128" y="328" text-anchor="middle" font-size="11">Feb</text>
  <text class="muted" x="180" y="328" text-anchor="middle" font-size="11">Mar</text>
  <text class="muted" x="232" y="328" text-anchor="middle" font-size="11">Apr</text>
  <text class="muted" x="284" y="328" text-anchor="middle" font-size="11">May</text>
  <text class="muted" x="336" y="328" text-anchor="middle" font-size="11">Jun</text>
  <text class="muted" x="388" y="328" text-anchor="middle" font-size="11">Jul</text>
  <text class="muted" x="440" y="328" text-anchor="middle" font-size="11">Aug</text>
  <text class="muted" x="492" y="328" text-anchor="middle" font-size="11">Sep</text>
  <text class="muted" x="544" y="328" text-anchor="middle" font-size="11">Oct</text>
  <text class="muted" x="596" y="328" text-anchor="middle" font-size="11">Nov</text>
  <text class="muted" x="648" y="328" text-anchor="middle" font-size="11">Dec</text>

  <text class="muted" x="360" y="360" text-anchor="middle" font-size="12">Jan = 125, Feb = 115, Dec = 210 (3-year means)</text>
  <text class="muted" x="360" y="382" text-anchor="middle" font-size="12">Full result [125, 115, 135, 145, 155, 165, 175, 170, 160, 150, 140, 210]</text>
</svg>
