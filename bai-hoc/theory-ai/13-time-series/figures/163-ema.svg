  <text class="muted" x="540" y="328" text-anchor="middle" font-size="12">5</text>
  <text class="ink" x="320" y="348" text-anchor="middle" font-size="12">t</text>

  <circle class="accent" cx="88" cy="372" r="4"/>
  <text class="ink" x="100" y="376" text-anchor="start" font-size="12" stroke="none">y = [100, 105, 103, 108, 110]</text>
  <circle class="hi" cx="360" cy="372" r="4"/>
  <text class="ink" x="372" y="376" text-anchor="start" font-size="12" stroke="none">EMA (&#x03B1; = 0.3)</text>
