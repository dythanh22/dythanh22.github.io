<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="ema-163-title">
  <title id="ema-163-title">EMA alpha=0.3 on [100, 105, 103, 108, 110] yields [100, 101.5, 101.95, 103.765, 105.636]</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .accent-line { fill: none; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .hi-line { fill: none; stroke: #C45C0A; }
    .axis { fill: none; stroke: #1A1A1A; }
    .grid { fill: none; stroke: #5C6570; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    
  </style>
  <text id="ema-163-heading" class="ink" x="320" y="26" text-anchor="middle" font-size="15" font-weight="600">EMA (&#x03B1; = 0.3): y vs smoothed path</text>

  <line class="grid" x1="72" y1="290" x2="560" y2="290" stroke-width="1" stroke-dasharray="4 4" opacity="0.35"/>
  <line class="grid" x1="72" y1="244" x2="560" y2="244" stroke-width="1" stroke-dasharray="4 4" opacity="0.35"/>
  <line class="grid" x1="72" y1="198" x2="560" y2="198" stroke-width="1" stroke-dasharray="4 4" opacity="0.35"/>
  <line class="grid" x1="72" y1="152" x2="560" y2="152" stroke-width="1" stroke-dasharray="4 4" opacity="0.35"/>
  <line class="grid" x1="72" y1="106" x2="560" y2="106" stroke-width="1" stroke-dasharray="4 4" opacity="0.35"/>
  <line class="grid" x1="72" y1="60" x2="560" y2="60" stroke-width="1" stroke-dasharray="4 4" opacity="0.35"/>

  <line class="axis" x1="72" y1="290" x2="560" y2="290" stroke-width="1.25"/>
  <line class="axis" x1="72" y1="56" x2="72" y2="290" stroke-width="1.25"/>

  <text class="muted" x="64" y="294" text-anchor="end" font-size="11">100</text>
  <text class="muted" x="64" y="248" text-anchor="end" font-size="11">102</text>
  <text class="muted" x="64" y="202" text-anchor="end" font-size="11">104</text>
