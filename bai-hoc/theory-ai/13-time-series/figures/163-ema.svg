  <text class="hi" x="338" y="262" text-anchor="start" font-size="11" stroke="none">101.95</text>
  <text class="hi" x="430" y="222" text-anchor="middle" font-size="11" stroke="none">103.765</text>
  <text class="hi" x="540" y="178" text-anchor="middle" font-size="11" stroke="none">105.636</text>

  <text class="muted" x="100" y="328" text-anchor="middle" font-size="12">1</text>
