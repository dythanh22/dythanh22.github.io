<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="seasavg-191-title">
  <title id="seasavg-191-title">Seasonal averages of 12 months: Jan=125, Feb=115, ..., Dec=210; trough Feb, peak Dec</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: none; }
    .hi { fill: #C45C0A; stroke: none; }
    .axis { fill: none; stroke: #1A1A1A; }
    .grid { fill: none; stroke: #5C6570; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
