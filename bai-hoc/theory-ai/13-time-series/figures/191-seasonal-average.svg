      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; }
      .hi { fill: #F9AB00; }
      .axis { stroke: #E8EAED; }
      .grid { stroke: #9AA0A6; }
    }
  </style>

