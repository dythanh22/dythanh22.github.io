<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="mm-188-title">
  <title id="mm-188-title">Moving median w=3 vs outlier 100</title>
  <style>
    .ink { fill: #1A1A1A; }
    .muted { fill: #5C6570; }
    .accent { fill: none; stroke: #2F6FED; }
    .accent-fill { fill: #2F6FED; }
    .hi { fill: none; stroke: #C45C0A; }
    .hi-fill { fill: #C45C0A; }
    .axis { fill: none; stroke: #1A1A1A; }
    .guide { fill: none; stroke: #5C6570; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; stroke: none; }
    
  </style>
  <text id="mm-188-heading" class="ink" x="360" y="26" text-anchor="middle" font-size="15" font-weight="600">Moving median, w = 3: outlier 100 barely moves MM</text>

  <!-- y=0..100 -> pixel 330..60; y_px = 330 - v*2.7; t=1..7 x=90+85*(t-1) -->
  <line class="axis" x1="70" y1="50" x2="70" y2="330" stroke-width="1.25"/>
  <line class="axis" x1="70" y1="330" x2="690" y2="330" stroke-width="1.25"/>
  <text class="muted" x="22" y="190" text-anchor="middle" font-size="12" transform="rotate(-90 22 190)">value</text>
  <text class="muted" x="62" y="334" text-anchor="end" font-size="11">0</text>
  <text class="muted" x="62" y="200" text-anchor="end" font-size="11">50</text>
  <text class="muted" x="62" y="64" text-anchor="end" font-size="11">100</text>
  <line class="guide" x1="70" y1="60" x2="690" y2="60" stroke-width="1" stroke-dasharray="4 4" opacity="0.55"/>

  <!-- data: 10,15,12,100,14,13,16 at y 303, 289.5, 297.6, 60, 292.2, 294.9, 286.8 -->
  <!-- x: 90,175,260,345,430,515,600 -->
  <path class="hi" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round" d="M 90,303 L 175,289.5 L 260,297.6 L 345,60 L 430,292.2 L 515,294.9 L 600,286.8"/>
  <circle class="hi-fill" cx="90" cy="303" r="4" data-allow-overlap="1"/>
  <circle class="hi-fill" cx="175" cy="289.5" r="4" data-allow-overlap="1"/>
  <circle class="hi-fill" cx="260" cy="297.6" r="4" data-allow-overlap="1"/>
  <circle class="hi-fill" cx="345" cy="60" r="5.5" data-allow-overlap="1"/>
  <circle class="hi-fill" cx="430" cy="292.2" r="4" data-allow-overlap="1"/>
  <circle class="hi-fill" cx="515" cy="294.9" r="4" data-allow-overlap="1"/>
  <circle class="hi-fill" cx="600" cy="286.8" r="4" data-allow-overlap="1"/>
  <text class="hi-fill" x="368" y="52" text-anchor="start" font-size="12">y=100</text>

  <!-- MM starts t=3: 12,15,14,14,14 at y 297.6, 289.5, 292.2, 292.2, 292.2 -->
  <path class="accent" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" d="M 260,297.6 L 345,289.5 L 430,292.2 L 515,292.2 L 600,292.2"/>
  <circle class="accent-fill" cx="260" cy="297.6" r="4.5" data-allow-overlap="1"/>
  <circle class="accent-fill" cx="345" cy="289.5" r="4.5" data-allow-overlap="1"/>
  <circle class="accent-fill" cx="430" cy="292.2" r="4.5" data-allow-overlap="1"/>
  <circle class="accent-fill" cx="515" cy="292.2" r="4.5" data-allow-overlap="1"/>
  <circle class="accent-fill" cx="600" cy="292.2" r="4.5" data-allow-overlap="1"/>

  <text class="muted" x="90" y="288" text-anchor="middle" font-size="11">10</text>
  <text class="muted" x="175" y="276" text-anchor="middle" font-size="11">15</text>
  <text class="accent-fill" x="260" y="276" text-anchor="middle" font-size="11">MM=12</text>
  <text class="accent-fill" x="345" y="276" text-anchor="middle" font-size="11">MM=15</text>
  <text class="muted" x="430" y="276" text-anchor="middle" font-size="11">14</text>
  <text class="muted" x="515" y="276" text-anchor="middle" font-size="11">14</text>
  <text class="muted" x="600" y="276" text-anchor="middle" font-size="11">14</text>

  <text class="muted" x="90" y="350" text-anchor="middle" font-size="12">t=1</text>
  <text class="muted" x="175" y="350" text-anchor="middle" font-size="12">t=2</text>
  <text class="muted" x="260" y="350" text-anchor="middle" font-size="12">t=3</text>
  <text class="muted" x="345" y="350" text-anchor="middle" font-size="12">t=4</text>
  <text class="muted" x="430" y="350" text-anchor="middle" font-size="12">t=5</text>
  <text class="muted" x="515" y="350" text-anchor="middle" font-size="12">t=6</text>
  <text class="muted" x="600" y="350" text-anchor="middle" font-size="12">t=7</text>

  <rect class="hi-fill" x="96" y="368" width="10" height="10" rx="2"/>
  <text class="muted" x="112" y="377" text-anchor="start" font-size="12">y_t  [NaN, NaN, then MM]</text>
  <rect class="accent-fill" x="400" y="368" width="10" height="10" rx="2"/>
  <text class="muted" x="416" y="377" text-anchor="start" font-size="12">MM = [12, 15, 14, 14, 14]</text>
</svg>
