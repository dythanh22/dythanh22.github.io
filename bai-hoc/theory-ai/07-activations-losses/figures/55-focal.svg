<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="focal-55-title">
  <title id="focal-55-title">Multi-class Focal Loss: easy vs hard sample, gamma=2</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .accent-soft { fill: #2F6FED; fill-opacity: 0.08; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .hi-soft { fill: #C45C0A; fill-opacity: 0.08; stroke: #C45C0A; }
    .card { fill: none; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .accent-soft { fill: #8AB4F8; fill-opacity: 0.12; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .hi-soft { fill: #F9AB00; fill-opacity: 0.12; stroke: #F9AB00; }
    }
  </style>
  <defs>
    <marker id="focal-55-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" class="ink" stroke="none"/>
    </marker>
  </defs>

  <text id="focal-55-heading" class="ink" x="360" y="28" text-anchor="middle" font-size="16" font-weight="600">Focal Loss, 3-class, &#x03B3; = 2</text>

  <rect class="accent-soft card" x="32" y="52" width="268" height="248" rx="8" stroke-width="1.5"/>
  <text class="accent" x="166" y="80" text-anchor="middle" font-size="14" font-weight="600" stroke="none">Sample 1: easy majority</text>
  <text class="ink" x="52" y="116" font-size="13" stroke="none">true class = 0</text>
  <text class="ink" x="52" y="142" font-size="13" stroke="none">yhat = [0.95, 0.03, 0.02]</text>
  <text class="ink" x="52" y="168" font-size="13" stroke="none">p_t = 0.95</text>
  <text class="ink" x="52" y="194" font-size="13" stroke="none">alpha = 0.1</text>
  <text class="muted" x="52" y="226" font-size="13" stroke="none">(1 - p_t)^2 = 0.0025</text>
  <text class="accent" x="52" y="268" font-size="15" font-weight="600" stroke="none">FL = 0.0000128</text>

  <rect class="hi-soft card" x="420" y="52" width="268" height="248" rx="8" stroke-width="1.5"/>
  <text class="hi" x="554" y="80" text-anchor="middle" font-size="14" font-weight="600" stroke="none">Sample 2: hard minority</text>
  <text class="ink" x="440" y="116" font-size="13" stroke="none">true class = 2</text>
  <text class="ink" x="440" y="142" font-size="13" stroke="none">yhat = [0.4, 0.3, 0.3]</text>
  <text class="ink" x="440" y="168" font-size="13" stroke="none">p_t = 0.3</text>
  <text class="ink" x="440" y="194" font-size="13" stroke="none">alpha = 0.8</text>
  <text class="muted" x="440" y="226" font-size="13" stroke="none">(1 - p_t)^2 = 0.49</text>
  <text class="hi" x="440" y="268" font-size="15" font-weight="600" stroke="none">FL = 0.472</text>

  <line class="ink" x1="310" y1="176" x2="404" y2="176" stroke-width="1.5" marker-end="url(#focal-55-arrow)"/>
  <text class="ink" x="360" y="162" text-anchor="middle" font-size="12" font-weight="600" stroke="none">~37000x</text>

  <text class="muted" x="360" y="340" text-anchor="middle" font-size="12" stroke="none">Hard minority sample dominates the loss</text>
</svg>
