<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="relu-49-title">
  <title id="relu-49-title">ReLU hockey stick; ReLU(3.5)=3.5, ReLU(0)=0, ReLU(-2.7)=0</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: none; stroke: #2F6FED; }
    .accent-fill { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: none; stroke: #C45C0A; }
    .hi-fill { fill: #C45C0A; stroke: #C45C0A; }
    .grid { fill: none; stroke: #5C6570; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    
  </style>

  <text id="relu-49-heading" class="ink" x="360" y="24" text-anchor="middle" font-size="16" font-weight="600">ReLU(x) = max(0, x)</text>

  <line class="ink" x1="80" y1="50" x2="80" y2="330" stroke-width="1.25"/>
  <line class="ink" x1="80" y1="299" x2="656" y2="299" stroke-width="1.25"/>
  <line class="grid" x1="368" y1="50" x2="368" y2="330" stroke-width="1" stroke-dasharray="4 4" opacity="0.55"/>

  <path id="relu-49-curve" class="accent" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"
        d="M 80.0,298.9 L 368.0,298.9 L 656.0,50.0"/>

  <circle class="accent-fill" cx="173.6" cy="298.9" r="4" data-allow-overlap="1"/>
  <circle class="hi-fill" cx="368.0" cy="298.9" r="4.5" data-allow-overlap="1"/>
  <circle class="accent-fill" cx="620.0" cy="81.1" r="4" data-allow-overlap="1"/>

  <text class="muted" x="174" y="284" text-anchor="middle" font-size="11">ReLU(-2.7)=0</text>
  <text class="hi-fill" x="380" y="318" text-anchor="start" font-size="11" stroke="none">ReLU(0)=0</text>
  <text class="muted" x="608" y="68" text-anchor="end" font-size="11">ReLU(3.5)=3.5</text>

  <text class="muted" x="80" y="348" text-anchor="middle" font-size="12">-4</text>
  <text class="muted" x="224" y="348" text-anchor="middle" font-size="12">-2</text>
  <text class="muted" x="368" y="348" text-anchor="middle" font-size="12">0</text>
  <text class="muted" x="512" y="348" text-anchor="middle" font-size="12">2</text>
  <text class="muted" x="656" y="348" text-anchor="middle" font-size="12">4</text>
  <text class="ink" x="368" y="372" text-anchor="middle" font-size="13">x</text>

  <text class="muted" x="70" y="303" text-anchor="end" font-size="12">0</text>
  <text class="muted" x="70" y="241" text-anchor="end" font-size="12">1</text>
  <text class="muted" x="70" y="178" text-anchor="end" font-size="12">2</text>
  <text class="muted" x="70" y="116" text-anchor="end" font-size="12">3</text>
  <text class="muted" x="70" y="54" text-anchor="end" font-size="12">4</text>
  <text class="ink" x="24" y="190" text-anchor="middle" font-size="13" transform="rotate(-90 24 190)">ReLU(x)</text>
</svg>
