<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="ctr-34-title">
  <title id="ctr-34-title">Contrastive m=2: similar D=0.14 L=0.01; dissimilar D=3 L=0</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .axis { fill: none; stroke: #1A1A1A; }
    .grid { fill: none; stroke: #5C6570; }
    .zone { fill: #C45C0A; fill-opacity: 0.08; stroke: none; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    
  </style>
  <defs>
    <marker id="ctr-34-arrow-ink" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" class="ink" stroke="none"/>
    </marker>
  </defs>

  <text id="ctr-34-heading" class="ink" x="360" y="26" text-anchor="middle" font-size="16" font-weight="600">Contrastive loss, m = 2</text>

  <!-- Left panel: similar close. origin (70,300); scale 180 px/unit. e1=[1,0], e2=[0.9,0.1] -->
  <text class="ink" x="180" y="52" text-anchor="middle" font-size="13" font-weight="600">Similar (y = 0), close</text>
  <line class="axis" x1="70" y1="300" x2="300" y2="300" stroke-width="1.5" marker-end="url(#ctr-34-arrow-ink)"/>
  <line class="axis" x1="70" y1="300" x2="70" y2="90" stroke-width="1.5" marker-end="url(#ctr-34-arrow-ink)"/>
  <text class="muted" x="308" y="304" font-size="12" stroke="none">x</text>
  <text class="muted" x="62" y="84" text-anchor="middle" font-size="12" stroke="none">y</text>

  <line class="accent" x1="250" y1="300" x2="232" y2="282" stroke-width="2.5" fill="none"/>
  <circle class="accent" cx="250" cy="300" r="7" data-allow-overlap="1"/>
  <circle class="hi" cx="232" cy="282" r="7" data-allow-overlap="1"/>
  <text class="accent" x="258" y="318" text-anchor="start" font-size="12" stroke="none">e1 = [1, 0]</text>
  <text class="hi" x="150" y="270" text-anchor="start" font-size="12" stroke="none">e2 = [0.9, 0.1]</text>
  <text class="ink" x="180" y="348" text-anchor="middle" font-size="13" stroke="none">D = 0.14</text>
  <text class="accent" x="180" y="370" text-anchor="middle" font-size="13" font-weight="600" stroke="none">L = 0.01</text>

  <!-- Right panel: dissimilar far. origin (400,300); scale 80 px/unit. e1=[1,0] at x=480, e2=[-2,0] at x=240... -->
  <!-- Place e1 at (448, 250), e2 at (448+3*80, 250)=(688,250) too far. -->
  <!-- e1 at (430,250), scale 70: D=3 -> 210px, tip 640; m=2 -> 140px at 570 -->
  <text class="ink" x="530" y="52" text-anchor="middle" font-size="13" font-weight="600">Dissimilar (y = 1), far</text>
  <line class="axis" x1="400" y1="250" x2="680" y2="250" stroke-width="1.5"/>
  <rect class="zone" x="430" y="226" width="140" height="48" rx="4"/>
  <line class="grid" x1="570" y1="214" x2="570" y2="286" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line class="hi" x1="430" y1="250" x2="640" y2="250" stroke-width="2.5" fill="none"/>
  <circle class="accent" cx="430" cy="250" r="7" data-allow-overlap="1"/>
  <circle class="hi" cx="640" cy="250" r="7" data-allow-overlap="1"/>
  <text class="accent" x="430" y="210" text-anchor="middle" font-size="12" stroke="none">e1 = [1, 0]</text>
  <text class="hi" x="640" y="210" text-anchor="middle" font-size="12" stroke="none">e2 = [-2, 0]</text>
  <text class="muted" x="535" y="204" text-anchor="middle" font-size="11" stroke="none">m = 2</text>
  <text class="muted" x="535" y="276" text-anchor="middle" font-size="11" stroke="none">D = 3 &gt; m</text>
  <text class="ink" x="530" y="348" text-anchor="middle" font-size="13" stroke="none">D = 3.0</text>
  <text class="accent" x="530" y="370" text-anchor="middle" font-size="13" font-weight="600" stroke="none">L = 0</text>
</svg>
