<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="hinge-33-title">
  <title id="hinge-33-title">Hinge L=max(0,1-y f) for y=+1; f=2.5, 0.3, -0.5</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: none; stroke: #2F6FED; }
    .accent-fill { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: none; stroke: #C45C0A; }
    .hi-fill { fill: #C45C0A; stroke: #C45C0A; }
    .axis { fill: none; stroke: #1A1A1A; }
    .grid { fill: none; stroke: #5C6570; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { stroke: #8AB4F8; }
      .accent-fill { fill: #8AB4F8; stroke: #8AB4F8; }
      .hi { stroke: #F9AB00; }
      .hi-fill { fill: #F9AB00; stroke: #F9AB00; }
      .axis { stroke: #E8EAED; }
      .grid { stroke: #9AA0A6; }
    }
  </style>

  <text id="hinge-33-heading" class="ink" x="360" y="24" text-anchor="middle" font-size="16" font-weight="600">Hinge L = max(0, 1 - y f), y = +1</text>

  <line class="axis" x1="80" y1="325" x2="660" y2="325" stroke-width="1.25"/>
  <line class="axis" x1="80" y1="55" x2="80" y2="325" stroke-width="1.25"/>
  <line class="grid" x1="80" y1="243.8" x2="660" y2="243.8" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  <line class="grid" x1="80" y1="162.5" x2="660" y2="162.5" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  <line class="grid" x1="80" y1="81.2" x2="660" y2="81.2" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  <line class="hi" x1="396.4" y1="55" x2="396.4" y2="325" stroke-width="1.25" stroke-dasharray="6 4"/>

  <path id="hinge-33-curve" class="accent" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"
        d="M 80.0,81.2 L 396.4,325.0 L 660.0,325.0"/>

  <circle class="hi-fill" cx="238.2" cy="203.1" r="5" data-allow-overlap="1"/>
  <circle class="accent-fill" cx="322.5" cy="268.1" r="5" data-allow-overlap="1"/>
  <circle class="accent-fill" cx="554.5" cy="325.0" r="5" data-allow-overlap="1"/>
  <circle class="ink" cx="396.4" cy="325.0" r="3.5" data-allow-overlap="1"/>

  <text class="hi-fill" x="220" y="186" text-anchor="end" font-size="11" stroke="none">f=-0.5, L=1.5</text>
  <text class="muted" x="336" y="255" text-anchor="start" font-size="11" stroke="none">f=0.3, L=0.7</text>
  <text class="accent-fill" x="554.5" y="308" text-anchor="middle" font-size="11" stroke="none">f=2.5, L=0</text>
  <text class="hi-fill" x="408" y="70" text-anchor="start" font-size="11" stroke="none">hinge at f=1</text>

  <text class="muted" x="80" y="344" text-anchor="middle" font-size="12">-2</text>
  <text class="muted" x="185.5" y="344" text-anchor="middle" font-size="12">-1</text>
  <text class="muted" x="290.9" y="344" text-anchor="middle" font-size="12">0</text>
  <text class="muted" x="396.4" y="344" text-anchor="middle" font-size="12">1</text>
  <text class="muted" x="501.8" y="344" text-anchor="middle" font-size="12">2</text>
  <text class="muted" x="607.3" y="344" text-anchor="middle" font-size="12">3</text>
  <text class="ink" x="370" y="372" text-anchor="middle" font-size="13">f(x)</text>

  <text class="muted" x="70" y="329" text-anchor="end" font-size="12">0</text>
  <text class="muted" x="70" y="248" text-anchor="end" font-size="12">1</text>
  <text class="muted" x="70" y="167" text-anchor="end" font-size="12">2</text>
  <text class="muted" x="70" y="86" text-anchor="end" font-size="12">3</text>
  <text class="ink" x="24" y="190" text-anchor="middle" font-size="13" transform="rotate(-90 24 190)">L</text>
</svg>
