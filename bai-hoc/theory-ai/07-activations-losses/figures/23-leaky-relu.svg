<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="leaky-23-title">
  <title id="leaky-23-title">Leaky ReLU alpha=0.01; (-2,-0.02) and (3,3)</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: none; stroke: #2F6FED; }
    .accent-fill { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: none; stroke: #C45C0A; }
    .hi-fill { fill: #C45C0A; stroke: #C45C0A; }
    .grid { fill: none; stroke: #5C6570; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    
  </style>

  <text id="leaky-23-heading" class="ink" x="360" y="24" text-anchor="middle" font-size="16" font-weight="600">Leaky ReLU, &#x03B1; = 0.01</text>

  <line class="ink" x1="80" y1="50" x2="80" y2="330" stroke-width="1.25"/>
  <line class="ink" x1="80" y1="301" x2="656" y2="301" stroke-width="1.25"/>
  <line class="grid" x1="368" y1="50" x2="368" y2="330" stroke-width="1" stroke-dasharray="4 4" opacity="0.55"/>

  <path id="leaky-23-curve" class="accent" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"
        d="M 80.0,303.8 L 368.0,301.3 L 656.0,50.0"/>

  <circle class="hi-fill" cx="203.4" cy="302.7" r="4.5" data-allow-overlap="1"/>
  <circle class="accent-fill" cx="368.0" cy="301.3" r="4" data-allow-overlap="1"/>
  <circle class="accent-fill" cx="614.9" cy="85.9" r="4" data-allow-overlap="1"/>

  <text class="hi-fill" x="203" y="286" text-anchor="middle" font-size="11" stroke="none">(-2, -0.02)</text>
  <text class="muted" x="380" y="320" text-anchor="start" font-size="11">Leaky(0)=0</text>
  <text class="muted" x="602" y="72" text-anchor="end" font-size="11">(3, 3)</text>

  <text class="muted" x="80" y="348" text-anchor="middle" font-size="12">-3.5</text>
  <text class="muted" x="203" y="348" text-anchor="middle" font-size="12">-2</text>
  <text class="muted" x="368" y="348" text-anchor="middle" font-size="12">0</text>
  <text class="muted" x="615" y="348" text-anchor="middle" font-size="12">3</text>
  <text class="ink" x="368" y="372" text-anchor="middle" font-size="13">x</text>

  <text class="muted" x="70" y="305" text-anchor="end" font-size="12">0</text>
  <text class="muted" x="70" y="230" text-anchor="end" font-size="12">1</text>
  <text class="muted" x="70" y="158" text-anchor="end" font-size="12">2</text>
  <text class="muted" x="70" y="86" text-anchor="end" font-size="12">3</text>
  <text class="ink" x="24" y="190" text-anchor="middle" font-size="13" transform="rotate(-90 24 190)">LeakyReLU(x)</text>
</svg>
