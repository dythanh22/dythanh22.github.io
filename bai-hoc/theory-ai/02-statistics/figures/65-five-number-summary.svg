<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="fn5-65-title">
  <title id="fn5-65-title">Five-number summary box plot</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .axis { fill: none; stroke: #1A1A1A; }
    .box-fill { fill: #2F6FED; fill-opacity: 0.12; stroke: #2F6FED; }
    .fill-none { fill: none; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .axis { stroke: #E8EAED; }
      .box-fill { fill: #8AB4F8; fill-opacity: 0.18; stroke: #8AB4F8; }
    }
  </style>
  <!-- x(v) = 40 + (v - 10) * 11 ; 10..55 -> 40..535 -->
  <text id="fn5-65-heading" class="ink" x="320" y="28" text-anchor="middle" font-size="15" font-weight="600">Five-number summary box plot</text>
  <line class="axis" x1="40" y1="210" x2="560" y2="210" stroke-width="1.5"/>
  <text class="muted" x="95" y="232" text-anchor="middle" font-size="11">15</text>
  <text class="muted" x="122.5" y="232" text-anchor="middle" font-size="11">17.5</text>
  <text class="muted" x="315" y="232" text-anchor="middle" font-size="11">35</text>
  <text class="muted" x="425" y="232" text-anchor="middle" font-size="11">45</text>
  <text class="muted" x="480" y="232" text-anchor="middle" font-size="11">50</text>
  <!-- whisker Min=15 (x=95) to Q1=17.5 (x=122.5) -->
  <line class="accent fill-none" x1="95" y1="130" x2="122.5" y2="130" stroke-width="2"/>
  <line class="accent fill-none" x1="95" y1="118" x2="95" y2="142" stroke-width="2"/>
  <!-- box Q1=17.5 to Q3=45 (x=122.5..425), height 48 centered at y=130 -->
  <rect class="box-fill" x="122.5" y="106" width="302.5" height="48" rx="2" stroke-width="2"/>
  <!-- median = 35 at x=315 -->
  <line class="hi fill-none" x1="315" y1="106" x2="315" y2="154" stroke-width="2.5"/>
  <!-- whisker Q3=45 to Max=50 (x=425..480) -->
  <line class="accent fill-none" x1="425" y1="130" x2="480" y2="130" stroke-width="2"/>
  <line class="accent fill-none" x1="480" y1="118" x2="480" y2="142" stroke-width="2"/>
  <!-- labels above (staggered to avoid overlap) -->
  <text class="muted" x="95" y="78" text-anchor="middle" font-size="12">Min = 15</text>
  <text class="accent" x="155" y="96" text-anchor="middle" font-size="12" stroke="none">Q1 = 17.5</text>
  <text class="hi" x="315" y="78" text-anchor="middle" font-size="12" stroke="none">Median = 35</text>
  <text class="accent" x="400" y="96" text-anchor="middle" font-size="12" stroke="none">Q3 = 45</text>
  <text class="muted" x="480" y="78" text-anchor="middle" font-size="12">Max = 50</text>
  <!-- IQR brace under box -->
  <line class="hi fill-none" x1="122.5" y1="168" x2="425" y2="168" stroke-width="1.5"/>
  <line class="hi fill-none" x1="122.5" y1="162" x2="122.5" y2="174" stroke-width="1.5"/>
  <line class="hi fill-none" x1="425" y1="162" x2="425" y2="174" stroke-width="1.5"/>
  <text class="hi" x="273.75" y="190" text-anchor="middle" font-size="13" stroke="none">IQR = 27.5</text>
  <text class="muted" x="320" y="262" text-anchor="middle" font-size="12">Data: [15, 20, 35, 40, 50]</text>
  <text class="ink" x="320" y="286" text-anchor="middle" font-size="12">value</text>
</svg>
