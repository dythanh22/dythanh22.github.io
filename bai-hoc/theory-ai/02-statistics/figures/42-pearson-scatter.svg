<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" aria-labelledby="pear-42-title">
  <title id="pear-42-title">Pearson scatter rho approx 0.72</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .axis { fill: none; stroke: #1A1A1A; }
    .mean { fill: none; stroke: #5C6570; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    
  </style>
  <text id="pear-42-heading" class="ink" x="280" y="28" text-anchor="middle" font-size="16" font-weight="600">Pearson scatter: &#x03C1; &#x2248; 0.72</text>

  <!-- X: 80+x*80 ; Y: 320-y*40 -->
  <line class="axis" x1="80" y1="320" x2="500" y2="320" stroke-width="1.5"/>
  <line class="axis" x1="80" y1="60" x2="80" y2="320" stroke-width="1.5"/>
  <text class="muted" x="80" y="340" text-anchor="middle" font-size="12">0</text>
  <text class="muted" x="160" y="340" text-anchor="middle" font-size="12">1</text>
  <text class="muted" x="240" y="340" text-anchor="middle" font-size="12">2</text>
  <text class="muted" x="320" y="340" text-anchor="middle" font-size="12">3</text>
  <text class="muted" x="400" y="340" text-anchor="middle" font-size="12">4</text>
  <text class="muted" x="480" y="340" text-anchor="middle" font-size="12">5</text>
  <text class="muted" x="68" y="324" text-anchor="end" font-size="12">0</text>
  <text class="muted" x="68" y="244" text-anchor="end" font-size="12">2</text>
  <text class="muted" x="68" y="164" text-anchor="end" font-size="12">4</text>
  <text class="muted" x="68" y="84" text-anchor="end" font-size="12">6</text>

  <!-- means Xbar=2.5 -> x=280; Ybar=3.75 -> y=170 -->
  <line class="mean" x1="280" y1="60" x2="280" y2="320" stroke-width="1.25" stroke-dasharray="5 4"/>
  <line class="mean" x1="80" y1="170" x2="500" y2="170" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text class="muted" x="288" y="74" text-anchor="start" font-size="11" stroke="none">X&#x0304; = 2.5</text>
  <text class="muted" x="490" y="162" text-anchor="end" font-size="11" stroke="none">Y&#x0304; = 3.75</text>

  <!-- points (1,2),(2,4),(3,5),(4,4) -->
  <circle class="accent" cx="160" cy="240" r="7" data-allow-overlap="1"/>
  <circle class="accent" cx="240" cy="160" r="7" data-allow-overlap="1"/>
  <circle class="accent" cx="320" cy="120" r="7" data-allow-overlap="1"/>
  <circle class="accent" cx="400" cy="160" r="7" data-allow-overlap="1"/>
  <text class="muted" x="160" y="262" text-anchor="middle" font-size="11" stroke="none">(1, 2)</text>
  <text class="muted" x="240" y="148" text-anchor="middle" font-size="11" stroke="none">(2, 4)</text>
  <text class="muted" x="320" y="108" text-anchor="middle" font-size="11" stroke="none">(3, 5)</text>
  <text class="muted" x="400" y="148" text-anchor="middle" font-size="11" stroke="none">(4, 4)</text>

  <text class="hi" x="280" y="370" text-anchor="middle" font-size="14" font-weight="600" stroke="none">&#x03C1; &#x2248; 0.72</text>
  <text class="ink" x="280" y="392" text-anchor="middle" font-size="13">X</text>
  <text class="ink" x="28" y="190" text-anchor="middle" font-size="13" transform="rotate(-90 28 190)">Y</text>
</svg>
