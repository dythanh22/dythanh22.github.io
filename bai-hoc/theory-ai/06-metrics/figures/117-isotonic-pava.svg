<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="isotonic-117-title">
  <title id="isotonic-117-title">PAVA steps 0 / 0.5 / 1 on raw scores 0.1 to 0.8</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .nofill { fill: none; }
    .grid { fill: none; stroke: #5C6570; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .grid { stroke: #9AA0A6; }
    }
  </style>

  <text id="isotonic-117-heading" class="ink" x="360" y="26" text-anchor="middle" font-size="16" font-weight="600" stroke="none">PAVA step function</text>

  <line class="ink nofill" x1="80" y1="310" x2="640" y2="310" stroke-width="1.25"/>
  <line class="ink nofill" x1="80" y1="56" x2="80" y2="310" stroke-width="1.25"/>

  <line class="grid" x1="80" y1="185" x2="640" y2="185" stroke-width="1" stroke-dasharray="4 4" opacity="0.45"/>
  <line class="grid" x1="80" y1="60" x2="640" y2="60" stroke-width="1" stroke-dasharray="4 4" opacity="0.45"/>

  <text class="muted" x="70" y="314" text-anchor="end" font-size="11" stroke="none">0</text>
  <text class="muted" x="70" y="189" text-anchor="end" font-size="11" stroke="none">0.5</text>
  <text class="muted" x="70" y="64" text-anchor="end" font-size="11" stroke="none">1</text>
  <text class="ink" x="24" y="183" text-anchor="middle" font-size="13" stroke="none" transform="rotate(-90 24 183)">y / f(s)</text>

  <text class="muted" x="136" y="328" text-anchor="middle" font-size="11" stroke="none">0.1</text>
  <text class="muted" x="192" y="328" text-anchor="middle" font-size="11" stroke="none">0.2</text>
  <text class="muted" x="248" y="328" text-anchor="middle" font-size="11" stroke="none">0.3</text>
  <text class="muted" x="304" y="328" text-anchor="middle" font-size="11" stroke="none">0.4</text>
  <text class="muted" x="360" y="328" text-anchor="middle" font-size="11" stroke="none">0.5</text>
  <text class="muted" x="416" y="328" text-anchor="middle" font-size="11" stroke="none">0.6</text>
  <text class="muted" x="472" y="328" text-anchor="middle" font-size="11" stroke="none">0.7</text>
  <text class="muted" x="528" y="328" text-anchor="middle" font-size="11" stroke="none">0.8</text>
  <text class="ink" x="360" y="350" text-anchor="middle" font-size="13" stroke="none">raw prediction s</text>

  <!-- step: 0 on [0.1, 0.2], 0.5 on [0.3, 0.6], 1 on [0.7, 0.8] -->
  <path class="accent nofill" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"
        d="M 136,310 H 192 V 185 H 416 V 60 H 528"/>

  <!-- labels y=0 at 310, y=1 at 60 -->
  <circle class="hi" cx="136" cy="310" r="5" data-allow-overlap="1"/>
  <circle class="hi" cx="192" cy="310" r="5" data-allow-overlap="1"/>
  <circle class="hi" cx="248" cy="60" r="5" data-allow-overlap="1"/>
  <circle class="hi" cx="304" cy="310" r="5" data-allow-overlap="1"/>
  <circle class="hi" cx="360" cy="60" r="5" data-allow-overlap="1"/>
  <circle class="hi" cx="416" cy="310" r="5" data-allow-overlap="1"/>
  <circle class="hi" cx="472" cy="60" r="5" data-allow-overlap="1"/>
  <circle class="hi" cx="528" cy="60" r="5" data-allow-overlap="1"/>

  <text class="accent" x="164" y="292" text-anchor="middle" font-size="12" font-weight="600" stroke="none">0</text>
  <text class="accent" x="332" y="168" text-anchor="middle" font-size="12" font-weight="600" stroke="none">0.5</text>
  <text class="accent" x="580" y="64" text-anchor="middle" font-size="12" font-weight="600" stroke="none">1</text>

  <circle class="hi" cx="86" cy="372" r="4"/>
  <text class="muted" x="96" y="376" text-anchor="start" font-size="11" stroke="none">label y</text>
  <line class="accent nofill" x1="180" y1="372" x2="214" y2="372" stroke-width="2.5"/>
  <text class="muted" x="222" y="376" text-anchor="start" font-size="11" stroke="none">calibrated f(s)</text>
</svg>
