<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" role="img" aria-labelledby="r2-30-title">
  <title id="r2-30-title">R^2 fit: y=[3,5,7,9,11], yhat=[2.5,5.5,6.5,9.5,10], R^2=0.95</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .accent-line { fill: none; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .hi-line { fill: none; stroke: #C45C0A; }
    .axis { fill: none; stroke: #1A1A1A; }
    .grid { fill: none; stroke: #5C6570; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .accent-line { stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .hi-line { stroke: #F9AB00; }
      .axis { stroke: #E8EAED; }
      .grid { stroke: #9AA0A6; }
    }
  </style>

  <text id="r2-30-heading" class="ink" x="340" y="24" text-anchor="middle" font-size="16" font-weight="600">R&#x00B2; = 1 &#x2212; SS_res / SS_tot = 0.95</text>

  <line class="axis" x1="80" y1="360" x2="620" y2="360" stroke-width="1.25"/>
  <line class="axis" x1="80" y1="56" x2="80" y2="360" stroke-width="1.25"/>
  <line class="grid" x1="80" y1="288" x2="620" y2="288" stroke-width="1" stroke-dasharray="4 4" opacity="0.35"/>
  <line class="grid" x1="80" y1="216" x2="620" y2="216" stroke-width="1" stroke-dasharray="4 4" opacity="0.35"/>
  <line class="grid" x1="80" y1="144" x2="620" y2="144" stroke-width="1" stroke-dasharray="4 4" opacity="0.35"/>
  <line class="grid" x1="80" y1="72" x2="620" y2="72" stroke-width="1" stroke-dasharray="4 4" opacity="0.35"/>

  <!-- mean y=7 -> y_svg = 360 - 7*24 = 192 -->
  <line class="hi-line" x1="80" y1="192" x2="600" y2="192" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="hi" x="608" y="196" text-anchor="start" font-size="12" stroke="none">y&#x0304; = 7</text>

  <!-- yhat polyline: (100,300), (220,228), (340,204), (460,132), (580,120) -->
  <polyline id="r2-30-yhat" class="accent-line" points="100,300 220,228 340,204 460,132 580,120" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- residual stems actual -> yhat -->
  <line class="hi-line" x1="100" y1="288" x2="100" y2="300" stroke-width="1.75" data-allow-overlap="1"/>
  <line class="hi-line" x1="220" y1="240" x2="220" y2="228" stroke-width="1.75" data-allow-overlap="1"/>
  <line class="hi-line" x1="340" y1="192" x2="340" y2="204" stroke-width="1.75" data-allow-overlap="1"/>
  <line class="hi-line" x1="460" y1="144" x2="460" y2="132" stroke-width="1.75" data-allow-overlap="1"/>
  <line class="hi-line" x1="580" y1="96" x2="580" y2="120" stroke-width="1.75" data-allow-overlap="1"/>

  <circle class="accent" cx="100" cy="288" r="6" data-allow-overlap="1"/>
  <circle class="accent" cx="220" cy="240" r="6" data-allow-overlap="1"/>
  <circle class="accent" cx="340" cy="192" r="6" data-allow-overlap="1"/>
  <circle class="accent" cx="460" cy="144" r="6" data-allow-overlap="1"/>
  <circle class="accent" cx="580" cy="96" r="6" data-allow-overlap="1"/>

  <circle class="hi" cx="100" cy="300" r="4" data-allow-overlap="1"/>
  <circle class="hi" cx="220" cy="228" r="4" data-allow-overlap="1"/>
  <circle class="hi" cx="340" cy="204" r="4" data-allow-overlap="1"/>
  <circle class="hi" cx="460" cy="132" r="4" data-allow-overlap="1"/>
  <circle class="hi" cx="580" cy="120" r="4" data-allow-overlap="1"/>

  <text class="muted" x="70" y="364" text-anchor="end" font-size="12">0</text>
  <text class="muted" x="70" y="292" text-anchor="end" font-size="12">3</text>
  <text class="muted" x="70" y="220" text-anchor="end" font-size="12">6</text>
  <text class="muted" x="70" y="148" text-anchor="end" font-size="12">9</text>
  <text class="muted" x="70" y="76" text-anchor="end" font-size="12">12</text>
  <text class="ink" x="24" y="208" text-anchor="middle" font-size="13" transform="rotate(-90 24 208)">y</text>

  <text class="muted" x="100" y="380" text-anchor="middle" font-size="12">1</text>
  <text class="muted" x="220" y="380" text-anchor="middle" font-size="12">2</text>
  <text class="muted" x="340" y="380" text-anchor="middle" font-size="12">3</text>
  <text class="muted" x="460" y="380" text-anchor="middle" font-size="12">4</text>
  <text class="muted" x="580" y="380" text-anchor="middle" font-size="12">5</text>
  <text class="ink" x="340" y="398" text-anchor="middle" font-size="13">index</text>

  <text class="muted" x="140" y="418" text-anchor="middle" font-size="13" stroke="none">SS_res = 2</text>
  <text class="muted" x="340" y="418" text-anchor="middle" font-size="13" stroke="none">SS_tot = 40</text>
  <text class="ink" x="540" y="418" text-anchor="middle" font-size="14" font-weight="600" stroke="none">R&#x00B2; = 0.95</text>
</svg>
