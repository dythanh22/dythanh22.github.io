<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-labelledby="micro-15-title">
  <title id="micro-15-title">Micro-F1 pools TP 45+24+16 = 85/100 = 0.85</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .box { fill: none; stroke: #1A1A1A; }
    .fill-none { fill: none; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    
  </style>

  <text id="micro-15-heading" class="ink" x="340" y="26" text-anchor="middle" font-size="16" font-weight="600">Micro-F1: pooled TP / n = 0.85</text>

  <!-- scale: 4.2 px per sample; bar origin x=160 -->
  <text class="muted" x="148" y="78" text-anchor="end" font-size="12" stroke="none">A n=50</text>
  <rect class="accent fill-none" x="160" y="58" width="189" height="26" stroke-width="1.5" rx="3"/>
  <rect class="hi fill-none" x="349" y="58" width="21" height="26" stroke-width="1.5" rx="3"/>
  <text class="accent" x="254" y="76" text-anchor="middle" font-size="12" font-weight="600" stroke="none">TP = 45</text>
  <text class="hi" x="400" y="76" text-anchor="start" font-size="12" stroke="none">FN = 5</text>

  <text class="muted" x="148" y="132" text-anchor="end" font-size="12" stroke="none">B n=30</text>
  <rect class="accent fill-none" x="160" y="112" width="101" height="26" stroke-width="1.5" rx="3"/>
  <rect class="hi fill-none" x="261" y="112" width="25" height="26" stroke-width="1.5" rx="3"/>
  <text class="accent" x="210" y="130" text-anchor="middle" font-size="12" font-weight="600" stroke="none">TP = 24</text>
  <text class="hi" x="400" y="130" text-anchor="start" font-size="12" stroke="none">FN = 6</text>

  <text class="muted" x="148" y="186" text-anchor="end" font-size="12" stroke="none">C n=20</text>
  <rect class="accent fill-none" x="160" y="166" width="67" height="26" stroke-width="1.5" rx="3"/>
  <rect class="hi fill-none" x="227" y="166" width="17" height="26" stroke-width="1.5" rx="3"/>
  <text class="accent" x="193" y="184" text-anchor="middle" font-size="11" font-weight="600" stroke="none">TP=16</text>
  <text class="hi" x="400" y="184" text-anchor="start" font-size="12" stroke="none">FN = 4</text>

  <text class="ink" x="148" y="264" text-anchor="end" font-size="12" font-weight="600" stroke="none">all n=100</text>
  <rect class="accent fill-none" x="160" y="244" width="357" height="28" stroke-width="2" rx="3"/>
  <rect class="hi fill-none" x="517" y="244" width="63" height="28" stroke-width="2" rx="3"/>
  <text class="accent" x="338" y="263" text-anchor="middle" font-size="14" font-weight="600" stroke="none">45+24+16 = 85</text>
  <text class="hi" x="548" y="263" text-anchor="middle" font-size="12" stroke="none">15</text>

  <rect class="box" x="190" y="300" width="300" height="40" stroke-width="1.5" rx="4"/>
  <text class="ink" x="340" y="326" text-anchor="middle" font-size="15" font-weight="600" stroke="none">F1_micro = 85/100 = 0.85</text>
</svg>
