<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="ece-115-title">
  <title id="ece-115-title">Reliability diagram, 5 bins, ECE=0.091</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .nofill { fill: none; }
    .grid { fill: none; stroke: #5C6570; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .grid { stroke: #9AA0A6; }
    }
  </style>

  <text id="ece-115-heading" class="ink" x="360" y="26" text-anchor="middle" font-size="16" font-weight="600" stroke="none">Reliability diagram (M = 5)</text>

  <line class="ink nofill" x1="80" y1="310" x2="640" y2="310" stroke-width="1.25"/>
  <line class="ink nofill" x1="80" y1="56" x2="80" y2="310" stroke-width="1.25"/>

  <line class="grid" x1="80" y1="310" x2="640" y2="56" stroke-width="1.25" stroke-dasharray="6 4" opacity="0.7"/>

  <text class="muted" x="70" y="314" text-anchor="end" font-size="11" stroke="none">0</text>
  <text class="muted" x="70" y="263" text-anchor="end" font-size="11" stroke="none">0.2</text>
  <text class="muted" x="70" y="212" text-anchor="end" font-size="11" stroke="none">0.4</text>
  <text class="muted" x="70" y="161" text-anchor="end" font-size="11" stroke="none">0.6</text>
  <text class="muted" x="70" y="110" text-anchor="end" font-size="11" stroke="none">0.8</text>
  <text class="muted" x="70" y="60" text-anchor="end" font-size="11" stroke="none">1.0</text>
  <text class="ink" x="24" y="183" text-anchor="middle" font-size="13" stroke="none" transform="rotate(-90 24 183)">Accuracy</text>

  <text class="muted" x="80" y="328" text-anchor="middle" font-size="11" stroke="none">0</text>
  <text class="muted" x="192" y="328" text-anchor="middle" font-size="11" stroke="none">0.2</text>
  <text class="muted" x="304" y="328" text-anchor="middle" font-size="11" stroke="none">0.4</text>
  <text class="muted" x="416" y="328" text-anchor="middle" font-size="11" stroke="none">0.6</text>
  <text class="muted" x="528" y="328" text-anchor="middle" font-size="11" stroke="none">0.8</text>
  <text class="muted" x="640" y="328" text-anchor="middle" font-size="11" stroke="none">1.0</text>
  <text class="ink" x="360" y="350" text-anchor="middle" font-size="13" stroke="none">Mean confidence</text>

  <!-- B1 (0.15, 0.20): x=164, y=259.2 ; diag y at 0.15 = 271.9 -->
  <circle class="accent" cx="164" cy="259" r="5" data-allow-overlap="1"/>
  <text class="muted" x="164" y="246" text-anchor="middle" font-size="11" stroke="none">B1</text>

  <!-- B2 (0.30, 0.30): x=248, y=233.8 -->
  <circle class="accent" cx="248" cy="234" r="5" data-allow-overlap="1"/>
  <text class="muted" x="248" y="221" text-anchor="middle" font-size="11" stroke="none">B2</text>

  <!-- B3 (0.52, 0.48): x=371, y=188.1 ; diag y at 0.52 = 177.9 -->
  <circle class="accent" cx="371" cy="188" r="5" data-allow-overlap="1"/>
  <text class="muted" x="371" y="208" text-anchor="middle" font-size="11" stroke="none">B3</text>

  <!-- B4 (0.71, 0.60): x=478, y=157.6 ; diag y at 0.71 = 129.7 -->
  <line class="hi nofill" x1="478" y1="130" x2="478" y2="158" stroke-width="2.5"/>
  <circle class="hi" cx="478" cy="158" r="5.5" data-allow-overlap="1"/>
  <text class="hi" x="478" y="178" text-anchor="middle" font-size="11" font-weight="600" stroke="none">B4 0.71 vs 0.60</text>

  <!-- B5 (0.92, 0.76): x=595, y=117.0 ; diag y at 0.92 = 76.3 -->
  <line class="hi nofill" x1="595" y1="76" x2="595" y2="117" stroke-width="2.5"/>
  <circle class="hi" cx="595" cy="117" r="5.5" data-allow-overlap="1"/>
  <text class="hi" x="595" y="140" text-anchor="middle" font-size="11" font-weight="600" stroke="none">B5 0.92 vs 0.76</text>

  <text class="muted" x="100" y="285" text-anchor="start" font-size="11" stroke="none">y = x</text>

  <text class="hi" x="600" y="26" text-anchor="middle" font-size="14" font-weight="700" stroke="none">ECE = 0.091</text>
</svg>
