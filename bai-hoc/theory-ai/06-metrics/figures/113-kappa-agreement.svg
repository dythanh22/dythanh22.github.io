<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-labelledby="kappa-113-title">
  <title id="kappa-113-title">Model vs Human confusion: po=0.75, pe=0.50, kappa=0.50</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .box { fill: none; stroke: #1A1A1A; }
    .box-soft { fill: none; stroke: #5C6570; }
    .cell-ag { fill: #2F6FED; fill-opacity: 0.12; stroke: #2F6FED; }
    .cell-dis { fill: none; stroke: #5C6570; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    
  </style>

  <text id="kappa-113-heading" class="ink" x="340" y="28" text-anchor="middle" font-size="16" font-weight="600" stroke="none">Model vs Human confusion (N = 100)</text>

  <text class="muted" x="400" y="54" text-anchor="middle" font-size="12" stroke="none">Human</text>
  <text class="muted" x="330" y="74" text-anchor="middle" font-size="12" stroke="none">Positive</text>
  <text class="muted" x="470" y="74" text-anchor="middle" font-size="12" stroke="none">Negative</text>

  <text class="muted" x="48" y="168" text-anchor="middle" font-size="12" stroke="none" transform="rotate(-90 48 168)">Model</text>
  <text class="muted" x="148" y="128" text-anchor="middle" font-size="12" stroke="none">Positive</text>
  <text class="muted" x="148" y="208" text-anchor="middle" font-size="12" stroke="none">Negative</text>

  <rect class="cell-ag" x="260" y="88" width="140" height="72" rx="3" stroke-width="1.5"/>
  <text class="accent" x="330" y="132" text-anchor="middle" font-size="22" font-weight="700" stroke="none">40</text>

  <rect class="cell-dis" x="400" y="88" width="140" height="72" rx="3" stroke-width="1.5"/>
  <text class="muted" x="470" y="132" text-anchor="middle" font-size="22" font-weight="700" stroke="none">15</text>

  <rect class="cell-dis" x="260" y="168" width="140" height="72" rx="3" stroke-width="1.5"/>
  <text class="muted" x="330" y="212" text-anchor="middle" font-size="22" font-weight="700" stroke="none">10</text>

  <rect class="cell-ag" x="400" y="168" width="140" height="72" rx="3" stroke-width="1.5"/>
  <text class="accent" x="470" y="212" text-anchor="middle" font-size="22" font-weight="700" stroke="none">35</text>

  <text class="muted" x="330" y="262" text-anchor="middle" font-size="12" stroke="none">agree 40 + 35</text>
  <text class="muted" x="470" y="262" text-anchor="middle" font-size="12" stroke="none">disagree 15 + 10</text>

  <rect class="box-soft" x="70" y="286" width="540" height="50" rx="4" stroke-width="1.5"/>
  <text class="ink" x="200" y="317" text-anchor="middle" font-size="15" font-weight="600" stroke="none">p_o = 0.75</text>
  <text class="ink" x="340" y="317" text-anchor="middle" font-size="15" font-weight="600" stroke="none">p_e = 0.50</text>
  <text class="hi" x="500" y="317" text-anchor="middle" font-size="16" font-weight="700" stroke="none">&#x03BA; = 0.50</text>
</svg>
