<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-labelledby="wcount-102-title">
  <title id="wcount-102-title">Word counts the=3, cat=2, sat=2, ate=1, dog=1</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .nofill { fill: none; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    
  </style>

  <text id="wcount-102-heading" class="ink" x="340" y="28" text-anchor="middle" font-size="15" font-weight="600">Global word counts</text>

  <line class="ink nofill" x1="72" y1="320" x2="640" y2="320" stroke-width="1.25"/>
  <line class="ink nofill" x1="72" y1="56" x2="72" y2="320" stroke-width="1.25"/>

  <line class="muted nofill" x1="72" y1="80" x2="640" y2="80" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  <line class="muted nofill" x1="72" y1="160" x2="640" y2="160" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  <line class="muted nofill" x1="72" y1="240" x2="640" y2="240" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  <text class="muted" x="60" y="84" text-anchor="end" font-size="12">3</text>
  <text class="muted" x="60" y="164" text-anchor="end" font-size="12">2</text>
  <text class="muted" x="60" y="244" text-anchor="end" font-size="12">1</text>
  <text class="muted" x="60" y="324" text-anchor="end" font-size="12">0</text>
  <text class="ink" x="20" y="190" text-anchor="middle" font-size="13" transform="rotate(-90 20 190)">count</text>

  <!-- the=3, h=240, y=80 -->
  <rect class="hi" x="100" y="80" width="78" height="240" rx="2" stroke="none"/>
  <text class="ink" x="139" y="68" text-anchor="middle" font-size="14" font-weight="700">3</text>
  <text class="ink" x="139" y="344" text-anchor="middle" font-size="13">the</text>

  <!-- cat=2, h=160, y=160 -->
  <rect class="accent" x="206" y="160" width="78" height="160" rx="2" stroke="none"/>
  <text class="ink" x="245" y="148" text-anchor="middle" font-size="14" font-weight="700">2</text>
  <text class="ink" x="245" y="344" text-anchor="middle" font-size="13">cat</text>

  <!-- sat=2 -->
  <rect class="accent" x="312" y="160" width="78" height="160" rx="2" stroke="none"/>
  <text class="ink" x="351" y="148" text-anchor="middle" font-size="14" font-weight="700">2</text>
  <text class="ink" x="351" y="344" text-anchor="middle" font-size="13">sat</text>

  <!-- ate=1, h=80, y=240 -->
  <rect class="accent" x="418" y="240" width="78" height="80" rx="2" stroke="none"/>
  <text class="ink" x="457" y="228" text-anchor="middle" font-size="14" font-weight="700">1</text>
  <text class="ink" x="457" y="344" text-anchor="middle" font-size="13">ate</text>

  <!-- dog=1 -->
  <rect class="accent" x="524" y="240" width="78" height="80" rx="2" stroke="none"/>
  <text class="ink" x="563" y="228" text-anchor="middle" font-size="14" font-weight="700">1</text>
  <text class="ink" x="563" y="344" text-anchor="middle" font-size="13">dog</text>

  <text class="muted" x="340" y="380" text-anchor="middle" font-size="12">the:3, cat:2, sat:2, ate:1, dog:1</text>
</svg>
