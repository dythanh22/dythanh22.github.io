<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="bow-101-title">
  <title id="bow-101-title">BoW vector for Doc 1 on 7-word vocab</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .zero { fill: #F4F5F6; stroke: #5C6570; }
    .one { fill: #FCE8D5; stroke: #C45C0A; }
    .nofill { fill: none; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    
  </style>

  <text id="bow-101-heading" class="ink" x="360" y="26" text-anchor="middle" font-size="15" font-weight="600">BoW vector, Doc 1</text>
  <text class="muted" x="360" y="48" text-anchor="middle" font-size="12">I love machine learning</text>

  <!-- 7 cols, w=82, gap=10, x0=43 -->
  <text class="muted" x="84" y="74" text-anchor="middle" font-size="11">0</text>
  <text class="muted" x="176" y="74" text-anchor="middle" font-size="11">1</text>
  <text class="muted" x="268" y="74" text-anchor="middle" font-size="11">2</text>
  <text class="muted" x="360" y="74" text-anchor="middle" font-size="11">3</text>
  <text class="muted" x="452" y="74" text-anchor="middle" font-size="11">4</text>
  <text class="muted" x="544" y="74" text-anchor="middle" font-size="11">5</text>
  <text class="muted" x="636" y="74" text-anchor="middle" font-size="11">6</text>

  <rect class="zero" x="43" y="84" width="82" height="36" rx="2" stroke-width="1.25"/>
  <rect class="zero" x="135" y="84" width="82" height="36" rx="2" stroke-width="1.25"/>
  <rect class="one" x="227" y="84" width="82" height="36" rx="2" stroke-width="1.25"/>
  <rect class="zero" x="319" y="84" width="82" height="36" rx="2" stroke-width="1.25"/>
  <rect class="one" x="411" y="84" width="82" height="36" rx="2" stroke-width="1.25"/>
  <rect class="one" x="503" y="84" width="82" height="36" rx="2" stroke-width="1.25"/>
  <rect class="one" x="595" y="84" width="82" height="36" rx="2" stroke-width="1.25"/>

  <text class="muted" x="84" y="107" text-anchor="middle" font-size="12" stroke="none">food</text>
  <text class="muted" x="176" y="107" text-anchor="middle" font-size="12" stroke="none">great</text>
  <text class="hi" x="268" y="107" text-anchor="middle" font-size="12" font-weight="600" stroke="none">i</text>
  <text class="muted" x="360" y="107" text-anchor="middle" font-size="12" stroke="none">is</text>
  <text class="hi" x="452" y="107" text-anchor="middle" font-size="12" font-weight="600" stroke="none">learning</text>
  <text class="hi" x="544" y="107" text-anchor="middle" font-size="12" font-weight="600" stroke="none">love</text>
  <text class="hi" x="636" y="107" text-anchor="middle" font-size="12" font-weight="600" stroke="none">machine</text>

  <rect class="zero" x="43" y="136" width="82" height="48" rx="2" stroke-width="1.5"/>
  <rect class="zero" x="135" y="136" width="82" height="48" rx="2" stroke-width="1.5"/>
  <rect class="one" x="227" y="136" width="82" height="48" rx="2" stroke-width="1.5"/>
  <rect class="zero" x="319" y="136" width="82" height="48" rx="2" stroke-width="1.5"/>
  <rect class="one" x="411" y="136" width="82" height="48" rx="2" stroke-width="1.5"/>
  <rect class="one" x="503" y="136" width="82" height="48" rx="2" stroke-width="1.5"/>
  <rect class="one" x="595" y="136" width="82" height="48" rx="2" stroke-width="1.5"/>

  <text class="muted" x="84" y="166" text-anchor="middle" font-size="18" font-weight="700" stroke="none">0</text>
  <text class="muted" x="176" y="166" text-anchor="middle" font-size="18" font-weight="700" stroke="none">0</text>
  <text class="hi" x="268" y="166" text-anchor="middle" font-size="18" font-weight="700" stroke="none">1</text>
  <text class="muted" x="360" y="166" text-anchor="middle" font-size="18" font-weight="700" stroke="none">0</text>
  <text class="hi" x="452" y="166" text-anchor="middle" font-size="18" font-weight="700" stroke="none">1</text>
  <text class="hi" x="544" y="166" text-anchor="middle" font-size="18" font-weight="700" stroke="none">1</text>
  <text class="hi" x="636" y="166" text-anchor="middle" font-size="18" font-weight="700" stroke="none">1</text>

  <text class="ink" x="360" y="220" text-anchor="middle" font-size="14">[0, 0, 1, 0, 1, 1, 1]</text>
  <text class="muted" x="360" y="244" text-anchor="middle" font-size="12">i, love, machine, learning = 1; food, great, is = 0</text>
  <text class="muted" x="360" y="280" text-anchor="middle" font-size="12">|V| = 7</text>
</svg>
