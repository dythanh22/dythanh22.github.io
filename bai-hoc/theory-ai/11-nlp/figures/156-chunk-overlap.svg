<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="chunk-156-title">
  <title id="chunk-156-title">Chunks 0-30, 20-50, 40-70 with overlap 10</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .uniq { fill: #E8F0FE; stroke: #2F6FED; }
    .ov { fill: #FCE8D5; stroke: #C45C0A; }
    .nofill { fill: none; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .uniq { fill: #1A2A44; stroke: #8AB4F8; }
      .ov { fill: #3A2A14; stroke: #F9AB00; }
    }
  </style>

  <text id="chunk-156-heading" class="ink" x="360" y="26" text-anchor="middle" font-size="15" font-weight="600">Fixed-size chunks with overlap</text>
  <text class="muted" x="360" y="46" text-anchor="middle" font-size="12">chunk_size = 30, overlap = 10, stride = 20</text>

  <text class="ink" x="90" y="88" text-anchor="end" font-size="12">chunk 0</text>
  <text class="muted" x="90" y="104" text-anchor="end" font-size="11">0-30</text>
  <text class="ink" x="90" y="148" text-anchor="end" font-size="12">chunk 1</text>
  <text class="muted" x="90" y="164" text-anchor="end" font-size="11">20-50</text>
  <text class="ink" x="90" y="208" text-anchor="end" font-size="12">chunk 2</text>
  <text class="muted" x="90" y="224" text-anchor="end" font-size="11">40-70</text>

  <!-- x(p) = 110 + p * 8; bar h = 32 -->
  <!-- chunk 0: 0-20 unique, 20-30 overlap -->
  <rect class="uniq" x="110" y="72" width="160" height="32" stroke-width="1.5"/>
  <rect class="ov" x="270" y="72" width="80" height="32" stroke-width="1.5" data-allow-overlap="1"/>

  <!-- chunk 1: 20-30 ov, 30-40 uniq, 40-50 ov -->
  <rect class="ov" x="270" y="132" width="80" height="32" stroke-width="1.5" data-allow-overlap="1"/>
  <rect class="uniq" x="350" y="132" width="80" height="32" stroke-width="1.5"/>
  <rect class="ov" x="430" y="132" width="80" height="32" stroke-width="1.5" data-allow-overlap="1"/>

  <!-- chunk 2: 40-50 ov, 50-70 uniq -->
  <rect class="ov" x="430" y="192" width="80" height="32" stroke-width="1.5" data-allow-overlap="1"/>
  <rect class="uniq" x="510" y="192" width="160" height="32" stroke-width="1.5"/>

  <line class="ink nofill" x1="110" y1="250" x2="670" y2="250" stroke-width="1.25"/>
  <line class="ink nofill" x1="110" y1="246" x2="110" y2="254" stroke-width="1.25"/>
  <line class="ink nofill" x1="190" y1="246" x2="190" y2="254" stroke-width="1.25"/>
  <line class="ink nofill" x1="270" y1="246" x2="270" y2="254" stroke-width="1.25"/>
  <line class="ink nofill" x1="350" y1="246" x2="350" y2="254" stroke-width="1.25"/>
  <line class="ink nofill" x1="430" y1="246" x2="430" y2="254" stroke-width="1.25"/>
  <line class="ink nofill" x1="510" y1="246" x2="510" y2="254" stroke-width="1.25"/>
  <line class="ink nofill" x1="590" y1="246" x2="590" y2="254" stroke-width="1.25"/>
  <line class="ink nofill" x1="670" y1="246" x2="670" y2="254" stroke-width="1.25"/>

  <text class="muted" x="110" y="270" text-anchor="middle" font-size="11">0</text>
  <text class="muted" x="190" y="270" text-anchor="middle" font-size="11">10</text>
  <text class="muted" x="270" y="270" text-anchor="middle" font-size="11">20</text>
  <text class="muted" x="350" y="270" text-anchor="middle" font-size="11">30</text>
  <text class="muted" x="430" y="270" text-anchor="middle" font-size="11">40</text>
  <text class="muted" x="510" y="270" text-anchor="middle" font-size="11">50</text>
  <text class="muted" x="590" y="270" text-anchor="middle" font-size="11">60</text>
  <text class="muted" x="670" y="270" text-anchor="middle" font-size="11">70</text>

  <text class="hi" x="310" y="292" text-anchor="middle" font-size="12" stroke="none">jumps over</text>
  <line class="hi nofill" x1="270" y1="278" x2="350" y2="278" stroke-width="1.5"/>

  <rect class="uniq" x="200" y="312" width="14" height="14" rx="2" stroke-width="1.25"/>
  <text class="muted" x="220" y="324" text-anchor="start" font-size="12">unique</text>
  <rect class="ov" x="292" y="312" width="14" height="14" rx="2" stroke-width="1.25"/>
  <text class="muted" x="312" y="324" text-anchor="start" font-size="12">overlap</text>
  <text class="muted" x="430" y="324" text-anchor="start" font-size="12">char index</text>
</svg>
