<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-labelledby="stopw-100-title">
  <title id="stopw-100-title">Stopword removal keeps content words</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .keep { fill: #E8F0FE; stroke: #2F6FED; }
    .drop { fill: #FCE8D5; stroke: #C45C0A; }
    .nofill { fill: none; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    
  </style>

  <text id="stopw-100-heading" class="ink" x="360" y="26" text-anchor="middle" font-size="15" font-weight="600">Stopword removal</text>

  <rect class="keep" x="248" y="38" width="14" height="14" rx="2" stroke-width="1.25"/>
  <text class="muted" x="268" y="50" text-anchor="start" font-size="12">keep</text>
  <rect class="drop" x="322" y="38" width="14" height="14" rx="2" stroke-width="1.25"/>
  <text class="muted" x="342" y="50" text-anchor="start" font-size="12">drop (the, over)</text>

  <text class="muted" x="360" y="74" text-anchor="middle" font-size="12">input tokens</text>

  <!-- 9 boxes: w=66, gap=8, x0=31, y=86 -->
  <rect class="drop" x="31" y="86" width="66" height="40" rx="3" stroke-width="1.5"/>
  <rect class="keep" x="105" y="86" width="66" height="40" rx="3" stroke-width="1.5"/>
  <rect class="keep" x="179" y="86" width="66" height="40" rx="3" stroke-width="1.5"/>
  <rect class="keep" x="253" y="86" width="66" height="40" rx="3" stroke-width="1.5"/>
  <rect class="keep" x="327" y="86" width="66" height="40" rx="3" stroke-width="1.5"/>
  <rect class="drop" x="401" y="86" width="66" height="40" rx="3" stroke-width="1.5"/>
  <rect class="drop" x="475" y="86" width="66" height="40" rx="3" stroke-width="1.5"/>
  <rect class="keep" x="549" y="86" width="66" height="40" rx="3" stroke-width="1.5"/>
  <rect class="keep" x="623" y="86" width="66" height="40" rx="3" stroke-width="1.5"/>

  <text class="hi" x="64" y="112" text-anchor="middle" font-size="13" font-weight="600" stroke="none">The</text>
  <text class="accent" x="138" y="112" text-anchor="middle" font-size="13" font-weight="600" stroke="none">quick</text>
  <text class="accent" x="212" y="112" text-anchor="middle" font-size="13" font-weight="600" stroke="none">brown</text>
  <text class="accent" x="286" y="112" text-anchor="middle" font-size="13" font-weight="600" stroke="none">fox</text>
  <text class="accent" x="360" y="112" text-anchor="middle" font-size="13" font-weight="600" stroke="none">jumps</text>
  <text class="hi" x="434" y="112" text-anchor="middle" font-size="13" font-weight="600" stroke="none">over</text>
  <text class="hi" x="508" y="112" text-anchor="middle" font-size="13" font-weight="600" stroke="none">the</text>
  <text class="accent" x="582" y="112" text-anchor="middle" font-size="13" font-weight="600" stroke="none">lazy</text>
  <text class="accent" x="656" y="112" text-anchor="middle" font-size="13" font-weight="600" stroke="none">dog</text>

  <line class="hi nofill" x1="41" y1="106" x2="87" y2="106" stroke-width="1.5"/>
  <line class="hi nofill" x1="411" y1="106" x2="457" y2="106" stroke-width="1.5"/>
  <line class="hi nofill" x1="485" y1="106" x2="531" y2="106" stroke-width="1.5"/>

  <line class="accent nofill" x1="360" y1="138" x2="360" y2="168" stroke-width="2"/>
  <polygon class="accent" points="354,168 360,180 366,168" stroke="none"/>

  <text class="muted" x="360" y="200" text-anchor="middle" font-size="12">kept tokens</text>

  <!-- 6 kept boxes: total 436, x0=142, y=210 -->
  <rect class="keep" x="142" y="210" width="66" height="40" rx="3" stroke-width="1.5"/>
  <rect class="keep" x="216" y="210" width="66" height="40" rx="3" stroke-width="1.5"/>
  <rect class="keep" x="290" y="210" width="66" height="40" rx="3" stroke-width="1.5"/>
  <rect class="keep" x="364" y="210" width="66" height="40" rx="3" stroke-width="1.5"/>
  <rect class="keep" x="438" y="210" width="66" height="40" rx="3" stroke-width="1.5"/>
  <rect class="keep" x="512" y="210" width="66" height="40" rx="3" stroke-width="1.5"/>

  <text class="accent" x="175" y="236" text-anchor="middle" font-size="13" font-weight="600" stroke="none">quick</text>
  <text class="accent" x="249" y="236" text-anchor="middle" font-size="13" font-weight="600" stroke="none">brown</text>
  <text class="accent" x="323" y="236" text-anchor="middle" font-size="13" font-weight="600" stroke="none">fox</text>
  <text class="accent" x="397" y="236" text-anchor="middle" font-size="13" font-weight="600" stroke="none">jumps</text>
  <text class="accent" x="471" y="236" text-anchor="middle" font-size="13" font-weight="600" stroke="none">lazy</text>
  <text class="accent" x="545" y="236" text-anchor="middle" font-size="13" font-weight="600" stroke="none">dog</text>

  <text class="muted" x="360" y="274" text-anchor="middle" font-size="12">drop the (x2) and over; keep 6 content words</text>
</svg>
