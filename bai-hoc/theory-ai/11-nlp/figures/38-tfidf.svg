<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="tfidf-38-title">
  <title id="tfidf-38-title">D1 TF-IDF: cat 0.405 vs sat/mat 1.099</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .nofill { fill: none; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
    }
  </style>

  <text id="tfidf-38-heading" class="ink" x="360" y="26" text-anchor="middle" font-size="15" font-weight="600">D1 TF-IDF: cat 0.405 vs sat/mat 1.099</text>

  <line class="ink nofill" x1="80" y1="310" x2="680" y2="310" stroke-width="1.25"/>
  <line class="ink nofill" x1="80" y1="70" x2="80" y2="310" stroke-width="1.25"/>

  <line class="muted nofill" x1="80" y1="150" x2="680" y2="150" stroke-width="1" stroke-dasharray="4 4" opacity="0.35"/>
  <line class="muted nofill" x1="80" y1="230" x2="680" y2="230" stroke-width="1" stroke-dasharray="4 4" opacity="0.35"/>

  <text class="muted" x="68" y="74" text-anchor="end" font-size="12">1.2</text>
  <text class="muted" x="68" y="154" text-anchor="end" font-size="12">0.8</text>
  <text class="muted" x="68" y="234" text-anchor="end" font-size="12">0.4</text>
  <text class="muted" x="68" y="314" text-anchor="end" font-size="12">0</text>
  <text class="ink" x="22" y="190" text-anchor="middle" font-size="13" transform="rotate(-90 22 190)">tf-idf</text>

  <rect class="accent" x="140" y="229" width="100" height="81" rx="2" stroke="none"/>
  <text class="accent" x="190" y="217" text-anchor="middle" font-size="14" font-weight="700" stroke="none">0.405</text>
  <text class="ink" x="190" y="332" text-anchor="middle" font-size="13" stroke="none">cat</text>
  <text class="muted" x="190" y="350" text-anchor="middle" font-size="11" stroke="none">n_t = 2</text>

  <rect class="hi" x="320" y="90" width="100" height="220" rx="2" stroke="none"/>
  <text class="hi" x="370" y="78" text-anchor="middle" font-size="14" font-weight="700" stroke="none">1.099</text>
  <text class="ink" x="370" y="332" text-anchor="middle" font-size="13" stroke="none">sat</text>
  <text class="muted" x="370" y="350" text-anchor="middle" font-size="11" stroke="none">n_t = 1</text>

  <rect class="hi" x="500" y="90" width="100" height="220" rx="2" stroke="none"/>
  <text class="hi" x="550" y="78" text-anchor="middle" font-size="14" font-weight="700" stroke="none">1.099</text>
  <text class="ink" x="550" y="332" text-anchor="middle" font-size="13" stroke="none">mat</text>
  <text class="muted" x="550" y="350" text-anchor="middle" font-size="11" stroke="none">n_t = 1</text>

  <text class="muted" x="360" y="378" text-anchor="middle" font-size="13">tf = 1 for all three; idf(cat) = log(3/2) &#x2248; 0.405</text>
  <text class="muted" x="360" y="398" text-anchor="middle" font-size="12">idf(sat) = idf(mat) = log(3/1) &#x2248; 1.099</text>
</svg>
