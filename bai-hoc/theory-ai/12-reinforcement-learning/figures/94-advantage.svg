<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="adv-94-title">
  <title id="adv-94-title">Advantage: G=[6,5,3], V=[0.5,1.0,1.5], A=[5.5,4.0,1.5]</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .accent-soft { fill: #2F6FED; fill-opacity: 0.08; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .hi-soft { fill: #C45C0A; fill-opacity: 0.08; stroke: #C45C0A; }
    .card { fill: none; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    
  </style>

  <text id="adv-94-heading" class="ink" x="360" y="28" text-anchor="middle" font-size="16" font-weight="600">A_t = G_t - V(s_t), &#x03B3; = 1</text>

  <rect class="accent-soft card" x="28" y="52" width="212" height="268" rx="8" stroke-width="1.5"/>
  <text class="accent" x="134" y="84" text-anchor="middle" font-size="14" font-weight="600" stroke="none">t = 0</text>
  <text class="ink" x="134" y="124" text-anchor="middle" font-size="13" stroke="none">r = 1</text>
  <text class="ink" x="134" y="156" text-anchor="middle" font-size="13" stroke="none">G = 1+2+3 = 6</text>
  <text class="muted" x="134" y="192" text-anchor="middle" font-size="13" stroke="none">V(0) = 0.5</text>
  <text class="accent" x="134" y="244" text-anchor="middle" font-size="16" font-weight="600" stroke="none">A = 6 - 0.5</text>
  <text class="accent" x="134" y="276" text-anchor="middle" font-size="18" font-weight="700" stroke="none">5.5</text>

  <rect class="accent-soft card" x="254" y="52" width="212" height="268" rx="8" stroke-width="1.5"/>
  <text class="accent" x="360" y="84" text-anchor="middle" font-size="14" font-weight="600" stroke="none">t = 1</text>
  <text class="ink" x="360" y="124" text-anchor="middle" font-size="13" stroke="none">r = 2</text>
  <text class="ink" x="360" y="156" text-anchor="middle" font-size="13" stroke="none">G = 2+3 = 5</text>
  <text class="muted" x="360" y="192" text-anchor="middle" font-size="13" stroke="none">V(1) = 1.0</text>
  <text class="accent" x="360" y="244" text-anchor="middle" font-size="16" font-weight="600" stroke="none">A = 5 - 1.0</text>
  <text class="accent" x="360" y="276" text-anchor="middle" font-size="18" font-weight="700" stroke="none">4.0</text>

  <rect class="hi-soft card" x="480" y="52" width="212" height="268" rx="8" stroke-width="1.5"/>
  <text class="hi" x="586" y="84" text-anchor="middle" font-size="14" font-weight="600" stroke="none">t = 2</text>
  <text class="ink" x="586" y="124" text-anchor="middle" font-size="13" stroke="none">r = 3</text>
  <text class="ink" x="586" y="156" text-anchor="middle" font-size="13" stroke="none">G = 3</text>
  <text class="muted" x="586" y="192" text-anchor="middle" font-size="13" stroke="none">V(2) = 1.5</text>
  <text class="hi" x="586" y="244" text-anchor="middle" font-size="16" font-weight="600" stroke="none">A = 3 - 1.5</text>
  <text class="hi" x="586" y="276" text-anchor="middle" font-size="18" font-weight="700" stroke="none">1.5</text>

  <text class="muted" x="360" y="356" text-anchor="middle" font-size="12" stroke="none">all A_t &gt; 0: every step beat V(s_t)</text>
  <text class="muted" x="360" y="380" text-anchor="middle" font-size="12" stroke="none">A = [5.5, 4.0, 1.5]</text>
</svg>
