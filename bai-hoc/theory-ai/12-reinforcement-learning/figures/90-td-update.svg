      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .accent-soft { fill: #8AB4F8; fill-opacity: 0.12; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .hi-soft { fill: #F9AB00; fill-opacity: 0.12; stroke: #F9AB00; }
    }
  </style>
  <defs>
    <marker id="td-90-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" class="ink" stroke="none"/>
    </marker>
  </defs>

  <text id="td-90-heading" class="ink" x="360" y="28" text-anchor="middle" font-size="16" font-weight="600">TD(0), &#x03B1; = 0.1, &#x03B3; = 0.9</text>

  <rect class="accent-soft card" x="24" y="52" width="200" height="220" rx="8" stroke-width="1.5"/>
  <text class="accent" x="124" y="84" text-anchor="middle" font-size="13" font-weight="600" stroke="none">Observed</text>
  <text class="ink" x="124" y="128" text-anchor="middle" font-size="14" stroke="none">V(S_t) = 10</text>
  <text class="ink" x="124" y="164" text-anchor="middle" font-size="14" stroke="none">R = 3</text>
  <text class="ink" x="124" y="200" text-anchor="middle" font-size="14" stroke="none">V(S') = 8</text>

  <line class="ink" x1="234" y1="162" x2="268" y2="162" stroke-width="1.5" marker-end="url(#td-90-arrow)"/>

  <rect class="accent-soft card" x="278" y="52" width="200" height="220" rx="8" stroke-width="1.5"/>
  <text class="accent" x="378" y="84" text-anchor="middle" font-size="13" font-weight="600" stroke="none">TD target</text>
  <text class="ink" x="378" y="128" text-anchor="middle" font-size="13" stroke="none">3 + 0.9 x 8</text>
  <text class="ink" x="378" y="164" text-anchor="middle" font-size="13" stroke="none">= 3 + 7.2</text>
  <text class="accent" x="378" y="208" text-anchor="middle" font-size="16" font-weight="600" stroke="none">target = 10.2</text>

  <line class="ink" x1="488" y1="162" x2="522" y2="162" stroke-width="1.5" marker-end="url(#td-90-arrow)"/>

  <rect class="hi-soft card" x="532" y="52" width="164" height="220" rx="8" stroke-width="1.5"/>
  <text class="hi" x="614" y="84" text-anchor="middle" font-size="13" font-weight="600" stroke="none">Update</text>
  <text class="ink" x="614" y="128" text-anchor="middle" font-size="13" stroke="none">&#x03B4; = 10.2 - 10</text>
  <text class="hi" x="614" y="164" text-anchor="middle" font-size="15" font-weight="600" stroke="none">&#x03B4; = 0.2</text>
  <text class="ink" x="614" y="208" text-anchor="middle" font-size="13" stroke="none">10 + 0.1 x 0.2</text>
  <text class="hi" x="614" y="244" text-anchor="middle" font-size="15" font-weight="600" stroke="none">V &#x2190; 10.02</text>

  <text class="muted" x="360" y="316" text-anchor="middle" font-size="12" stroke="none">target = R + &#x03B3; V(S') pulls V(S_t) by &#x03B1; &#x03B4;</text>
  <text class="muted" x="360" y="348" text-anchor="middle" font-size="12" stroke="none">V moves 10 &#x2192; 10.02</text>
