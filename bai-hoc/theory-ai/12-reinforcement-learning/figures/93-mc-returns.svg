<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="mcpe-93-title">
  <title id="mcpe-93-title">MC returns backward: G2=3, G1=4.7, G0=5.23</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .accent-soft { fill: #2F6FED; fill-opacity: 0.08; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .hi-soft { fill: #C45C0A; fill-opacity: 0.08; stroke: #C45C0A; }
    .card { fill: none; }
    .link { fill: none; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .accent-soft { fill: #8AB4F8; fill-opacity: 0.12; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .hi-soft { fill: #F9AB00; fill-opacity: 0.12; stroke: #F9AB00; }
    }
  </style>
  <defs>
    <marker id="mcpe-93-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" class="ink" stroke="none"/>
    </marker>
  </defs>

  <text id="mcpe-93-heading" class="ink" x="360" y="28" text-anchor="middle" font-size="16" font-weight="600">Monte Carlo returns, &#x03B3; = 0.9</text>

  <rect class="accent-soft card" x="36" y="56" width="120" height="88" rx="8" stroke-width="1.5"/>
  <text class="accent" x="96" y="92" text-anchor="middle" font-size="16" font-weight="600" stroke="none">S0</text>
  <text class="muted" x="96" y="118" text-anchor="middle" font-size="12" stroke="none">start</text>

  <rect class="accent-soft card" x="212" y="56" width="120" height="88" rx="8" stroke-width="1.5"/>
  <text class="accent" x="272" y="92" text-anchor="middle" font-size="16" font-weight="600" stroke="none">S1</text>
  <text class="muted" x="272" y="118" text-anchor="middle" font-size="12" stroke="none">t = 1</text>

  <rect class="accent-soft card" x="388" y="56" width="120" height="88" rx="8" stroke-width="1.5"/>
  <text class="accent" x="448" y="92" text-anchor="middle" font-size="16" font-weight="600" stroke="none">S2</text>
  <text class="muted" x="448" y="118" text-anchor="middle" font-size="12" stroke="none">t = 2</text>

  <rect class="hi-soft card" x="564" y="56" width="120" height="88" rx="8" stroke-width="1.5"/>
  <text class="hi" x="624" y="92" text-anchor="middle" font-size="16" font-weight="600" stroke="none">T</text>
  <text class="muted" x="624" y="118" text-anchor="middle" font-size="12" stroke="none">terminal</text>

  <line class="ink link" x1="162" y1="100" x2="206" y2="100" stroke-width="1.5" marker-end="url(#mcpe-93-arrow)"/>
  <line class="ink link" x1="338" y1="100" x2="382" y2="100" stroke-width="1.5" marker-end="url(#mcpe-93-arrow)"/>
  <line class="ink link" x1="514" y1="100" x2="558" y2="100" stroke-width="1.5" marker-end="url(#mcpe-93-arrow)"/>

  <text class="ink" x="184" y="88" text-anchor="middle" font-size="12" font-weight="600" stroke="none">R=1</text>
  <text class="ink" x="360" y="88" text-anchor="middle" font-size="12" font-weight="600" stroke="none">R=2</text>
  <text class="ink" x="536" y="88" text-anchor="middle" font-size="12" font-weight="600" stroke="none">R=3</text>

  <rect class="hi-soft card" x="36" y="188" width="648" height="148" rx="8" stroke-width="1.5"/>
  <text class="hi" x="360" y="216" text-anchor="middle" font-size="13" font-weight="600" stroke="none">backward: G(t) = R(t+1) + &#x03B3; G(t+1)</text>

  <text class="muted" x="96" y="252" text-anchor="middle" font-size="12" stroke="none">1 + 0.9 x 4.7</text>
  <text class="hi" x="96" y="280" text-anchor="middle" font-size="16" font-weight="700" stroke="none">G0 = 5.23</text>

  <text class="muted" x="272" y="252" text-anchor="middle" font-size="12" stroke="none">2 + 0.9 x 3</text>
  <text class="hi" x="272" y="280" text-anchor="middle" font-size="16" font-weight="700" stroke="none">G1 = 4.7</text>

  <text class="muted" x="448" y="252" text-anchor="middle" font-size="12" stroke="none">R3</text>
  <text class="hi" x="448" y="280" text-anchor="middle" font-size="16" font-weight="700" stroke="none">G2 = 3</text>

  <text class="muted" x="624" y="252" text-anchor="middle" font-size="12" stroke="none">end</text>
  <text class="muted" x="624" y="280" text-anchor="middle" font-size="14" stroke="none">V(T) = 0</text>

  <text class="muted" x="360" y="318" text-anchor="middle" font-size="12" stroke="none">compute right to left, then append each G to Returns(S_t)</text>
</svg>
