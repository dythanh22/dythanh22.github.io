<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="per-142-title">
  <title id="per-142-title">PER sampling probabilities: P approx 0.115, 0.452, 0.025, 0.339, 0.070; transition 2 highest</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .axis { fill: none; stroke: #1A1A1A; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    
  </style>
  <text id="per-142-heading" class="ink" x="360" y="28" text-anchor="middle" font-size="16" font-weight="600">PER probabilities, &#x03B5; = 0.01, &#x03B1; = 1</text>

  <line class="axis" x1="72" y1="280" x2="680" y2="280" stroke-width="1.25"/>
  <line class="axis" x1="72" y1="56" x2="72" y2="280" stroke-width="1.25"/>
  <text class="muted" x="64" y="284" text-anchor="end" font-size="12">0</text>
  <text class="muted" x="64" y="184" text-anchor="end" font-size="12">0.25</text>
  <text class="muted" x="64" y="84" text-anchor="end" font-size="12">0.50</text>
  <line class="muted" x1="72" y1="180" x2="680" y2="180" stroke-width="1" stroke-dasharray="4 4" opacity="0.45"/>
  <line class="muted" x1="72" y1="80" x2="680" y2="80" stroke-width="1" stroke-dasharray="4 4" opacity="0.45"/>

  <rect class="accent" x="100" y="234" width="64" height="46" data-allow-overlap="1"/>
  <text class="muted" x="132" y="226" text-anchor="middle" font-size="12">0.115</text>
  <text class="ink" x="132" y="300" text-anchor="middle" font-size="13">1</text>
  <text class="muted" x="132" y="318" text-anchor="middle" font-size="11">|&#x03B4;|=0.5</text>

  <rect class="hi" x="210" y="99.2" width="64" height="180.8" data-allow-overlap="1"/>
  <text class="hi" x="242" y="91" text-anchor="middle" font-size="12" font-weight="600">0.452</text>
  <text class="ink" x="242" y="300" text-anchor="middle" font-size="13">2</text>
  <text class="muted" x="242" y="318" text-anchor="middle" font-size="11">|&#x03B4;|=2.0</text>

  <rect class="accent" x="320" y="270" width="64" height="10" data-allow-overlap="1"/>
  <text class="muted" x="352" y="262" text-anchor="middle" font-size="12">0.025</text>
  <text class="ink" x="352" y="300" text-anchor="middle" font-size="13">3</text>
  <text class="muted" x="352" y="318" text-anchor="middle" font-size="11">|&#x03B4;|=0.1</text>

  <rect class="accent" x="430" y="144.4" width="64" height="135.6" data-allow-overlap="1"/>
  <text class="muted" x="462" y="136" text-anchor="middle" font-size="12">0.339</text>
  <text class="ink" x="462" y="300" text-anchor="middle" font-size="13">4</text>
  <text class="muted" x="462" y="318" text-anchor="middle" font-size="11">|&#x03B4;|=1.5</text>

  <rect class="accent" x="540" y="252" width="64" height="28" data-allow-overlap="1"/>
  <text class="muted" x="572" y="244" text-anchor="middle" font-size="12">0.070</text>
  <text class="ink" x="572" y="300" text-anchor="middle" font-size="13">5</text>
  <text class="muted" x="572" y="318" text-anchor="middle" font-size="11">|&#x03B4;|=0.3</text>

  <text class="ink" x="376" y="348" text-anchor="middle" font-size="13">transition</text>
  <text class="ink" x="22" y="168" text-anchor="middle" font-size="13" transform="rotate(-90 22 168)">P(i)</text>
</svg>
