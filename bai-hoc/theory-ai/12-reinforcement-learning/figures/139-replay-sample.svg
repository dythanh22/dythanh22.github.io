<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="replay-139-title">
  <title id="replay-139-title">Replay buffer cap 5: sample indices 2,0,4 yield transitions s3, s1, s5</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .accent-soft { fill: #2F6FED; fill-opacity: 0.08; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .hi-soft { fill: #C45C0A; fill-opacity: 0.08; stroke: #C45C0A; }
    .card { fill: none; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .accent-soft { fill: #8AB4F8; fill-opacity: 0.12; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .hi-soft { fill: #F9AB00; fill-opacity: 0.12; stroke: #F9AB00; }
    }
  </style>
  <defs>
    <marker id="replay-139-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" class="ink" stroke="none"/>
    </marker>
  </defs>

  <text id="replay-139-heading" class="ink" x="360" y="28" text-anchor="middle" font-size="16" font-weight="600">Uniform sample, capacity = 5, batch = 3</text>

  <text class="muted" x="360" y="52" text-anchor="middle" font-size="12" stroke="none">Buffer slots (FIFO ring)</text>

  <rect class="hi-soft card" x="24" y="68" width="120" height="88" rx="8" stroke-width="1.5"/>
  <text class="muted" x="84" y="92" text-anchor="middle" font-size="12" stroke="none">index 0</text>
  <text class="hi" x="84" y="118" text-anchor="middle" font-size="14" font-weight="600" stroke="none">s1</text>
  <text class="muted" x="84" y="140" text-anchor="middle" font-size="11" stroke="none">done = False</text>

  <rect class="card ink" x="160" y="68" width="120" height="88" rx="8" stroke-width="1.25"/>
  <text class="muted" x="220" y="92" text-anchor="middle" font-size="12" stroke="none">index 1</text>
  <text class="ink" x="220" y="118" text-anchor="middle" font-size="14" stroke="none">s2</text>
  <text class="muted" x="220" y="140" text-anchor="middle" font-size="11" stroke="none">done = False</text>

  <rect class="hi-soft card" x="296" y="68" width="120" height="88" rx="8" stroke-width="1.5"/>
  <text class="muted" x="356" y="92" text-anchor="middle" font-size="12" stroke="none">index 2</text>
  <text class="hi" x="356" y="118" text-anchor="middle" font-size="14" font-weight="600" stroke="none">s3</text>
  <text class="muted" x="356" y="140" text-anchor="middle" font-size="11" stroke="none">done = False</text>

  <rect class="card ink" x="432" y="68" width="120" height="88" rx="8" stroke-width="1.25"/>
  <text class="muted" x="492" y="92" text-anchor="middle" font-size="12" stroke="none">index 3</text>
  <text class="ink" x="492" y="118" text-anchor="middle" font-size="14" stroke="none">s4</text>
  <text class="muted" x="492" y="140" text-anchor="middle" font-size="11" stroke="none">done = True</text>

  <rect class="hi-soft card" x="568" y="68" width="128" height="88" rx="8" stroke-width="1.5"/>
  <text class="muted" x="632" y="92" text-anchor="middle" font-size="12" stroke="none">index 4</text>
  <text class="hi" x="632" y="118" text-anchor="middle" font-size="14" font-weight="600" stroke="none">s5</text>
  <text class="muted" x="632" y="140" text-anchor="middle" font-size="11" stroke="none">done = False</text>

  <line class="ink" x1="84" y1="156" x2="84" y2="196" stroke-width="1.5" marker-end="url(#replay-139-arrow)"/>
  <line class="ink" x1="356" y1="156" x2="356" y2="196" stroke-width="1.5" marker-end="url(#replay-139-arrow)"/>
  <line class="ink" x1="632" y1="156" x2="632" y2="196" stroke-width="1.5" marker-end="url(#replay-139-arrow)"/>

  <rect class="accent-soft card" x="24" y="204" width="672" height="100" rx="8" stroke-width="1.5"/>
  <text class="accent" x="360" y="232" text-anchor="middle" font-size="14" font-weight="600" stroke="none">Sample indices [2, 0, 4]</text>
  <text class="ink" x="360" y="262" text-anchor="middle" font-size="14" stroke="none">batch: s3, s1, s5</text>
  <text class="muted" x="360" y="286" text-anchor="middle" font-size="12" stroke="none">Order follows the sampled index list, not buffer order</text>

  <text class="muted" x="360" y="336" text-anchor="middle" font-size="12" stroke="none">P(select i) = 1/5 for every slot</text>
</svg>
