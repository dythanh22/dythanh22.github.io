<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="qlearn-91-title">
  <title id="qlearn-91-title">Q-learning: max Q(s')=7, target=8.3, Q to 5.33</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .accent-soft { fill: #2F6FED; fill-opacity: 0.08; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .hi-soft { fill: #C45C0A; fill-opacity: 0.08; stroke: #C45C0A; }
    .card { fill: none; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .accent-soft { fill: #8AB4F8; fill-opacity: 0.12; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .hi-soft { fill: #F9AB00; fill-opacity: 0.12; stroke: #F9AB00; }
    }
  </style>
  <defs>
    <marker id="qlearn-91-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" class="ink" stroke="none"/>
    </marker>
  </defs>

  <text id="qlearn-91-heading" class="ink" x="360" y="28" text-anchor="middle" font-size="16" font-weight="600">Q-learning, &#x03B1; = 0.1, &#x03B3; = 0.9</text>

  <rect class="accent-soft card" x="24" y="48" width="210" height="236" rx="8" stroke-width="1.5"/>
  <text class="accent" x="129" y="78" text-anchor="middle" font-size="13" font-weight="600" stroke="none">Current</text>
  <text class="ink" x="129" y="118" text-anchor="middle" font-size="14" stroke="none">Q(s, a) = 5.0</text>
  <text class="ink" x="129" y="154" text-anchor="middle" font-size="14" stroke="none">r = 2</text>
  <text class="muted" x="129" y="198" text-anchor="middle" font-size="12" stroke="none">Q(s'): 3, 7, 4</text>
  <text class="accent" x="129" y="238" text-anchor="middle" font-size="14" font-weight="600" stroke="none">max = 7</text>

  <line class="ink" x1="244" y1="166" x2="278" y2="166" stroke-width="1.5" marker-end="url(#qlearn-91-arrow)"/>

  <rect class="accent-soft card" x="288" y="48" width="196" height="236" rx="8" stroke-width="1.5"/>
  <text class="accent" x="386" y="78" text-anchor="middle" font-size="13" font-weight="600" stroke="none">TD target</text>
  <text class="ink" x="386" y="126" text-anchor="middle" font-size="13" stroke="none">2 + 0.9 x 7</text>
  <text class="ink" x="386" y="162" text-anchor="middle" font-size="13" stroke="none">= 2 + 6.3</text>
  <text class="accent" x="386" y="214" text-anchor="middle" font-size="16" font-weight="600" stroke="none">target = 8.3</text>

  <line class="ink" x1="494" y1="166" x2="528" y2="166" stroke-width="1.5" marker-end="url(#qlearn-91-arrow)"/>

  <rect class="hi-soft card" x="538" y="48" width="158" height="236" rx="8" stroke-width="1.5"/>
  <text class="hi" x="617" y="78" text-anchor="middle" font-size="13" font-weight="600" stroke="none">Update</text>
  <text class="ink" x="617" y="122" text-anchor="middle" font-size="13" stroke="none">8.3 - 5.0</text>
  <text class="hi" x="617" y="158" text-anchor="middle" font-size="15" font-weight="600" stroke="none">&#x03B4; = 3.3</text>
  <text class="ink" x="617" y="200" text-anchor="middle" font-size="13" stroke="none">5.0 + 0.1 x 3.3</text>
  <text class="hi" x="617" y="244" text-anchor="middle" font-size="15" font-weight="600" stroke="none">Q &#x2190; 5.33</text>

  <text class="muted" x="360" y="328" text-anchor="middle" font-size="12" stroke="none">off-policy target uses max Q(s'), not the action taken</text>
  <text class="muted" x="360" y="356" text-anchor="middle" font-size="12" stroke="none">max(3, 7, 4) = 7</text>
</svg>
