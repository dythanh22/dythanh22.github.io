<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="viter-12-title">
  <title id="viter-12-title">Value iteration one step: V' = [2.0, 0.0], gamma=0.9</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .accent-soft { fill: #2F6FED; fill-opacity: 0.08; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .hi-soft { fill: #C45C0A; fill-opacity: 0.08; stroke: #C45C0A; }
    .card { fill: none; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .accent-soft { fill: #8AB4F8; fill-opacity: 0.12; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .hi-soft { fill: #F9AB00; fill-opacity: 0.12; stroke: #F9AB00; }
    }
  </style>
  <defs>
    <marker id="viter-12-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" class="ink" stroke="none"/>
    </marker>
  </defs>

  <text id="viter-12-heading" class="ink" x="360" y="28" text-anchor="middle" font-size="16" font-weight="600">Value iteration, V init 0, &#x03B3; = 0.9</text>

  <rect class="accent-soft card" x="32" y="48" width="300" height="248" rx="8" stroke-width="1.5"/>
  <text class="accent" x="182" y="76" text-anchor="middle" font-size="14" font-weight="600" stroke="none">State 0,  V(0) = 0</text>
  <text class="ink" x="52" y="112" font-size="13" stroke="none">Q(0, a0) = R = 1</text>
  <text class="ink" x="52" y="144" font-size="13" stroke="none">Q(0, a1) = R = 2</text>
  <text class="muted" x="52" y="180" font-size="13" stroke="none">future term = 0 (V = 0)</text>
  <text class="accent" x="52" y="232" font-size="16" font-weight="600" stroke="none">V'(0) = max(1, 2) = 2</text>

  <rect class="hi-soft card" x="388" y="48" width="300" height="248" rx="8" stroke-width="1.5"/>
  <text class="hi" x="538" y="76" text-anchor="middle" font-size="14" font-weight="600" stroke="none">State 1,  V(1) = 0</text>
  <text class="ink" x="408" y="112" font-size="13" stroke="none">Q(1, a0) = R = -1</text>
  <text class="ink" x="408" y="144" font-size="13" stroke="none">Q(1, a1) = R = 0</text>
  <text class="muted" x="408" y="180" font-size="13" stroke="none">future term = 0 (V = 0)</text>
  <text class="hi" x="408" y="232" font-size="16" font-weight="600" stroke="none">V'(1) = max(-1, 0) = 0</text>

  <line class="ink" x1="342" y1="172" x2="378" y2="172" stroke-width="1.5" marker-end="url(#viter-12-arrow)"/>

  <rect class="accent-soft card" x="160" y="320" width="400" height="56" rx="8" stroke-width="1.5"/>
  <text class="ink" x="360" y="354" text-anchor="middle" font-size="15" font-weight="600" stroke="none">after 1 iter: V = [2.0, 0.0]</text>
</svg>
