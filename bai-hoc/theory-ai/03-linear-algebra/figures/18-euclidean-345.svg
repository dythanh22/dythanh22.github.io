<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" aria-labelledby="eucl-18-title">
  <title id="eucl-18-title">Euclidean 3-4-5 right triangle</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .axis { fill: none; stroke: #1A1A1A; }
    .grid { fill: none; stroke: #C8CDD3; }
    .soft { fill: #2F6FED; fill-opacity: 0.08; stroke: none; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .axis { stroke: #E8EAED; }
      .grid { stroke: #5C6570; }
      .soft { fill: #8AB4F8; fill-opacity: 0.12; }
    }
  </style>
  <defs>
    <marker id="eucl-18-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" class="ink" stroke="none"/>
    </marker>
  </defs>

  <text id="eucl-18-heading" class="ink" x="280" y="28" text-anchor="middle" font-size="16" font-weight="600">3-4-5 triangle: Euclidean d = 5</text>

  <!-- origin (100,340); unit=52 -->
  <!-- light grid -->
  <g stroke-width="1">
    <line class="grid" x1="100" y1="340" x2="308" y2="340"/>
    <line class="grid" x1="100" y1="288" x2="308" y2="288"/>
    <line class="grid" x1="100" y1="236" x2="308" y2="236"/>
    <line class="grid" x1="100" y1="184" x2="308" y2="184"/>
    <line class="grid" x1="100" y1="132" x2="308" y2="132"/>
    <line class="grid" x1="100" y1="132" x2="100" y2="340"/>
    <line class="grid" x1="152" y1="132" x2="152" y2="340"/>
    <line class="grid" x1="204" y1="132" x2="204" y2="340"/>
    <line class="grid" x1="256" y1="132" x2="256" y2="340"/>
    <line class="grid" x1="308" y1="132" x2="308" y2="340"/>
  </g>

  <line class="axis" x1="100" y1="340" x2="360" y2="340" stroke-width="1.75" marker-end="url(#eucl-18-arrow)"/>
  <line class="axis" x1="100" y1="340" x2="100" y2="80" stroke-width="1.75" marker-end="url(#eucl-18-arrow)"/>
  <text class="muted" x="368" y="344" font-size="12" stroke="none">x</text>
  <text class="muted" x="92" y="74" text-anchor="middle" font-size="12" stroke="none">y</text>

  <!-- triangle fill -->
  <polygon class="soft" points="100,340 256,340 256,132"/>

  <!-- legs -->
  <line class="ink" x1="100" y1="340" x2="256" y2="340" stroke-width="2"/>
  <line class="ink" x1="256" y1="340" x2="256" y2="132" stroke-width="2"/>
  <!-- hypotenuse -->
  <line class="accent" x1="100" y1="340" x2="256" y2="132" stroke-width="3"/>

  <!-- right-angle mark -->
  <polyline class="ink" points="240,340 240,324 256,324" fill="none" stroke-width="1.5"/>

  <!-- points -->
  <circle class="ink" cx="100" cy="340" r="5" data-allow-overlap="1"/>
  <circle class="ink" cx="256" cy="340" r="5" data-allow-overlap="1"/>
  <circle class="accent" cx="256" cy="132" r="5" data-allow-overlap="1"/>

  <text class="ink" x="100" y="364" text-anchor="middle" font-size="12" stroke="none">(0, 0)</text>
  <text class="ink" x="256" y="364" text-anchor="middle" font-size="12" stroke="none">(3, 0)</text>
  <text class="accent" x="256" y="116" text-anchor="middle" font-size="12" stroke="none">(3, 4)</text>

  <!-- side labels -->
  <text class="ink" x="178" y="358" text-anchor="middle" font-size="13" stroke="none">3</text>
  <text class="ink" x="274" y="244" font-size="13" stroke="none">4</text>
  <text class="accent" x="150" y="220" font-size="14" font-weight="600" stroke="none">d = 5</text>

  <!-- formula panel -->
  <text class="muted" x="360" y="160" font-size="13" stroke="none">Pythagoras:</text>
  <text class="ink" x="360" y="186" font-size="14" stroke="none">d = sqrt(3^2 + 4^2)</text>
  <text class="ink" x="360" y="210" font-size="14" stroke="none">= sqrt(9 + 16)</text>
  <text class="accent" x="360" y="234" font-size="14" font-weight="600" stroke="none">= sqrt(25) = 5</text>
  <text class="hi" x="360" y="270" font-size="13" stroke="none">L2 / Euclidean</text>
  <text class="muted" x="280" y="388" text-anchor="middle" font-size="12" stroke="none">Classic 3-4-5 right triangle from origin to (3, 4)</text>
</svg>
