<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="eig-40-title">
  <title id="eig-40-title">Eigenvalues of [[4,2],[1,3]]: lambda=5 and lambda=2</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .axis { fill: none; stroke: #1A1A1A; }
    .cell { fill: #FFFFFF; stroke: #1A1A1A; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .axis { stroke: #E8EAED; }
      .cell { fill: #1E1E1E; stroke: #E8EAED; }
    }
  </style>
  <text id="eig-40-heading" class="ink" x="320" y="28" text-anchor="middle" font-size="15" font-weight="600">A v = &#x03BB; v &#x2014; &#x03BB; = 5 and &#x03BB; = 2</text>

  <!-- Matrix A -->
  <text class="muted" x="110" y="64" text-anchor="middle" font-size="12">A</text>
  <rect class="cell" x="54" y="76" width="56" height="44" stroke-width="1.5"/>
  <rect class="cell" x="110" y="76" width="56" height="44" stroke-width="1.5"/>
  <rect class="cell" x="54" y="120" width="56" height="44" stroke-width="1.5"/>
  <rect class="cell" x="110" y="120" width="56" height="44" stroke-width="1.5"/>
  <text class="ink" x="82" y="104" text-anchor="middle" font-size="16" font-weight="600">4</text>
  <text class="ink" x="138" y="104" text-anchor="middle" font-size="16" font-weight="600">2</text>
  <text class="ink" x="82" y="148" text-anchor="middle" font-size="16" font-weight="600">1</text>
  <text class="ink" x="138" y="148" text-anchor="middle" font-size="16" font-weight="600">3</text>

  <text class="muted" x="110" y="190" text-anchor="middle" font-size="12">tr(A) = 7</text>
  <text class="muted" x="110" y="210" text-anchor="middle" font-size="12">det(A) = 10</text>
  <text id="eig-40-char" class="ink" x="110" y="236" text-anchor="middle" font-size="13">&#x03BB;&#x00B2; - 7&#x03BB; + 10 = 0</text>
  <text class="accent" x="110" y="260" text-anchor="middle" font-size="13" stroke="none">(&#x03BB; - 5)(&#x03BB; - 2) = 0</text>

  <!-- Plane with eigenvectors -->
  <!-- origin at (420, 220); unit ~40px -->
  <line class="axis" x1="280" y1="220" x2="560" y2="220" stroke-width="1.5"/>
  <line class="axis" x1="420" y1="90" x2="420" y2="310" stroke-width="1.5"/>
  <text class="muted" x="568" y="224" font-size="11">x</text>
  <text class="muted" x="426" y="86" font-size="11">y</text>

  <!-- For A=[[4,2],[1,3]]:
       lambda=5: (A-5I)v=0 => [[-1,2],[1,-2]] => v ~ [2,1]
       lambda=2: (A-2I)v=0 => [[2,2],[1,1]] => v ~ [1,-1]
  -->
  <!-- v1 direction [2,1] scaled: tip at 420+80, 220-40 = (500,180) -->
  <line class="accent" x1="420" y1="220" x2="500" y2="180" stroke-width="2.5" fill="none"/>
  <polygon class="accent" points="500,180 488,176 492,188" stroke="none"/>
  <text id="eig-40-l5" class="accent" x="520" y="172" text-anchor="start" font-size="13" font-weight="600" stroke="none">&#x03BB;=5, v~[2,1]</text>
  <!-- longer ray showing stretch -->
  <line class="accent" x1="420" y1="220" x2="560" y2="150" stroke-width="1.5" fill="none" stroke-dasharray="5 4" opacity="0.7"/>
  <text class="accent" x="556" y="142" text-anchor="middle" font-size="11" stroke="none" opacity="0.9">5v</text>

  <!-- v2 direction [1,-1]: tip at 420+56, 220+56 = (476,276) -->
  <line class="hi" x1="420" y1="220" x2="476" y2="276" stroke-width="2.5" fill="none"/>
  <polygon class="hi" points="476,276 464,272 470,266" stroke="none"/>
  <text id="eig-40-l2" class="hi" x="490" y="290" text-anchor="start" font-size="13" font-weight="600" stroke="none">&#x03BB;=2, v~[1,-1]</text>

  <text class="muted" x="420" y="340" text-anchor="middle" font-size="12">Eigenvectors only stretch; other vectors rotate + scale</text>
</svg>
