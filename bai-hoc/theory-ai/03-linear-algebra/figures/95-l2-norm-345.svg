<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="l2n-95-title">
  <title id="l2n-95-title">L2 norm of v = (3, 4, 0) is 5</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .axis { fill: none; stroke: #1A1A1A; }
    .guide { fill: none; stroke: #5C6570; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .axis { stroke: #E8EAED; }
      .guide { stroke: #9AA0A6; }
    }
  </style>
  <defs>
    <marker id="l2n-95-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="l2n-95-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6FED"/>
    </marker>
  </defs>
  <text id="l2n-95-heading" class="ink" x="280" y="32" text-anchor="middle" font-size="16" font-weight="600">3-4-5 right triangle in XY</text>
  <!-- origin at (120, 300); scale 40 px/unit; tip at (3,4) -> (240, 140) -->
  <line class="axis" x1="80" y1="300" x2="420" y2="300" stroke-width="1.5" marker-end="url(#l2n-95-arrow-ink)"/>
  <line class="axis" x1="120" y1="330" x2="120" y2="80" stroke-width="1.5" marker-end="url(#l2n-95-arrow-ink)"/>
  <text class="muted" x="430" y="304" font-size="13" stroke="none">x</text>
  <text class="muted" x="112" y="72" text-anchor="middle" font-size="13" stroke="none">y</text>
  <text class="muted" x="108" y="318" text-anchor="end" font-size="12" stroke="none">O</text>
  <!-- legs -->
  <line class="guide" x1="120" y1="300" x2="240" y2="300" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line class="guide" x1="240" y1="300" x2="240" y2="140" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="muted" x="180" y="322" text-anchor="middle" font-size="13" stroke="none">3</text>
  <text class="muted" x="258" y="224" text-anchor="start" font-size="13" stroke="none">4</text>
  <!-- hypotenuse = vector -->
  <line class="accent" x1="120" y1="300" x2="232" y2="148" stroke-width="2.5" fill="none" marker-end="url(#l2n-95-arrow-accent)"/>
  <circle class="accent" cx="240" cy="140" r="4" data-allow-overlap="1"/>
  <text class="accent" x="268" y="136" text-anchor="start" font-size="13" stroke="none">v = (3, 4, 0)</text>
  <text class="hi" x="168" y="210" text-anchor="middle" font-size="14" font-weight="600" stroke="none">||v|| = 5</text>
  <text class="muted" x="280" y="348" text-anchor="middle" font-size="12" stroke="none">XY plane; z = 0</text>
</svg>
