<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-labelledby="cos-26-title">
  <title id="cos-26-title">Cosine similarity of vectors A and B</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .axis { fill: none; stroke: #1A1A1A; }
    .arc { fill: none; stroke: #5C6570; }
    .wedge { fill: #C45C0A; fill-opacity: 0.12; stroke: none; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .axis { stroke: #E8EAED; }
      .arc { stroke: #9AA0A6; }
      .wedge { fill: #F9AB00; fill-opacity: 0.18; }
    }
  </style>
  <defs>
    <marker id="cos-26-arrow-ink" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" class="ink" stroke="none"/>
    </marker>
    <marker id="cos-26-arrow-accent" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" class="accent" stroke="none"/>
    </marker>
    <marker id="cos-26-arrow-hi" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" class="hi" stroke="none"/>
    </marker>
  </defs>

  <text id="cos-26-heading" class="ink" x="280" y="28" text-anchor="middle" font-size="16" font-weight="600">A=[3,4], B=[4,3]: cos(theta) = 0.96</text>

  <!-- origin (120,340); scale 48 px/unit -->
  <line class="axis" x1="120" y1="340" x2="380" y2="340" stroke-width="1.75" marker-end="url(#cos-26-arrow-ink)"/>
  <line class="axis" x1="120" y1="340" x2="120" y2="80" stroke-width="1.75" marker-end="url(#cos-26-arrow-ink)"/>
  <text class="muted" x="388" y="344" font-size="12" stroke="none">x</text>
  <text class="muted" x="112" y="74" text-anchor="middle" font-size="12" stroke="none">y</text>

  <!-- angle wedge near origin: A angle ~53.13 deg, B ~36.87 deg from x-axis -->
  <!-- unit circle arc in pixel: radius 56 -->
  <!-- B tip dir: (4,3) -> angle atan(3/4)=36.87; A tip (3,4) atan(4/3)=53.13 -->
  <!-- arc from B to A: start (120+56*cos36.87, 340-56*sin36.87) = (164.8, 306.4) -->
  <!-- end (120+56*cos53.13, 340-56*sin53.13) = (153.6, 295.2) -->
  <path class="wedge" d="M120,340 L164.8,306.4 A56,56 0 0,0 153.6,295.2 Z"/>
  <path class="arc" d="M164.8,306.4 A56,56 0 0,0 153.6,295.2" stroke-width="1.5"/>
  <text class="hi" x="178" y="300" font-size="13" stroke="none">theta</text>

  <!-- Vector B = [4,3]: tip (120+4*48, 340-3*48) = (312, 196) -->
  <line class="hi" x1="120" y1="340" x2="312" y2="196" stroke-width="2.75" marker-end="url(#cos-26-arrow-hi)"/>
  <text class="hi" x="326" y="190" font-size="13" font-weight="600" stroke="none">B = [4, 3]</text>

  <!-- Vector A = [3,4]: tip (120+3*48, 340-4*48) = (264, 148) -->
  <line class="accent" x1="120" y1="340" x2="264" y2="148" stroke-width="2.75" marker-end="url(#cos-26-arrow-accent)"/>
  <text class="accent" x="278" y="142" font-size="13" font-weight="600" stroke="none">A = [3, 4]</text>

  <circle class="ink" cx="120" cy="340" r="4" data-allow-overlap="1"/>
  <text class="muted" x="120" y="362" text-anchor="middle" font-size="12" stroke="none">(0, 0)</text>

  <!-- norms markers (light dashed to tips) -->
  <text class="muted" x="180" y="220" font-size="12" stroke="none">||A||=5</text>
  <text class="muted" x="240" y="280" font-size="12" stroke="none">||B||=5</text>

  <!-- computation panel -->
  <text class="muted" x="80" y="392" font-size="13" stroke="none">A&#x00B7;B = 24</text>
  <text class="ink" x="200" y="392" font-size="13" stroke="none">cos(theta) = 24 / (5&#x00D7;5) = 0.96</text>
  <text class="accent" x="430" y="392" font-size="13" font-weight="600" stroke="none">nearly aligned</text>
</svg>
