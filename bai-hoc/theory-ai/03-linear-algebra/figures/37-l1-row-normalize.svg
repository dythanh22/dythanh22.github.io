<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="norm-37-title">
  <title id="norm-37-title">L1 row normalization to unit-sum rows</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .cell { fill: #FFFFFF; stroke: #1A1A1A; }
    .sum { fill: #E8F0FE; stroke: #2F6FED; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .cell { fill: #1E1E1E; stroke: #E8EAED; }
      .sum { fill: #1A2A44; stroke: #8AB4F8; }
    }
  </style>
  <text id="norm-37-heading" class="ink" x="320" y="28" text-anchor="middle" font-size="15" font-weight="600">L1 row-norm: each row sums to 1</text>

  <!-- Original matrix -->
  <text class="muted" x="150" y="58" text-anchor="middle" font-size="12">original X</text>
  <!-- row0 -->
  <rect class="cell" x="60" y="70" width="52" height="40" stroke-width="1.2"/>
  <rect class="cell" x="112" y="70" width="52" height="40" stroke-width="1.2"/>
  <rect class="cell" x="164" y="70" width="52" height="40" stroke-width="1.2"/>
  <text class="ink" x="86" y="96" text-anchor="middle" font-size="14">1</text>
  <text class="ink" x="138" y="96" text-anchor="middle" font-size="14">2</text>
  <text class="ink" x="190" y="96" text-anchor="middle" font-size="14">3</text>
  <!-- row1 -->
  <rect class="cell" x="60" y="110" width="52" height="40" stroke-width="1.2"/>
  <rect class="cell" x="112" y="110" width="52" height="40" stroke-width="1.2"/>
  <rect class="cell" x="164" y="110" width="52" height="40" stroke-width="1.2"/>
  <text class="ink" x="86" y="136" text-anchor="middle" font-size="14">4</text>
  <text class="ink" x="138" y="136" text-anchor="middle" font-size="14">0</text>
  <text class="ink" x="190" y="136" text-anchor="middle" font-size="14">2</text>
  <!-- row2 -->
  <rect class="cell" x="60" y="150" width="52" height="40" stroke-width="1.2"/>
  <rect class="cell" x="112" y="150" width="52" height="40" stroke-width="1.2"/>
  <rect class="cell" x="164" y="150" width="52" height="40" stroke-width="1.2"/>
  <text class="ink" x="86" y="176" text-anchor="middle" font-size="14">3</text>
  <text class="ink" x="138" y="176" text-anchor="middle" font-size="14">3</text>
  <text class="ink" x="190" y="176" text-anchor="middle" font-size="14">3</text>

  <!-- Row sums -->
  <text class="muted" x="250" y="58" text-anchor="middle" font-size="12">row sum</text>
  <rect class="sum" x="228" y="70" width="44" height="40" stroke-width="1.5"/>
  <rect class="sum" x="228" y="110" width="44" height="40" stroke-width="1.5"/>
  <rect class="sum" x="228" y="150" width="44" height="40" stroke-width="1.5"/>
  <text class="accent" x="250" y="96" text-anchor="middle" font-size="14" font-weight="600" stroke="none">6</text>
  <text class="accent" x="250" y="136" text-anchor="middle" font-size="14" font-weight="600" stroke="none">6</text>
  <text class="accent" x="250" y="176" text-anchor="middle" font-size="14" font-weight="600" stroke="none">9</text>

  <!-- Arrow -->
  <line class="accent" x1="290" y1="130" x2="340" y2="130" stroke-width="2" fill="none"/>
  <polygon class="accent" points="340,124 354,130 340,136" stroke="none"/>
  <text class="muted" x="322" y="114" text-anchor="middle" font-size="11">/ sum</text>

  <!-- Normalized -->
  <text class="muted" x="480" y="58" text-anchor="middle" font-size="12">L1-normalized</text>
  <rect class="cell" x="370" y="70" width="70" height="40" stroke-width="1.2"/>
  <rect class="cell" x="440" y="70" width="70" height="40" stroke-width="1.2"/>
  <rect class="cell" x="510" y="70" width="70" height="40" stroke-width="1.2"/>
  <text id="norm-37-r0" class="hi" x="405" y="96" text-anchor="middle" font-size="13" font-weight="600" stroke="none">0.167</text>
  <text class="hi" x="475" y="96" text-anchor="middle" font-size="13" font-weight="600" stroke="none">0.333</text>
  <text class="hi" x="545" y="96" text-anchor="middle" font-size="13" font-weight="600" stroke="none">0.500</text>

  <rect class="cell" x="370" y="110" width="70" height="40" stroke-width="1.2"/>
  <rect class="cell" x="440" y="110" width="70" height="40" stroke-width="1.2"/>
  <rect class="cell" x="510" y="110" width="70" height="40" stroke-width="1.2"/>
  <text class="hi" x="405" y="136" text-anchor="middle" font-size="13" font-weight="600" stroke="none">0.667</text>
  <text class="hi" x="475" y="136" text-anchor="middle" font-size="13" font-weight="600" stroke="none">0.000</text>
  <text class="hi" x="545" y="136" text-anchor="middle" font-size="13" font-weight="600" stroke="none">0.333</text>

  <rect class="cell" x="370" y="150" width="70" height="40" stroke-width="1.2"/>
  <rect class="cell" x="440" y="150" width="70" height="40" stroke-width="1.2"/>
  <rect class="cell" x="510" y="150" width="70" height="40" stroke-width="1.2"/>
  <text class="hi" x="405" y="176" text-anchor="middle" font-size="13" font-weight="600" stroke="none">0.333</text>
  <text class="hi" x="475" y="176" text-anchor="middle" font-size="13" font-weight="600" stroke="none">0.333</text>
  <text class="hi" x="545" y="176" text-anchor="middle" font-size="13" font-weight="600" stroke="none">0.333</text>

  <!-- Check sums = 1 -->
  <text class="muted" x="480" y="220" text-anchor="middle" font-size="12">row sums after: 1.0, 1.0, 1.0</text>

  <!-- Formula -->
  <text class="ink" x="320" y="270" text-anchor="middle" font-size="14">x'_ij = x_ij / &#x03A3;_k x_ik</text>
  <text class="muted" x="320" y="300" text-anchor="middle" font-size="12">Also: L2 row-norm maps [3, 4] / 5 &#x2192; [0.6, 0.8]</text>
  <text class="muted" x="320" y="324" text-anchor="middle" font-size="12">Use for probabilities, Markov transitions, softmax outputs</text>
</svg>
