<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="hom-11-title">
  <title id="hom-11-title">Homogeneous translation (0,0,0) to (1,2,3)</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .box { fill: none; stroke: #1A1A1A; }
    .fillbox { fill: #FFFFFF; stroke: #1A1A1A; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .box { stroke: #E8EAED; }
      .fillbox { fill: #1E1E1E; stroke: #E8EAED; }
    }
  </style>
  <text id="hom-11-heading" class="ink" x="320" y="28" text-anchor="middle" font-size="15" font-weight="600">Pure translation: (0,0,0) &#x2192; (1,2,3)</text>

  <!-- Origin point -->
  <rect class="fillbox" x="40" y="70" width="120" height="100" rx="4" stroke-width="1.5"/>
  <text class="muted" x="100" y="92" text-anchor="middle" font-size="11">point p</text>
  <text id="hom-11-p" class="ink" x="100" y="122" text-anchor="middle" font-size="14" font-weight="600">(0, 0, 0)</text>
  <text class="muted" x="100" y="150" text-anchor="middle" font-size="11">homogeneous</text>
  <text class="muted" x="100" y="166" text-anchor="middle" font-size="11">[0, 0, 0, 1]</text>

  <!-- Arrow to T -->
  <line class="accent" x1="168" y1="120" x2="200" y2="120" stroke-width="2" fill="none"/>
  <polygon class="accent" points="200,114 214,120 200,126" stroke="none"/>

  <!-- Transform matrix T -->
  <rect class="fillbox" x="220" y="55" width="200" height="130" rx="4" stroke-width="1.5"/>
  <text class="muted" x="320" y="76" text-anchor="middle" font-size="11">T (R = I, t = (1,2,3))</text>
  <text id="hom-11-T" class="ink" x="320" y="108" text-anchor="middle" font-size="13">[ 1  0  0  1 ]</text>
  <text class="ink" x="320" y="128" text-anchor="middle" font-size="13">[ 0  1  0  2 ]</text>
  <text class="ink" x="320" y="148" text-anchor="middle" font-size="13">[ 0  0  1  3 ]</text>
  <text class="ink" x="320" y="168" text-anchor="middle" font-size="13">[ 0  0  0  1 ]</text>

  <!-- Arrow to result -->
  <line class="accent" x1="428" y1="120" x2="460" y2="120" stroke-width="2" fill="none"/>
  <polygon class="accent" points="460,114 474,120 460,126" stroke="none"/>

  <!-- Result -->
  <rect class="fillbox" x="482" y="70" width="120" height="100" rx="4" stroke-width="1.5"/>
  <text class="muted" x="542" y="92" text-anchor="middle" font-size="11">p'</text>
  <text id="hom-11-out" class="hi" x="542" y="122" text-anchor="middle" font-size="14" font-weight="600" stroke="none">(1, 2, 3)</text>
  <text class="muted" x="542" y="150" text-anchor="middle" font-size="11">homogeneous</text>
  <text class="muted" x="542" y="166" text-anchor="middle" font-size="11">[1, 2, 3, 1]</text>

  <!-- 3D schematic axes -->
  <line class="box" x1="120" y1="300" x2="280" y2="300" stroke-width="1.5"/>
  <line class="box" x1="120" y1="300" x2="120" y2="220" stroke-width="1.5"/>
  <line class="box" x1="120" y1="300" x2="60" y2="340" stroke-width="1.5"/>
  <text class="muted" x="288" y="304" font-size="11">x</text>
  <text class="muted" x="112" y="214" font-size="11">z</text>
  <text class="muted" x="48" y="348" font-size="11">y</text>

  <circle class="accent" cx="120" cy="300" r="5" data-allow-overlap="1"/>
  <text class="accent" x="136" y="292" font-size="11" stroke="none">origin</text>

  <!-- translated tip approx: +x, +y(diag), +z -->
  <line class="hi" x1="120" y1="300" x2="200" y2="240" stroke-width="2" fill="none" stroke-dasharray="4 3"/>
  <circle class="hi" cx="200" cy="240" r="6" data-allow-overlap="1"/>
  <text class="hi" x="214" y="236" font-size="12" stroke="none">(1, 2, 3)</text>

  <text class="muted" x="420" y="280" text-anchor="middle" font-size="12">p' = T p_h  (drop w = 1)</text>
  <text class="ink" x="420" y="308" text-anchor="middle" font-size="13">Rigid body: rotate block R + translate t in one 4&#x00D7;4 multiply</text>
</svg>
