<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="pe-05-title">
  <title id="pe-05-title">PE(pos=3, d=4) = [0.141, -0.990, 0.030, 1.000]</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .cell { fill: #FFFFFF; stroke: #1A1A1A; }
    .sin { fill: #E8F0FE; stroke: #2F6FED; }
    .cos { fill: #FCE8D5; stroke: #C45C0A; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    
  </style>

  <text id="pe-05-heading" class="ink" x="360" y="28" text-anchor="middle" font-size="15" font-weight="600">PE(pos = 3, d = 4)</text>

  <text class="muted" x="128" y="64" text-anchor="middle" font-size="11">dim 0 even</text>
  <text class="muted" x="272" y="64" text-anchor="middle" font-size="11">dim 1 odd</text>
  <text class="muted" x="448" y="64" text-anchor="middle" font-size="11">dim 2 even</text>
  <text class="muted" x="592" y="64" text-anchor="middle" font-size="11">dim 3 odd</text>

  <rect class="sin" x="64" y="76" width="128" height="72" rx="4" stroke-width="1.6"/>
  <rect class="cos" x="208" y="76" width="128" height="72" rx="4" stroke-width="1.6"/>
  <rect class="sin" x="384" y="76" width="128" height="72" rx="4" stroke-width="1.6"/>
  <rect class="cos" x="528" y="76" width="128" height="72" rx="4" stroke-width="1.6"/>

  <text id="pe-05-d0" class="accent" x="128" y="108" text-anchor="middle" font-size="18" font-weight="700" stroke="none">0.141</text>
  <text id="pe-05-d1" class="hi" x="272" y="108" text-anchor="middle" font-size="18" font-weight="700" stroke="none">-0.990</text>
  <text id="pe-05-d2" class="accent" x="448" y="108" text-anchor="middle" font-size="18" font-weight="700" stroke="none">0.030</text>
  <text id="pe-05-d3" class="hi" x="592" y="108" text-anchor="middle" font-size="18" font-weight="700" stroke="none">1.000</text>

  <text class="muted" x="128" y="134" text-anchor="middle" font-size="12" stroke="none">sin(3)</text>
  <text class="muted" x="272" y="134" text-anchor="middle" font-size="12" stroke="none">cos(3)</text>
  <text class="muted" x="448" y="134" text-anchor="middle" font-size="12" stroke="none">sin(0.03)</text>
  <text class="muted" x="592" y="134" text-anchor="middle" font-size="12" stroke="none">cos(0.03)</text>

  <text class="accent" x="200" y="188" text-anchor="middle" font-size="13" font-weight="600" stroke="none">i = 0, omega = 1 (high freq)</text>
  <text class="hi" x="520" y="188" text-anchor="middle" font-size="13" font-weight="600" stroke="none">i = 1, omega = 0.01 (low freq)</text>

  <line class="accent" x1="64" y1="200" x2="336" y2="200" stroke-width="1.5" fill="none"/>
  <line class="hi" x1="384" y1="200" x2="656" y2="200" stroke-width="1.5" fill="none"/>

  <text class="ink" x="360" y="236" text-anchor="middle" font-size="14">PE(3) = [0.141, -0.990, 0.030, 1.000]</text>
  <text class="muted" x="360" y="264" text-anchor="middle" font-size="12">even dims: sin(pos * omega_i); odd dims: cos(pos * omega_i)</text>
  <text class="muted" x="360" y="292" text-anchor="middle" font-size="12">high-freq dims 0,1 change a lot by pos 4; low-freq dims 2,3 barely move</text>
  <text class="muted" x="360" y="320" text-anchor="middle" font-size="12">cos(0.03) = 0.9996, rounded to 1.000 in the vector</text>
</svg>
