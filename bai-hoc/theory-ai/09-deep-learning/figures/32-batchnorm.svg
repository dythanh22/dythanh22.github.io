<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="bn-32-title">
  <title id="bn-32-title">BatchNorm x=[2,4,6,8] mu=5 var=5 to y~[-1.68, 0.10, 1.90, 3.68]</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .axis { fill: none; stroke: #1A1A1A; }
    .dash { fill: none; stroke: #C45C0A; }
    .link { fill: none; stroke: #2F6FED; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    
  </style>

  <text id="bn-32-heading" class="ink" x="320" y="24" text-anchor="middle" font-size="15" font-weight="600">BatchNorm forward: &#x03B3; = 2, &#x03B2; = 1</text>

  <text class="muted" x="40" y="88" text-anchor="middle" font-size="12">x</text>
  <line class="axis" x1="64" y1="84" x2="576" y2="84" stroke-width="1.5"/>
  <circle class="accent" cx="80" cy="84" r="6" data-allow-overlap="1"/>
  <circle class="accent" cx="240" cy="84" r="6" data-allow-overlap="1"/>
  <circle class="accent" cx="400" cy="84" r="6" data-allow-overlap="1"/>
  <circle class="accent" cx="560" cy="84" r="6" data-allow-overlap="1"/>
  <text class="ink" x="80" y="68" text-anchor="middle" font-size="13" stroke="none">2</text>
  <text class="ink" x="240" y="68" text-anchor="middle" font-size="13" stroke="none">4</text>
  <text class="ink" x="400" y="68" text-anchor="middle" font-size="13" stroke="none">6</text>
  <text class="ink" x="560" y="68" text-anchor="middle" font-size="13" stroke="none">8</text>
  <line class="dash" x1="320" y1="52" x2="320" y2="116" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="hi" x="332" y="48" text-anchor="start" font-size="12" stroke="none">&#x03BC; = 5</text>
  <text class="muted" x="320" y="136" text-anchor="middle" font-size="12">&#x03C3;&#x00B2; = 5</text>

  <line class="link" x1="80" y1="148" x2="80" y2="178" stroke-width="1.25" stroke-dasharray="4 4"/>
  <line class="link" x1="240" y1="148" x2="240" y2="178" stroke-width="1.25" stroke-dasharray="4 4"/>
  <line class="link" x1="400" y1="148" x2="400" y2="178" stroke-width="1.25" stroke-dasharray="4 4"/>
  <line class="link" x1="560" y1="148" x2="560" y2="178" stroke-width="1.25" stroke-dasharray="4 4"/>

  <text class="muted" x="40" y="200" text-anchor="middle" font-size="12">y</text>
  <line class="axis" x1="64" y1="196" x2="576" y2="196" stroke-width="1.5"/>
  <circle class="hi" cx="80" cy="196" r="6" data-allow-overlap="1"/>
  <circle class="hi" cx="240" cy="196" r="6" data-allow-overlap="1"/>
  <circle class="hi" cx="400" cy="196" r="6" data-allow-overlap="1"/>
  <circle class="hi" cx="560" cy="196" r="6" data-allow-overlap="1"/>
  <text class="hi" x="80" y="228" text-anchor="middle" font-size="13" stroke="none">-1.68</text>
  <text class="hi" x="240" y="228" text-anchor="middle" font-size="13" stroke="none">0.10</text>
  <text class="hi" x="400" y="228" text-anchor="middle" font-size="13" stroke="none">1.90</text>
  <text class="hi" x="560" y="228" text-anchor="middle" font-size="13" stroke="none">3.68</text>
  <line class="dash" x1="320" y1="176" x2="320" y2="248" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text class="muted" x="332" y="172" text-anchor="start" font-size="11">&#x03B2; = 1</text>

  <text class="ink" x="320" y="276" text-anchor="middle" font-size="13">y = 2 xhat + 1    (&#x03B5; = 0)</text>
