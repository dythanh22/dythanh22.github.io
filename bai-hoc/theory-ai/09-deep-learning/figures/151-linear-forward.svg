<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="lin-151-title">
  <title id="lin-151-title">y = Wx + b; x=[1,2,3] to y=[1.5, 3.4]</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .cell { fill: #FFFFFF; stroke: #1A1A1A; }
    .yout { fill: #FFF4E8; stroke: #C45C0A; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .cell { fill: #1E1E1E; stroke: #E8EAED; }
      .yout { fill: #3A2A10; stroke: #F9AB00; }
    }
  </style>

  <text id="lin-151-heading" class="ink" x="360" y="26" text-anchor="middle" font-size="16" font-weight="600">y = Wx + b</text>

  <text class="muted" x="167" y="52" text-anchor="middle" font-size="12">W (2 x 3)</text>
  <rect class="cell" x="80" y="64" width="58" height="40" stroke-width="1.2"/>
  <rect class="cell" x="138" y="64" width="58" height="40" stroke-width="1.2"/>
  <rect class="cell" x="196" y="64" width="58" height="40" stroke-width="1.2"/>
  <rect class="cell" x="80" y="104" width="58" height="40" stroke-width="1.2"/>
  <rect class="cell" x="138" y="104" width="58" height="40" stroke-width="1.2"/>
  <rect class="cell" x="196" y="104" width="58" height="40" stroke-width="1.2"/>
  <text class="ink" x="109" y="90" text-anchor="middle" font-size="14" stroke="none">0.1</text>
  <text class="ink" x="167" y="90" text-anchor="middle" font-size="14" stroke="none">0.2</text>
  <text class="ink" x="225" y="90" text-anchor="middle" font-size="14" stroke="none">0.3</text>
  <text class="ink" x="109" y="130" text-anchor="middle" font-size="14" stroke="none">0.4</text>
  <text class="ink" x="167" y="130" text-anchor="middle" font-size="14" stroke="none">0.5</text>
  <text class="ink" x="225" y="130" text-anchor="middle" font-size="14" stroke="none">0.6</text>

  <text class="ink" x="278" y="110" text-anchor="middle" font-size="18" font-weight="600" stroke="none">&#x00D7;</text>

  <text class="muted" x="332" y="52" text-anchor="middle" font-size="12">x</text>
  <rect class="cell" x="306" y="64" width="52" height="40" stroke-width="1.2"/>
  <rect class="cell" x="306" y="104" width="52" height="40" stroke-width="1.2"/>
  <rect class="cell" x="306" y="144" width="52" height="40" stroke-width="1.2"/>
  <text class="ink" x="332" y="90" text-anchor="middle" font-size="14" stroke="none">1</text>
  <text class="ink" x="332" y="130" text-anchor="middle" font-size="14" stroke="none">2</text>
  <text class="ink" x="332" y="170" text-anchor="middle" font-size="14" stroke="none">3</text>

  <text class="ink" x="382" y="110" text-anchor="middle" font-size="18" font-weight="600" stroke="none">+</text>

  <text class="muted" x="432" y="52" text-anchor="middle" font-size="12">b</text>
  <rect class="cell" x="406" y="64" width="52" height="40" stroke-width="1.2"/>
  <rect class="cell" x="406" y="104" width="52" height="40" stroke-width="1.2"/>
  <text class="ink" x="432" y="90" text-anchor="middle" font-size="14" stroke="none">0.1</text>
  <text class="ink" x="432" y="130" text-anchor="middle" font-size="14" stroke="none">0.2</text>

  <text class="ink" x="482" y="110" text-anchor="middle" font-size="18" font-weight="600" stroke="none">=</text>

  <text class="hi" x="546" y="52" text-anchor="middle" font-size="12" stroke="none">y</text>
  <rect class="yout" x="514" y="64" width="64" height="40" stroke-width="1.5"/>
  <rect class="yout" x="514" y="104" width="64" height="40" stroke-width="1.5"/>
  <text class="hi" x="546" y="90" text-anchor="middle" font-size="15" font-weight="600" stroke="none">1.5</text>
  <text class="hi" x="546" y="130" text-anchor="middle" font-size="15" font-weight="600" stroke="none">3.4</text>

  <text class="ink" x="360" y="230" text-anchor="middle" font-size="13">y1 = 0.1(1) + 0.2(2) + 0.3(3) + 0.1 = 1.5</text>
  <text class="ink" x="360" y="258" text-anchor="middle" font-size="13">y2 = 0.4(1) + 0.5(2) + 0.6(3) + 0.2 = 3.4</text>
  <text class="muted" x="360" y="294" text-anchor="middle" font-size="12">d_in = 3 features to d_out = 2 neurons</text>
</svg>
