<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="gru-19-title">
  <title id="gru-19-title">GRU gates z=[0.7,0.2], r=[0.9,0.1] to h=[0.59,-0.06]</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .card-ac { fill: #2F6FED; fill-opacity: 0.08; stroke: #2F6FED; }
    .card-hi { fill: #C45C0A; fill-opacity: 0.08; stroke: #C45C0A; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    
  </style>

  <text id="gru-19-heading" class="ink" x="360" y="26" text-anchor="middle" font-size="15" font-weight="600">h = (1 - z) * h_prev + z * h_tilde</text>

  <rect class="card-ac" x="24" y="44" width="328" height="220" rx="8" stroke-width="1.5"/>
  <text class="accent" x="188" y="72" text-anchor="middle" font-size="14" font-weight="600" stroke="none">unit 0 (mostly update)</text>
  <text class="ink" x="44" y="104" font-size="13" stroke="none">z = 0.7    r = 0.9</text>
  <text class="muted" x="44" y="132" font-size="13" stroke="none">h_prev = 0.8    h_tilde = 0.5</text>
  <text class="ink" x="44" y="168" font-size="13" stroke="none">(1 - 0.7) x 0.8 + 0.7 x 0.5</text>
  <text class="ink" x="44" y="196" font-size="13" stroke="none">= 0.24 + 0.35</text>
  <text id="gru-19-h0" class="accent" x="44" y="236" font-size="16" font-weight="700" stroke="none">h[0] = 0.59</text>

  <rect class="card-hi" x="368" y="44" width="328" height="220" rx="8" stroke-width="1.5"/>
  <text class="hi" x="532" y="72" text-anchor="middle" font-size="14" font-weight="600" stroke="none">unit 1 (mostly keep)</text>
  <text class="ink" x="388" y="104" font-size="13" stroke="none">z = 0.2    r = 0.1</text>
  <text class="muted" x="388" y="132" font-size="13" stroke="none">h_prev = -0.3    h_tilde = 0.9</text>
  <text class="ink" x="388" y="168" font-size="13" stroke="none">(1 - 0.2) x (-0.3) + 0.2 x 0.9</text>
  <text class="ink" x="388" y="196" font-size="13" stroke="none">= -0.24 + 0.18</text>
  <text id="gru-19-h1" class="hi" x="388" y="236" font-size="16" font-weight="700" stroke="none">h[1] = -0.06</text>

  <text class="ink" x="360" y="292" text-anchor="middle" font-size="14">z = [0.7, 0.2],   r = [0.9, 0.1],   h = [0.59, -0.06]</text>
  <text class="muted" x="360" y="318" text-anchor="middle" font-size="12">z near 1 replaces memory; z near 0 keeps h_prev (gradient highway)</text>
</svg>
