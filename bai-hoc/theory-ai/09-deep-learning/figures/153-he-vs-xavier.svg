<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="he-153-title">
  <title id="he-153-title">He vs Xavier fan-in n_in=512; var 0.00391 vs 0.00195</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .axis { fill: none; stroke: #1A1A1A; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    
  </style>

  <text id="he-153-heading" class="ink" x="320" y="28" text-anchor="middle" font-size="16" font-weight="600">He vs Xavier (fan-in), n_in = 512</text>

  <line class="axis" x1="80" y1="280" x2="560" y2="280" stroke-width="1.5"/>

  <rect class="accent" x="140" y="170" width="120" height="110" rx="4" fill-opacity="0.85"/>
  <text class="ink" x="200" y="158" text-anchor="middle" font-size="14" font-weight="600" stroke="none">0.00195</text>
  <text class="ink" x="200" y="304" text-anchor="middle" font-size="13" stroke="none">Xavier</text>
  <text class="muted" x="200" y="324" text-anchor="middle" font-size="12">1 / 512</text>

  <rect class="hi" x="380" y="60" width="120" height="220" rx="4" fill-opacity="0.90"/>
  <text class="hi" x="512" y="72" text-anchor="start" font-size="14" font-weight="600" stroke="none">0.00391</text>
  <text class="ink" x="440" y="304" text-anchor="middle" font-size="13" stroke="none">He</text>
  <text class="muted" x="440" y="324" text-anchor="middle" font-size="12">2 / 512</text>

  <line class="ink" x1="270" y1="170" x2="370" y2="170" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text class="ink" x="320" y="188" text-anchor="middle" font-size="13" font-weight="600" stroke="none">2&#x00D7;</text>

  <text class="muted" x="320" y="350" text-anchor="middle" font-size="12">He doubles Var(W) to offset ReLU halving variance</text>
</svg>
