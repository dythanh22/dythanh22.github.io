<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="drop-8-title">
  <title id="drop-8-title">Inverted dropout: keep x/(1-p), drop 0, E=x</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .accent-soft { fill: #2F6FED; fill-opacity: 0.08; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .hi-soft { fill: #C45C0A; fill-opacity: 0.08; stroke: #C45C0A; }
    .card { fill: none; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .accent-soft { fill: #8AB4F8; fill-opacity: 0.12; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .hi-soft { fill: #F9AB00; fill-opacity: 0.12; stroke: #F9AB00; }
    }
  </style>
  <defs>
    <marker id="drop-8-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" class="ink" stroke="none"/>
    </marker>
  </defs>

  <text id="drop-8-heading" class="ink" x="360" y="26" text-anchor="middle" font-size="16" font-weight="600">Inverted dropout: E[output] = x</text>

  <rect class="card ink" x="28" y="52" width="120" height="120" rx="8" fill="none" stroke-width="1.25"/>
  <text class="ink" x="88" y="104" text-anchor="middle" font-size="18" font-weight="600" stroke="none">x</text>
  <text class="muted" x="88" y="132" text-anchor="middle" font-size="12">input</text>

  <line class="ink" x1="154" y1="88" x2="214" y2="72" stroke-width="1.5" marker-end="url(#drop-8-arrow)"/>
  <line class="ink" x1="154" y1="136" x2="214" y2="152" stroke-width="1.5" marker-end="url(#drop-8-arrow)"/>
  <text class="muted" x="184" y="68" text-anchor="middle" font-size="11">p</text>
  <text class="muted" x="184" y="172" text-anchor="middle" font-size="11">1 - p</text>

  <rect class="hi-soft card" x="220" y="48" width="168" height="56" rx="8" stroke-width="1.5"/>
  <text class="hi" x="304" y="82" text-anchor="middle" font-size="16" font-weight="600" stroke="none">0</text>

  <rect class="accent-soft card" x="220" y="128" width="168" height="56" rx="8" stroke-width="1.5"/>
  <text class="accent" x="304" y="162" text-anchor="middle" font-size="16" font-weight="600" stroke="none">x / (1 - p)</text>

  <line class="ink" x1="394" y1="76" x2="454" y2="104" stroke-width="1.5" marker-end="url(#drop-8-arrow)"/>
  <line class="ink" x1="394" y1="156" x2="454" y2="128" stroke-width="1.5" marker-end="url(#drop-8-arrow)"/>

  <rect class="accent-soft card" x="460" y="52" width="232" height="120" rx="8" stroke-width="1.5"/>
  <text class="accent" x="576" y="104" text-anchor="middle" font-size="18" font-weight="600" stroke="none">E = x</text>
  <text class="muted" x="576" y="136" text-anchor="middle" font-size="12">p&#x00B7;0 + (1-p)&#x00B7;x/(1-p)</text>

  <text class="ink" x="360" y="230" text-anchor="middle" font-size="14">Example: p = 0.5, scale = 2</text>
  <text class="ink" x="360" y="258" text-anchor="middle" font-size="14">x = [2.0, 4.0],  mask = [0, 2.0]  &#x2192;  output = [0, 8.0]</text>
  <text class="muted" x="360" y="290" text-anchor="middle" font-size="12">Kept unit 4.0 is scaled 4.0 / 0.5 = 8.0; dropped unit is 0</text>
</svg>
