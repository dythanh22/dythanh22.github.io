<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img" aria-labelledby="bern-59-title">
  <title id="bern-59-title">Bernoulli PMF p=0.7</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .axis { fill: none; stroke: #1A1A1A; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .axis { stroke: #E8EAED; }
    }
  </style>
  <text id="bern-59-heading" class="ink" x="260" y="28" text-anchor="middle" font-size="16" font-weight="600">Bernoulli PMF, p = 0.7</text>
  <line class="axis" x1="72" y1="280" x2="460" y2="280" stroke-width="1.25"/>
  <line class="axis" x1="72" y1="48" x2="72" y2="280" stroke-width="1.25"/>
  <text class="muted" x="64" y="284" text-anchor="end" font-size="12">0</text>
  <text class="muted" x="64" y="172" text-anchor="end" font-size="12">0.5</text>
  <text class="muted" x="64" y="64" text-anchor="end" font-size="12">1</text>
  <line class="muted" x1="72" y1="168" x2="460" y2="168" stroke-width="1" stroke-dasharray="4 4" opacity="0.45"/>
  <!-- P(X=0)=0.3: bar height 0.3*216=64.8, y=280-64.8=215.2 -->
  <rect class="accent" x="128" y="215.2" width="72" height="64.8" data-allow-overlap="1"/>
  <text class="muted" x="164" y="206" text-anchor="middle" font-size="12">0.3</text>
  <text class="ink" x="164" y="300" text-anchor="middle" font-size="13">0</text>
  <!-- P(X=1)=0.7: height 151.2, y=128.8 -->
  <rect class="hi" x="300" y="128.8" width="72" height="151.2" data-allow-overlap="1"/>
  <text class="muted" x="336" y="120" text-anchor="middle" font-size="12">0.7</text>
  <text class="ink" x="336" y="300" text-anchor="middle" font-size="13">1</text>
  <text class="ink" x="260" y="328" text-anchor="middle" font-size="13">x</text>
  <text class="ink" x="22" y="164" text-anchor="middle" font-size="13" transform="rotate(-90 22 164)">P(X = x)</text>
  <text class="muted" x="164" y="318" text-anchor="middle" font-size="11">P(X=0)=1-p</text>
  <text class="muted" x="336" y="318" text-anchor="middle" font-size="11">P(X=1)=p</text>
</svg>
