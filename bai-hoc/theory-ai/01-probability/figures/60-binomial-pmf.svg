<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" role="img" aria-labelledby="bin-60-title">
  <title id="bin-60-title">Binomial PMF n=4 p=0.3</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
