<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="boot-83-title">
  <title id="boot-83-title">Bootstrap percentile CI</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: none; stroke: #C45C0A; }
    .hi-fill { fill: #C45C0A; stroke: #C45C0A; }
    .axis { fill: none; stroke: #1A1A1A; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    
  </style>
  <text id="boot-83-heading" class="ink" x="320" y="28" text-anchor="middle" font-size="16" font-weight="600">Sample [4, 7, 3, 8, 5], mean = 5.4</text>
  <!-- x(v)=72+(v-3)*88 ; 3..8 -->
  <line class="axis" x1="72" y1="168" x2="556" y2="168" stroke-width="1.5"/>
  <!-- ticks 3..8 -->
  <line class="ink" x1="72" y1="162" x2="72" y2="174" stroke-width="1.25"/>
  <line class="ink" x1="160" y1="162" x2="160" y2="174" stroke-width="1.25"/>
  <line class="ink" x1="248" y1="162" x2="248" y2="174" stroke-width="1.25"/>
  <line class="ink" x1="336" y1="162" x2="336" y2="174" stroke-width="1.25"/>
  <line class="ink" x1="424" y1="162" x2="424" y2="174" stroke-width="1.25"/>
  <line class="ink" x1="512" y1="162" x2="512" y2="174" stroke-width="1.25"/>
  <text class="muted" x="72" y="194" text-anchor="middle" font-size="12">3</text>
  <text class="muted" x="160" y="194" text-anchor="middle" font-size="12">4</text>
  <text class="muted" x="248" y="194" text-anchor="middle" font-size="12">5</text>
  <text class="muted" x="336" y="194" text-anchor="middle" font-size="12">6</text>
  <text class="muted" x="424" y="194" text-anchor="middle" font-size="12">7</text>
  <text class="muted" x="512" y="194" text-anchor="middle" font-size="12">8</text>
  <!-- sample points: 3,4,5,7,8 -->
  <circle class="accent" cx="72" cy="168" r="6" data-allow-overlap="1"/>
  <circle class="accent" cx="160" cy="168" r="6" data-allow-overlap="1"/>
  <circle class="accent" cx="248" cy="168" r="6" data-allow-overlap="1"/>
  <circle class="accent" cx="424" cy="168" r="6" data-allow-overlap="1"/>
  <circle class="accent" cx="512" cy="168" r="6" data-allow-overlap="1"/>
  <!-- mean 5.4: x=72+2.4*88=283.2 -->
  <line class="accent" x1="283.2" y1="72" x2="283.2" y2="168" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <circle class="hi-fill" cx="283.2" cy="168" r="5" data-allow-overlap="1"/>
  <text class="ink" x="283.2" y="64" text-anchor="middle" font-size="12">x&#x0304; = 5.4</text>
  <!-- CI [4.85, 6.12]: x=72+1.85*88=234.8 ; 72+3.12*88=346.6 -->
  <line class="hi" x1="234.8" y1="112" x2="346.6" y2="112" stroke-width="2.5"/>
  <line class="hi" x1="234.8" y1="104" x2="234.8" y2="120" stroke-width="2.5"/>
  <line class="hi" x1="346.6" y1="104" x2="346.6" y2="120" stroke-width="2.5"/>
  <text class="hi-fill" x="234.8" y="96" text-anchor="middle" font-size="11" stroke="none">4.85</text>
  <text class="hi-fill" x="346.6" y="96" text-anchor="middle" font-size="11" stroke="none">6.12</text>
  <text class="muted" x="290" y="132" text-anchor="middle" font-size="11">CI 95%</text>
  <text class="ink" x="320" y="230" text-anchor="middle" font-size="13">value</text>
  <text class="muted" x="320" y="258" text-anchor="middle" font-size="12">5 sample points (blue) and percentile CI (amber)</text>
</svg>
