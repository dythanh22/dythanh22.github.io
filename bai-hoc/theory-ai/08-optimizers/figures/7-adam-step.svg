<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="adam-7-title">
  <title id="adam-7-title">Adam step t=1: bias-correct mhat=0.5, vhat=0.25, w to 0.999</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .accent-soft { fill: #2F6FED; fill-opacity: 0.08; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .hi-soft { fill: #C45C0A; fill-opacity: 0.08; stroke: #C45C0A; }
    .card { fill: none; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .accent-soft { fill: #8AB4F8; fill-opacity: 0.12; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .hi-soft { fill: #F9AB00; fill-opacity: 0.12; stroke: #F9AB00; }
    }
  </style>
  <defs>
    <marker id="adam-7-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" class="ink" stroke="none"/>
    </marker>
  </defs>

  <text id="adam-7-heading" class="ink" x="360" y="28" text-anchor="middle" font-size="16" font-weight="600">Adam step t = 1, &#x03B7; = 0.001</text>

  <rect class="card ink" x="24" y="52" width="188" height="232" rx="8" fill="none" stroke-width="1.25"/>
  <text class="ink" x="118" y="80" text-anchor="middle" font-size="14" font-weight="600" stroke="none">Input</text>
  <text class="ink" x="44" y="116" font-size="13" stroke="none">w = 1.0</text>
  <text class="ink" x="44" y="144" font-size="13" stroke="none">g = 0.5</text>
  <text class="ink" x="44" y="172" font-size="13" stroke="none">t = 1</text>
  <text class="muted" x="44" y="208" font-size="13" stroke="none">m0 = 0, v0 = 0</text>
  <text class="muted" x="44" y="236" font-size="13" stroke="none">&#x03B2;1 = 0.9</text>
  <text class="muted" x="44" y="260" font-size="13" stroke="none">&#x03B2;2 = 0.999</text>

  <line class="ink" x1="218" y1="168" x2="250" y2="168" stroke-width="1.5" marker-end="url(#adam-7-arrow)"/>

  <rect class="accent-soft card" x="256" y="52" width="220" height="232" rx="8" stroke-width="1.5"/>
  <text class="accent" x="366" y="80" text-anchor="middle" font-size="14" font-weight="600" stroke="none">Bias correction</text>
  <text class="ink" x="276" y="116" font-size="13" stroke="none">m = 0.05</text>
  <text class="accent" x="276" y="144" font-size="14" font-weight="600" stroke="none">mhat = 0.5</text>
  <text class="ink" x="276" y="180" font-size="13" stroke="none">v = 0.00025</text>
  <text class="accent" x="276" y="208" font-size="14" font-weight="600" stroke="none">vhat = 0.25</text>
  <text class="muted" x="276" y="248" font-size="12" stroke="none">0.05/0.1 and 0.00025/0.001</text>

  <line class="ink" x1="482" y1="168" x2="514" y2="168" stroke-width="1.5" marker-end="url(#adam-7-arrow)"/>

  <rect class="hi-soft card" x="520" y="52" width="176" height="232" rx="8" stroke-width="1.5"/>
  <text class="hi" x="608" y="80" text-anchor="middle" font-size="14" font-weight="600" stroke="none">Update</text>
  <text class="ink" x="540" y="124" font-size="13" stroke="none">0.5 / sqrt(0.25)</text>
  <text class="ink" x="540" y="152" font-size="13" stroke="none">= 0.5 / 0.5 = 1</text>
  <text class="muted" x="540" y="188" font-size="13" stroke="none">&#x03B7; x 1 = 0.001</text>
  <text class="hi" x="540" y="232" font-size="15" font-weight="600" stroke="none">w &#x2192; 0.999</text>

  <text class="muted" x="360" y="318" text-anchor="middle" font-size="12" stroke="none">Without correction, m=0.05 and v=0.00025 give the wrong step</text>
</svg>
