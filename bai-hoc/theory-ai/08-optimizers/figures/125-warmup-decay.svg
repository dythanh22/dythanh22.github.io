<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="wu-125-title">
  <title id="wu-125-title">Warmup+linear decay: W=1000, T=10000, eta0=0.001</title>
  <style>
    .ink { fill: #1A1A1A; }
    .muted { fill: #5C6570; }
    .accent { fill: none; stroke: #2F6FED; }
    .accent-fill { fill: #2F6FED; }
    .hi { fill: none; stroke: #C45C0A; }
    .hi-fill { fill: #C45C0A; }
    .axis { fill: none; stroke: #1A1A1A; }
    .guide { fill: none; stroke: #5C6570; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; stroke: none; }
    
  </style>
  <text id="wu-125-heading" class="ink" x="360" y="26" text-anchor="middle" font-size="16" font-weight="600">Warmup + linear decay, W = 1000, T = 10000, &#x03B7;0 = 0.001</text>
  <!-- t=0..10000 -> x=80..660 (0.058 px/step); eta=0..0.001 -> y=310..50 -->
  <line class="axis" x1="80" y1="310" x2="672" y2="310" stroke-width="1.25"/>
  <line class="axis" x1="80" y1="50" x2="80" y2="310" stroke-width="1.25"/>
  <line class="guide" x1="138" y1="50" x2="138" y2="310" stroke-width="1" stroke-dasharray="4 4" opacity="0.7"/>
  <path class="accent" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" d="M 80,310 L 138,50 L 660,310"/>
  <circle class="accent-fill" cx="80" cy="310" r="4" data-allow-overlap="1"/>
  <circle class="accent-fill" cx="94.5" cy="245" r="3.5" data-allow-overlap="1"/>
  <circle class="accent-fill" cx="109" cy="180" r="4" data-allow-overlap="1"/>
  <circle class="hi-fill" cx="138" cy="50" r="5" data-allow-overlap="1"/>
  <circle class="accent-fill" cx="268.5" cy="115" r="4" data-allow-overlap="1"/>
  <circle class="accent-fill" cx="399" cy="180" r="4" data-allow-overlap="1"/>
  <circle class="accent-fill" cx="529.5" cy="245" r="4" data-allow-overlap="1"/>
  <circle class="accent-fill" cx="660" cy="310" r="4" data-allow-overlap="1"/>
  <text class="muted" x="80" y="328" text-anchor="middle" font-size="12">0</text>
  <text class="hi-fill" x="138" y="328" text-anchor="middle" font-size="12">1000</text>
  <text class="muted" x="268.5" y="348" text-anchor="middle" font-size="11">3250</text>
  <text class="muted" x="399" y="328" text-anchor="middle" font-size="12">5500</text>
  <text class="muted" x="529.5" y="348" text-anchor="middle" font-size="11">7750</text>
  <text class="muted" x="660" y="328" text-anchor="middle" font-size="12">10000</text>
  <text class="ink" x="370" y="372" text-anchor="middle" font-size="13">t (step)</text>
  <text class="muted" x="70" y="314" text-anchor="end" font-size="12">0</text>
  <text class="muted" x="70" y="184" text-anchor="end" font-size="12">0.0005</text>
  <text class="muted" x="70" y="54" text-anchor="end" font-size="12">0.001</text>
  <text class="ink" x="22" y="180" text-anchor="middle" font-size="13" transform="rotate(-90 22 180)">&#x03B7;</text>
  <text class="hi-fill" x="154" y="46" text-anchor="start" font-size="12">t = 1000, &#x03B7; = 0.001</text>
  <text class="muted" x="268.5" y="100" text-anchor="middle" font-size="11">0.00075</text>
  <text class="muted" x="399" y="166" text-anchor="middle" font-size="11">t = 5500, &#x03B7; = 0.0005</text>
  <text class="muted" x="360" y="392" text-anchor="middle" font-size="12">Warmup to t = 1000, then linear decay to t = 10000</text>
</svg>
