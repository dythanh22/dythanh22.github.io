<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="nag-45-title">
  <title id="nag-45-title">NAG look-ahead on f(x)=x^2: momentum to 4.0 vs NAG to 4.018</title>
  <style>
    .ink { fill: #1A1A1A; }
    .muted { fill: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .accent-soft { fill: #2F6FED; fill-opacity: 0.08; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .hi-soft { fill: #C45C0A; fill-opacity: 0.08; stroke: #C45C0A; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; stroke: none; }
    
  </style>
  <text id="nag-45-heading" class="ink" x="360" y="28" text-anchor="middle" font-size="16" font-weight="600">f(x) = x^2, w = 5, v = 1, mu = 0.9, eta = 0.01</text>
  <rect class="accent-soft" x="36" y="48" width="300" height="204" rx="8" stroke-width="1.5"/>
  <text class="accent" x="186" y="76" text-anchor="middle" font-size="14" font-weight="600">Standard momentum</text>
  <text class="ink" x="56" y="112" font-size="13">g(5.0) = 10.0</text>
  <text class="ink" x="56" y="140" font-size="13">v = 0.9&#x00B7;1 + 0.01&#x00B7;10 = 1.0</text>
  <text class="ink" x="56" y="168" font-size="13">w = 5.0 - 1.0</text>
  <text class="accent" x="56" y="216" font-size="16" font-weight="600">w = 4.0</text>
  <rect class="hi-soft" x="384" y="48" width="300" height="204" rx="8" stroke-width="1.5"/>
  <text class="hi" x="534" y="76" text-anchor="middle" font-size="14" font-weight="600">Nesterov (NAG)</text>
  <text class="ink" x="404" y="108" font-size="13">w_look = 5.0 - 0.9&#x00B7;1 = 4.1</text>
  <text class="ink" x="404" y="134" font-size="13">g(4.1) = 8.2</text>
  <text class="ink" x="404" y="160" font-size="13">v = 0.9&#x00B7;1 + 0.01&#x00B7;8.2 = 0.982</text>
  <text class="ink" x="404" y="186" font-size="13">w = 5.0 - 0.982</text>
  <text class="hi" x="404" y="228" font-size="16" font-weight="600">w = 4.018</text>
  <text class="muted" x="360" y="280" text-anchor="middle" font-size="12">Look-ahead g(4.1) = 8.2 vs g(5.0) = 10.0; NAG lands at 4.018, momentum at 4.0</text>
</svg>
