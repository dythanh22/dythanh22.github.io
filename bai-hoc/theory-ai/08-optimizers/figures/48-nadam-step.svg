<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="nadam-48-title">
  <title id="nadam-48-title">Nadam w1: Nesterov 0.119 / 0.10015, w approx 0.998</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .accent-soft { fill: #2F6FED; fill-opacity: 0.08; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .hi-soft { fill: #C45C0A; fill-opacity: 0.08; stroke: #C45C0A; }
    .card { fill: none; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    
  </style>
  <defs>
    <marker id="nadam-48-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" class="ink" stroke="none"/>
    </marker>
  </defs>

  <text id="nadam-48-heading" class="ink" x="360" y="28" text-anchor="middle" font-size="16" font-weight="600">Nadam on w1, &#x03B7; = 0.002</text>

  <rect class="card ink" x="24" y="52" width="188" height="220" rx="8" fill="none" stroke-width="1.25"/>
  <text class="ink" x="118" y="80" text-anchor="middle" font-size="14" font-weight="600" stroke="none">Moments</text>
  <text class="ink" x="44" y="116" font-size="13" stroke="none">w1 = 1.0</text>
  <text class="ink" x="44" y="148" font-size="13" stroke="none">g = 0.2</text>
  <text class="muted" x="44" y="184" font-size="13" stroke="none">m: 0.1 &#x2192; 0.11</text>
  <text class="muted" x="44" y="216" font-size="13" stroke="none">v: 0.01 &#x2192; 0.01003</text>

  <line class="ink" x1="218" y1="162" x2="250" y2="162" stroke-width="1.5" marker-end="url(#nadam-48-arrow)"/>

  <rect class="accent-soft card" x="256" y="52" width="232" height="220" rx="8" stroke-width="1.5"/>
  <text class="accent" x="372" y="80" text-anchor="middle" font-size="14" font-weight="600" stroke="none">Nesterov numerator</text>
  <text class="ink" x="276" y="120" font-size="13" stroke="none">0.9 x 0.11 + 0.1 x 0.2</text>
  <text class="accent" x="276" y="156" font-size="15" font-weight="600" stroke="none">= 0.119</text>
  <text class="ink" x="276" y="196" font-size="13" stroke="none">den = sqrt(0.01003)</text>
  <text class="hi" x="276" y="228" font-size="14" font-weight="600" stroke="none">&#x2248; 0.10015</text>

  <line class="ink" x1="494" y1="162" x2="526" y2="162" stroke-width="1.5" marker-end="url(#nadam-48-arrow)"/>

  <rect class="hi-soft card" x="532" y="52" width="164" height="220" rx="8" stroke-width="1.5"/>
  <text class="hi" x="614" y="80" text-anchor="middle" font-size="14" font-weight="600" stroke="none">Update</text>
  <text class="ink" x="548" y="124" font-size="13" stroke="none">0.119 / 0.10015</text>
  <text class="muted" x="548" y="156" font-size="13" stroke="none">x 0.002 &#x2248; 0.00238</text>
  <text class="hi" x="548" y="208" font-size="15" font-weight="600" stroke="none">w &#x2248; 0.998</text>

  <text class="muted" x="360" y="316" text-anchor="middle" font-size="12" stroke="none">Numerator mixes lookahead momentum with the current gradient</text>
</svg>
