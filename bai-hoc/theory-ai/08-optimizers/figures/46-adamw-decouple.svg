<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="adamw-46-title">
  <title id="adamw-46-title">AdamW decoupled: decay 0.001 plus grad 0.0316 to w=0.967</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .accent-soft { fill: #2F6FED; fill-opacity: 0.08; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .hi-soft { fill: #C45C0A; fill-opacity: 0.08; stroke: #C45C0A; }
    .card { fill: none; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .accent-soft { fill: #8AB4F8; fill-opacity: 0.12; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .hi-soft { fill: #F9AB00; fill-opacity: 0.12; stroke: #F9AB00; }
    }
  </style>
  <defs>
    <marker id="adamw-46-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" class="ink" stroke="none"/>
    </marker>
  </defs>

  <text id="adamw-46-heading" class="ink" x="360" y="28" text-anchor="middle" font-size="16" font-weight="600">AdamW on w1, &#x03B7; = 0.01, &#x03BB; = 0.1</text>

  <rect class="card ink" x="24" y="56" width="160" height="200" rx="8" fill="none" stroke-width="1.25"/>
  <text class="ink" x="104" y="84" text-anchor="middle" font-size="14" font-weight="600" stroke="none">Start</text>
  <text class="ink" x="44" y="128" font-size="13" stroke="none">w1 = 1.0</text>
  <text class="muted" x="44" y="160" font-size="13" stroke="none">g = 0.3</text>
  <text class="muted" x="44" y="192" font-size="13" stroke="none">m = 0.03</text>
  <text class="muted" x="44" y="224" font-size="13" stroke="none">v = 0.00009</text>

  <line class="ink" x1="190" y1="120" x2="228" y2="120" stroke-width="1.5" marker-end="url(#adamw-46-arrow)"/>
  <line class="ink" x1="190" y1="196" x2="228" y2="196" stroke-width="1.5" marker-end="url(#adamw-46-arrow)"/>

  <rect class="hi-soft card" x="234" y="56" width="200" height="112" rx="8" stroke-width="1.5"/>
  <text class="hi" x="334" y="84" text-anchor="middle" font-size="14" font-weight="600" stroke="none">Decay (direct)</text>
  <text class="ink" x="254" y="116" font-size="13" stroke="none">&#x03B7;&#x03BB;w = 0.01 x 0.1 x 1</text>
  <text class="hi" x="254" y="148" font-size="15" font-weight="600" stroke="none">= 0.001</text>

  <rect class="accent-soft card" x="234" y="184" width="200" height="112" rx="8" stroke-width="1.5"/>
  <text class="accent" x="334" y="212" text-anchor="middle" font-size="14" font-weight="600" stroke="none">Grad (adaptive)</text>
  <text class="ink" x="254" y="244" font-size="13" stroke="none">0.01 x 0.03/0.00949</text>
  <text class="accent" x="254" y="276" font-size="15" font-weight="600" stroke="none">&#x2248; 0.0316</text>

  <line class="ink" x1="440" y1="112" x2="478" y2="148" stroke-width="1.5" marker-end="url(#adamw-46-arrow)"/>
  <line class="ink" x1="440" y1="240" x2="478" y2="188" stroke-width="1.5" marker-end="url(#adamw-46-arrow)"/>

  <rect class="card ink" x="484" y="100" width="212" height="140" rx="8" fill="none" stroke-width="1.25"/>
  <text class="ink" x="590" y="132" text-anchor="middle" font-size="14" font-weight="600" stroke="none">Decoupled sum</text>
  <text class="muted" x="504" y="164" font-size="13" stroke="none">1.0 - 0.001 - 0.0316</text>
  <text class="hi" x="504" y="204" font-size="16" font-weight="600" stroke="none">w1 &#x2248; 0.967</text>

  <text class="muted" x="360" y="320" text-anchor="middle" font-size="12" stroke="none">Decay is not divided by sqrt(v)</text>
</svg>
