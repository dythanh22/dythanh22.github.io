<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="monmet-107-title">
  <title id="monmet-107-title">Fraud confusion: TP=2, FN=2, FP=2, TN=4; Acc=0.60, P=R=F1=0.50</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .box { fill: none; stroke: #1A1A1A; }
    .box-soft { fill: none; stroke: #5C6570; }
    .cell { fill: #E8F0FE; stroke: #2F6FED; }
    .vcell { fill: #FCE8D5; stroke: #C45C0A; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    
  </style>

  <text id="monmet-107-heading" class="ink" x="320" y="26" text-anchor="middle" font-size="15" font-weight="600">Fraud 10 txs: Acc = 0.60, P = R = F1 = 0.50</text>

  <rect class="box" x="140" y="56" width="400" height="196" stroke-width="1.5" rx="4"/>
  <line class="box-soft" x1="140" y1="100" x2="540" y2="100" stroke-width="1"/>
  <line class="box-soft" x1="140" y1="176" x2="540" y2="176" stroke-width="1"/>
  <line class="box-soft" x1="220" y1="56" x2="220" y2="252" stroke-width="1"/>
  <line class="box-soft" x1="380" y1="56" x2="380" y2="252" stroke-width="1"/>

  <text class="muted" x="300" y="84" text-anchor="middle" font-size="12" stroke="none">Predicted +</text>
  <text class="muted" x="460" y="84" text-anchor="middle" font-size="12" stroke="none">Predicted -</text>
  <text class="muted" x="180" y="148" text-anchor="middle" font-size="12" stroke="none">Actual +</text>
  <text class="muted" x="180" y="224" text-anchor="middle" font-size="12" stroke="none">Actual -</text>

  <text class="accent" x="300" y="138" text-anchor="middle" font-size="18" font-weight="600" stroke="none">TP = 2</text>
  <text class="hi" x="460" y="138" text-anchor="middle" font-size="18" font-weight="600" stroke="none">FN = 2</text>
  <text class="hi" x="300" y="214" text-anchor="middle" font-size="18" font-weight="600" stroke="none">FP = 2</text>
  <text class="ink" x="460" y="214" text-anchor="middle" font-size="18" font-weight="600" stroke="none">TN = 4</text>

  <rect class="cell" x="56" y="288" width="120" height="48" rx="4" stroke-width="1.25"/>
  <rect class="box-soft" x="192" y="288" width="120" height="48" rx="4" stroke-width="1.25"/>
  <rect class="box-soft" x="328" y="288" width="120" height="48" rx="4" stroke-width="1.25"/>
  <rect class="vcell" x="464" y="288" width="120" height="48" rx="4" stroke-width="1.5"/>

  <text class="ink" x="116" y="318" text-anchor="middle" font-size="14" font-weight="600" stroke="none">Acc = 0.60</text>
  <text class="ink" x="252" y="318" text-anchor="middle" font-size="14" font-weight="600" stroke="none">P = 0.50</text>
  <text class="ink" x="388" y="318" text-anchor="middle" font-size="14" font-weight="600" stroke="none">R = 0.50</text>
  <text class="hi" x="524" y="318" text-anchor="middle" font-size="14" font-weight="600" stroke="none">F1 = 0.50</text>

  <text class="muted" x="320" y="368" text-anchor="middle" font-size="12" stroke="none">(2+4)/(2+4+2+2)=0.60; 2/(2+2)=0.50</text>
</svg>
