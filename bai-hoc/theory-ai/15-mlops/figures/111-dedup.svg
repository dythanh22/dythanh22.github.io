<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="dedup-111-title">
  <title id="dedup-111-title">most_complete keeps Record 2 then Record 1</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .nofill { fill: none; }
    .box-a { fill: #E8F0FE; stroke: #2F6FED; }
    .box-b { fill: #E8E9EB; stroke: #5C6570; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .box-a { fill: #1A2A44; stroke: #8AB4F8; }
      .box-b { fill: #2A2C2E; stroke: #9AA0A6; }
    }
  </style>

  <text id="dedup-111-heading" class="ink" x="360" y="26" text-anchor="middle" font-size="15" font-weight="600">most_complete: Rec 2 then Rec 1</text>
  <text class="muted" x="360" y="46" text-anchor="middle" font-size="12">keys (A, 1) then (B, 2); first-appearance order</text>

  <!-- Group (A,1) -->
  <text class="ink" x="182" y="72" text-anchor="middle" font-size="13" font-weight="600">key (A, 1)</text>
  <rect class="box-b" x="28" y="84" width="92" height="56" rx="6" stroke-width="1.25"/>
  <text class="muted" x="74" y="106" text-anchor="middle" font-size="12" stroke="none">Rec 0</text>
  <text class="muted" x="74" y="124" text-anchor="middle" font-size="11" stroke="none">nulls = 1</text>

  <rect class="box-a" x="136" y="84" width="92" height="56" rx="6" stroke-width="1.5"/>
  <text class="accent" x="182" y="106" text-anchor="middle" font-size="12" font-weight="700" stroke="none">Rec 2</text>
  <text class="ink" x="182" y="124" text-anchor="middle" font-size="11" stroke="none">nulls = 0</text>

  <rect class="box-b" x="244" y="84" width="92" height="56" rx="6" stroke-width="1.25"/>
  <text class="muted" x="290" y="106" text-anchor="middle" font-size="12" stroke="none">Rec 3</text>
  <text class="muted" x="290" y="124" text-anchor="middle" font-size="11" stroke="none">nulls = 1</text>

  <!-- Group (B,2) -->
  <text class="ink" x="500" y="72" text-anchor="middle" font-size="13" font-weight="600">key (B, 2)</text>
  <rect class="box-a" x="400" y="84" width="92" height="56" rx="6" stroke-width="1.5"/>
  <text class="accent" x="446" y="106" text-anchor="middle" font-size="12" font-weight="700" stroke="none">Rec 1</text>
  <text class="ink" x="446" y="124" text-anchor="middle" font-size="11" stroke="none">nulls = 0</text>

  <rect class="box-b" x="508" y="84" width="92" height="56" rx="6" stroke-width="1.25"/>
  <text class="muted" x="554" y="106" text-anchor="middle" font-size="12" stroke="none">Rec 4</text>
  <text class="muted" x="554" y="124" text-anchor="middle" font-size="11" stroke="none">nulls = 1</text>

  <!-- arrows down to output -->
  <line class="accent nofill" x1="182" y1="148" x2="182" y2="188" stroke-width="1.5"/>
  <polygon class="accent" points="177,188 187,188 182,196"/>
  <line class="accent nofill" x1="446" y1="148" x2="446" y2="188" stroke-width="1.5"/>
  <polygon class="accent" points="441,188 451,188 446,196"/>

  <rect class="box-a" x="120" y="208" width="480" height="64" rx="8" stroke-width="1.5"/>
  <text class="muted" x="360" y="232" text-anchor="middle" font-size="12" stroke="none">output (first-appearance)</text>
  <text id="dedup-111-output" class="ink" x="360" y="256" text-anchor="middle" font-size="15" font-weight="700" stroke="none">[Record 2, Record 1]</text>
</svg>
