<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="mver-104-title">
  <title id="mver-104-title">Promote v3: acc 0.94, latency 50ms</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .cell { fill: #E8F0FE; stroke: #2F6FED; }
    .vcell { fill: #FCE8D5; stroke: #C45C0A; }
    .box { fill: none; stroke: #1A1A1A; }
    .nofill { fill: none; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .cell { fill: #1A2A44; stroke: #8AB4F8; }
      .vcell { fill: #3D2A12; stroke: #F9AB00; }
      .box { stroke: #E8EAED; }
    }
  </style>

  <text id="mver-104-heading" class="ink" x="360" y="28" text-anchor="middle" font-size="15" font-weight="600">Promote v3 (acc 0.94, 50ms)</text>

  <rect id="mver-104-v1" class="cell" x="40" y="52" width="196" height="148" rx="6" stroke-width="1.5"/>
  <text class="accent" x="138" y="80" text-anchor="middle" font-size="15" font-weight="600" stroke="none">v1</text>
  <text class="ink" x="138" y="112" text-anchor="middle" font-size="14" stroke="none">acc = 0.92</text>
  <text class="ink" x="138" y="138" text-anchor="middle" font-size="14" stroke="none">latency = 45ms</text>
  <text class="muted" x="138" y="170" text-anchor="middle" font-size="12" stroke="none">filtered: lower acc</text>

  <rect id="mver-104-v2" class="cell" x="262" y="52" width="196" height="148" rx="6" stroke-width="1.5"/>
  <text class="accent" x="360" y="80" text-anchor="middle" font-size="15" font-weight="600" stroke="none">v2</text>
  <text class="ink" x="360" y="112" text-anchor="middle" font-size="14" stroke="none">acc = 0.94</text>
  <text class="ink" x="360" y="138" text-anchor="middle" font-size="14" stroke="none">latency = 60ms</text>
  <text class="muted" x="360" y="170" text-anchor="middle" font-size="12" stroke="none">tied acc, slower</text>

  <rect id="mver-104-v3" class="vcell" x="484" y="52" width="196" height="148" rx="6" stroke-width="2"/>
  <text class="hi" x="582" y="80" text-anchor="middle" font-size="15" font-weight="600" stroke="none">v3</text>
  <text class="ink" x="582" y="112" text-anchor="middle" font-size="14" stroke="none">acc = 0.94</text>
  <text class="ink" x="582" y="138" text-anchor="middle" font-size="14" stroke="none">latency = 50ms</text>
  <text class="hi" x="582" y="170" text-anchor="middle" font-size="12" font-weight="600" stroke="none">promote</text>

  <line class="hi nofill" x1="582" y1="210" x2="582" y2="236" stroke-width="2"/>
  <polygon class="hi" points="576,236 582,248 588,236" stroke="none"/>

  <rect id="mver-104-result" class="vcell" x="40" y="256" width="640" height="56" rx="6" stroke-width="1.75"/>
  <text class="hi" x="360" y="280" text-anchor="middle" font-size="13" font-weight="600" stroke="none">lexicographic: acc desc, then latency asc</text>
  <text class="ink" x="360" y="300" text-anchor="middle" font-size="14" font-weight="600" stroke="none">winner = v3</text>
</svg>
