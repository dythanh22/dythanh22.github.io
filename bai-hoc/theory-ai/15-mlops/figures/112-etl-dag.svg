<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="orch-112-title">
  <title id="orch-112-title">DAG schedule: A,B at 0; C at 2; D at 3; makespan 4</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .nofill { fill: none; }
    .box-a { fill: #E8F0FE; stroke: #2F6FED; }
    .box-b { fill: #FCE8D5; stroke: #C45C0A; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    
  </style>

  <text id="orch-112-heading" class="ink" x="360" y="24" text-anchor="middle" font-size="15" font-weight="600">Makespan 4 vs sequential 8 (budget 3)</text>

  <!-- row labels -->
  <text class="ink" x="48" y="78" text-anchor="middle" font-size="13" font-weight="600">A</text>
  <text class="ink" x="48" y="126" text-anchor="middle" font-size="13" font-weight="600">B</text>
  <text class="ink" x="48" y="174" text-anchor="middle" font-size="13" font-weight="600">C</text>
  <text class="ink" x="48" y="222" text-anchor="middle" font-size="13" font-weight="600">D</text>

  <!-- time axis: t=0 at x=100, unit=90px, t=4 at x=460 -->
  <line class="ink nofill" x1="100" y1="248" x2="460" y2="248" stroke-width="1.25"/>
  <line class="muted nofill" x1="100" y1="244" x2="100" y2="252" stroke-width="1.25"/>
  <line class="muted nofill" x1="190" y1="244" x2="190" y2="252" stroke-width="1.25"/>
  <line class="muted nofill" x1="280" y1="244" x2="280" y2="252" stroke-width="1.25"/>
  <line class="muted nofill" x1="370" y1="244" x2="370" y2="252" stroke-width="1.25"/>
  <line class="hi nofill" x1="460" y1="52" x2="460" y2="252" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text class="muted" x="100" y="270" text-anchor="middle" font-size="11">0</text>
  <text class="muted" x="190" y="270" text-anchor="middle" font-size="11">1</text>
  <text class="muted" x="280" y="270" text-anchor="middle" font-size="11">2</text>
  <text class="muted" x="370" y="270" text-anchor="middle" font-size="11">3</text>
  <text class="hi" x="460" y="270" text-anchor="middle" font-size="11" stroke="none">4</text>
  <text class="muted" x="280" y="292" text-anchor="middle" font-size="12">time</text>

  <!-- A: 0-2, res=2 -->
  <rect class="box-a" x="100" y="58" width="180" height="32" rx="4" stroke-width="1.5"/>
  <text class="ink" x="190" y="78" text-anchor="middle" font-size="12" stroke="none">start 0  res=2</text>
  <!-- B: 0-3, res=1 -->
  <rect class="box-a" x="100" y="106" width="270" height="32" rx="4" stroke-width="1.5"/>
  <text class="ink" x="235" y="126" text-anchor="middle" font-size="12" stroke="none">start 0  res=1</text>
  <!-- C: 2-4, res=2 -->
  <rect class="box-a" x="280" y="154" width="180" height="32" rx="4" stroke-width="1.5"/>
  <text class="ink" x="370" y="174" text-anchor="middle" font-size="12" stroke="none">start 2  res=2</text>
  <!-- D: 3-4, res=1 -->
  <rect class="box-b" x="370" y="202" width="90" height="32" rx="4" stroke-width="1.5"/>
  <text class="ink" x="415" y="222" text-anchor="middle" font-size="12" stroke="none">start 3</text>

  <!-- side notes -->
  <text id="orch-112-makespan" class="hi" x="590" y="120" text-anchor="middle" font-size="14" font-weight="700" stroke="none">makespan 4</text>
  <text class="muted" x="590" y="144" text-anchor="middle" font-size="12">sequential 8</text>
  <text class="ink" x="590" y="176" text-anchor="middle" font-size="13" stroke="none">budget 3</text>
</svg>
