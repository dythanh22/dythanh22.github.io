<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="retrain-108-title">
  <title id="retrain-108-title">Retrain days 3 and 7; day 9 blocked</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .nofill { fill: none; }
    .box-a { fill: #E8F0FE; stroke: #2F6FED; }
    .box-b { fill: #FCE8D5; stroke: #C45C0A; }
    .cool { fill: #FCE8D5; stroke: none; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    
  </style>

  <text id="retrain-108-heading" class="ink" x="360" y="26" text-anchor="middle" font-size="15" font-weight="600">Retrain days [3, 7]; Day 9 blocked</text>
  <text class="muted" x="360" y="46" text-anchor="middle" font-size="12">drift &gt; 0.15, perf &lt; 0.85, cooldown = 3</text>

  <!-- cooldown band: Day 7 to Day 9, x(d)=60+(d-1)*62 -->
  <rect class="cool" x="432" y="168" width="124" height="36" opacity="0.55" rx="4"/>

  <line class="ink nofill" x1="60" y1="186" x2="660" y2="186" stroke-width="1.5"/>

  <!-- ticks Day 1..10 at x=60+(d-1)*62 -->
  <line class="muted nofill" x1="60" y1="180" x2="60" y2="192" stroke-width="1.25"/>
  <line class="muted nofill" x1="122" y1="180" x2="122" y2="192" stroke-width="1.25"/>
  <line class="ink nofill" x1="184" y1="178" x2="184" y2="194" stroke-width="1.5"/>
  <line class="muted nofill" x1="246" y1="180" x2="246" y2="192" stroke-width="1.25"/>
  <line class="muted nofill" x1="308" y1="180" x2="308" y2="192" stroke-width="1.25"/>
  <line class="muted nofill" x1="370" y1="180" x2="370" y2="192" stroke-width="1.25"/>
  <line class="ink nofill" x1="432" y1="178" x2="432" y2="194" stroke-width="1.5"/>
  <line class="muted nofill" x1="494" y1="180" x2="494" y2="192" stroke-width="1.25"/>
  <line class="ink nofill" x1="556" y1="178" x2="556" y2="194" stroke-width="1.5"/>
  <line class="muted nofill" x1="618" y1="180" x2="618" y2="192" stroke-width="1.25"/>

  <text class="muted" x="60" y="212" text-anchor="middle" font-size="11">1</text>
  <text class="muted" x="122" y="212" text-anchor="middle" font-size="11">2</text>
  <text class="ink" x="184" y="212" text-anchor="middle" font-size="12" font-weight="600">3</text>
  <text class="muted" x="246" y="212" text-anchor="middle" font-size="11">4</text>
  <text class="muted" x="308" y="212" text-anchor="middle" font-size="11">5</text>
  <text class="muted" x="370" y="212" text-anchor="middle" font-size="11">6</text>
  <text class="ink" x="432" y="212" text-anchor="middle" font-size="12" font-weight="600">7</text>
  <text class="muted" x="494" y="212" text-anchor="middle" font-size="11">8</text>
  <text class="ink" x="556" y="212" text-anchor="middle" font-size="12" font-weight="600">9</text>
  <text class="muted" x="618" y="212" text-anchor="middle" font-size="11">10</text>
  <text class="muted" x="360" y="232" text-anchor="middle" font-size="12">Day</text>

  <!-- Day 3 retrain -->
  <rect class="box-a" x="132" y="62" width="104" height="44" rx="6" stroke-width="1.5"/>
  <text class="accent" x="184" y="80" text-anchor="middle" font-size="12" font-weight="600" stroke="none">RETRAIN</text>
  <text class="ink" x="184" y="96" text-anchor="middle" font-size="11" stroke="none">drift 0.18</text>
  <circle class="accent" cx="184" cy="186" r="7"/>
  <line class="accent nofill" x1="184" y1="106" x2="184" y2="178" stroke-width="1.25"/>

  <!-- Day 7 retrain -->
  <rect class="box-a" x="382" y="62" width="100" height="44" rx="6" stroke-width="1.5"/>
  <text class="accent" x="432" y="80" text-anchor="middle" font-size="12" font-weight="600" stroke="none">RETRAIN</text>
  <text class="ink" x="432" y="96" text-anchor="middle" font-size="11" stroke="none">perf 0.84</text>
  <circle class="accent" cx="432" cy="186" r="7"/>
  <line class="accent nofill" x1="432" y1="106" x2="432" y2="178" stroke-width="1.25"/>

  <!-- Day 9 blocked -->
  <rect class="box-b" x="506" y="62" width="100" height="44" rx="6" stroke-width="1.5"/>
  <text class="hi" x="556" y="80" text-anchor="middle" font-size="12" font-weight="600" stroke="none">BLOCKED</text>
  <text class="ink" x="556" y="96" text-anchor="middle" font-size="11" stroke="none">2 &lt; 3</text>
  <circle class="hi" cx="556" cy="186" r="7"/>
  <line class="hi nofill" x1="556" y1="106" x2="556" y2="178" stroke-width="1.25"/>

  <text id="retrain-108-output" class="ink" x="360" y="270" text-anchor="middle" font-size="14" font-weight="600">output = [3, 7]</text>
  <text class="muted" x="494" y="154" text-anchor="middle" font-size="11">cooldown</text>
</svg>
