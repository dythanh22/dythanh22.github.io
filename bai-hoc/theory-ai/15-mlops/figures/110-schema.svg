<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="schema-110-title">
  <title id="schema-110-title">Record 1 PASS vs Record 2 type and range errors</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .nofill { fill: none; }
    .box-a { fill: #E8F0FE; stroke: #2F6FED; }
    .box-b { fill: #FCE8D5; stroke: #C45C0A; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .box-a { fill: #1A2A44; stroke: #8AB4F8; }
      .box-b { fill: #3A2A14; stroke: #F9AB00; }
    }
  </style>

  <text id="schema-110-heading" class="ink" x="360" y="26" text-anchor="middle" font-size="15" font-weight="600">Schema check: Rec 1 PASS / Rec 2 FAIL</text>
  <text class="muted" x="360" y="46" text-anchor="middle" font-size="12">user_id int, age int in [0, 150]</text>

  <!-- Record 1 card -->
  <rect class="box-a" x="28" y="66" width="320" height="210" rx="8" stroke-width="1.5"/>
  <text class="accent" x="188" y="92" text-anchor="middle" font-size="14" font-weight="700" stroke="none">Record 1  PASS</text>
  <text class="ink" x="48" y="122" font-size="13" stroke="none">user_id = 123</text>
  <text class="muted" x="48" y="142" font-size="12" stroke="none">type int  OK</text>
  <text class="ink" x="48" y="172" font-size="13" stroke="none">age = 25</text>
  <text class="muted" x="48" y="192" font-size="12" stroke="none">0 &#x2264; 25 &#x2264; 150  OK</text>
  <text id="schema-110-r1" class="ink" x="188" y="248" text-anchor="middle" font-size="13" font-weight="600" stroke="none">(0, True, [])</text>

  <!-- Record 2 card -->
  <rect class="box-b" x="372" y="66" width="320" height="210" rx="8" stroke-width="1.5"/>
  <text class="hi" x="532" y="92" text-anchor="middle" font-size="14" font-weight="700" stroke="none">Record 2  FAIL</text>
  <text class="ink" x="392" y="122" font-size="13" stroke="none">user_id = &quot;abc&quot;</text>
  <text class="hi" x="392" y="142" font-size="12" font-weight="600" stroke="none">expected int, got str</text>
  <text class="ink" x="392" y="172" font-size="13" stroke="none">age = -5</text>
  <text class="hi" x="392" y="192" font-size="12" font-weight="600" stroke="none">out of range</text>
  <text id="schema-110-r2" class="ink" x="532" y="248" text-anchor="middle" font-size="12" font-weight="600" stroke="none">(1, False, 2 errors)</text>
</svg>
