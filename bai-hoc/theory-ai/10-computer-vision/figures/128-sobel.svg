<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" role="img" aria-labelledby="sobel-128-title">
  <title id="sobel-128-title">Sobel patch: Gx=120, Gy=40, mag=126.5</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .cell { fill: #FFFFFF; stroke: #1A1A1A; }
    .hi-cell { fill: #F8E6D4; stroke: #C45C0A; }
    .card { fill: #FFFFFF; stroke: #5C6570; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    
  </style>
  <defs>
    <marker id="sobel-128-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" class="accent" stroke="none"/>
    </marker>
  </defs>

  <text id="sobel-128-heading" class="ink" x="290" y="26" text-anchor="middle" font-size="16" font-weight="600">Sobel: Gx=120, Gy=40, |G|=126.5</text>

  <text class="muted" x="136" y="54" text-anchor="middle" font-size="12" stroke="none">patch 3x3</text>

  <!-- patch origin (40,68), cell 64; right column is the bright edge -->
  <rect class="cell" x="40" y="68" width="64" height="64" stroke-width="1.2"/>
  <rect class="cell" x="104" y="68" width="64" height="64" stroke-width="1.2"/>
  <rect class="cell" x="168" y="68" width="64" height="64" stroke-width="1.2"/>
  <rect class="cell" x="40" y="132" width="64" height="64" stroke-width="1.2"/>
  <rect class="cell" x="104" y="132" width="64" height="64" stroke-width="1.2"/>
  <rect class="hi-cell" x="168" y="132" width="64" height="64" stroke-width="1.8"/>
  <rect class="cell" x="40" y="196" width="64" height="64" stroke-width="1.2"/>
  <rect class="cell" x="104" y="196" width="64" height="64" stroke-width="1.2"/>
  <rect class="hi-cell" x="168" y="196" width="64" height="64" stroke-width="1.8"/>

  <text class="ink" x="72" y="106" text-anchor="middle" font-size="18" font-weight="600" stroke="none">10</text>
  <text class="ink" x="136" y="106" text-anchor="middle" font-size="18" font-weight="600" stroke="none">10</text>
  <text class="ink" x="200" y="106" text-anchor="middle" font-size="18" font-weight="600" stroke="none">10</text>
  <text class="ink" x="72" y="170" text-anchor="middle" font-size="18" font-weight="600" stroke="none">10</text>
  <text class="ink" x="136" y="170" text-anchor="middle" font-size="18" font-weight="600" stroke="none">10</text>
  <text class="hi" x="200" y="170" text-anchor="middle" font-size="18" font-weight="700" stroke="none">50</text>
  <text class="ink" x="72" y="234" text-anchor="middle" font-size="18" font-weight="600" stroke="none">10</text>
  <text class="ink" x="136" y="234" text-anchor="middle" font-size="18" font-weight="600" stroke="none">10</text>
  <text class="hi" x="200" y="234" text-anchor="middle" font-size="18" font-weight="700" stroke="none">50</text>

  <text class="hi" x="136" y="284" text-anchor="middle" font-size="12" stroke="none">bright pixels = 50</text>

  <line class="accent" x1="248" y1="164" x2="360" y2="164" stroke-width="2" fill="none" marker-end="url(#sobel-128-arrow)"/>

  <rect class="card" x="380" y="72" width="160" height="56" rx="4" stroke-width="1.4"/>
  <text class="accent" x="460" y="106" text-anchor="middle" font-size="18" font-weight="700" stroke="none">Gx = 120</text>

  <rect class="card" x="380" y="140" width="160" height="56" rx="4" stroke-width="1.4"/>
  <text class="accent" x="460" y="174" text-anchor="middle" font-size="18" font-weight="700" stroke="none">Gy = 40</text>

  <rect class="card" x="380" y="208" width="160" height="56" rx="4" stroke-width="1.6"/>
  <text class="hi" x="460" y="242" text-anchor="middle" font-size="18" font-weight="700" stroke="none">|G| = 126.5</text>

  <text class="muted" x="460" y="290" text-anchor="middle" font-size="12" stroke="none">|G| = &#x221A;(120&#x00B2; + 40&#x00B2;) = &#x221A;16000</text>
</svg>
