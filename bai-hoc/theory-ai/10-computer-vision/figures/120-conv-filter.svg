<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="conv-120-title">
  <title id="conv-120-title">2x2 conv; out[0,0]=7, out[0,1]=9</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
