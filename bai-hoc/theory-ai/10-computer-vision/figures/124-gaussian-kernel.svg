<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-labelledby="gauss-124-title">
  <title id="gauss-124-title">Gaussian 3x3, sigma=1; center 0.204, corners 0.075</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .cell { fill: #FFFFFF; stroke: #1A1A1A; }
    .edge { fill: #E8F0FE; stroke: #2F6FED; }
    .hi-cell { fill: #F8E6D4; stroke: #C45C0A; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    
  </style>

  <text id="gauss-124-heading" class="ink" x="280" y="28" text-anchor="middle" font-size="16" font-weight="600">Gaussian 3x3, &#x03C3; = 1</text>

  <!-- grid origin (172, 56), cell 72 -->
  <!-- corners: cell; edges: edge; center: hi-cell -->
  <rect class="cell" x="172" y="56" width="72" height="72" stroke-width="1.2"/>
  <rect class="edge" x="244" y="56" width="72" height="72" stroke-width="1.6"/>
  <rect class="cell" x="316" y="56" width="72" height="72" stroke-width="1.2"/>
  <rect class="edge" x="172" y="128" width="72" height="72" stroke-width="1.6"/>
  <rect class="hi-cell" x="244" y="128" width="72" height="72" stroke-width="2"/>
  <rect class="edge" x="316" y="128" width="72" height="72" stroke-width="1.6"/>
  <rect class="cell" x="172" y="200" width="72" height="72" stroke-width="1.2"/>
  <rect class="edge" x="244" y="200" width="72" height="72" stroke-width="1.6"/>
  <rect class="cell" x="316" y="200" width="72" height="72" stroke-width="1.2"/>

  <text class="ink" x="208" y="98" text-anchor="middle" font-size="15" font-weight="600" stroke="none">0.075</text>
  <text class="accent" x="280" y="98" text-anchor="middle" font-size="15" font-weight="600" stroke="none">0.124</text>
  <text class="ink" x="352" y="98" text-anchor="middle" font-size="15" font-weight="600" stroke="none">0.075</text>
  <text class="accent" x="208" y="170" text-anchor="middle" font-size="15" font-weight="600" stroke="none">0.124</text>
  <text class="hi" x="280" y="170" text-anchor="middle" font-size="16" font-weight="700" stroke="none">0.204</text>
  <text class="accent" x="352" y="170" text-anchor="middle" font-size="15" font-weight="600" stroke="none">0.124</text>
  <text class="ink" x="208" y="242" text-anchor="middle" font-size="15" font-weight="600" stroke="none">0.075</text>
  <text class="accent" x="280" y="242" text-anchor="middle" font-size="15" font-weight="600" stroke="none">0.124</text>
  <text class="ink" x="352" y="242" text-anchor="middle" font-size="15" font-weight="600" stroke="none">0.075</text>

  <!-- labels OUTSIDE the grid -->
  <text class="hi" x="280" y="300" text-anchor="middle" font-size="13" font-weight="600" stroke="none">center 0.204</text>
  <text class="muted" x="280" y="322" text-anchor="middle" font-size="13" stroke="none">corners 0.075 &#x00B7; edges 0.124</text>
  <text class="muted" x="280" y="348" text-anchor="middle" font-size="13" stroke="none">sum = 1.0</text>
</svg>
