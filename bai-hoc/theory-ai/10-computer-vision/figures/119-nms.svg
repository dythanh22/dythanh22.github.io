<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="nms-119-title">
  <title id="nms-119-title">NMS keeps A and C, suppresses B and D</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .keep { fill: #E8F0FE; stroke: #2F6FED; }
    .drop { fill: none; stroke: #C45C0A; }
    .panel { fill: #FFFFFF; stroke: #5C6570; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    
  </style>
  <defs>
    <marker id="nms-119-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" class="accent" stroke="none"/>
    </marker>
  </defs>

  <text id="nms-119-heading" class="ink" x="360" y="26" text-anchor="middle" font-size="15" font-weight="600">NMS, IoU threshold = 0.5</text>

  <rect id="nms-119-a" class="keep" data-allow-overlap="1" x="48" y="88" width="140" height="118" stroke-width="2.2"/>
  <rect id="nms-119-b" class="drop" data-allow-overlap="1" x="78" y="104" width="136" height="114" stroke-width="2" stroke-dasharray="6 4"/>
  <rect id="nms-119-d" class="drop" data-allow-overlap="1" x="40" y="122" width="124" height="108" stroke-width="2" stroke-dasharray="6 4"/>
  <rect id="nms-119-c" class="keep" x="292" y="96" width="128" height="112" stroke-width="2.2"/>

  <text class="accent" x="48" y="76" font-size="13" font-weight="600" stroke="none">A  0.9  keep</text>
  <text class="hi" x="216" y="92" font-size="12" font-weight="600" stroke="none">B  0.75</text>
  <text class="hi" x="40" y="250" font-size="12" font-weight="600" stroke="none">D  0.5</text>
  <text class="accent" x="292" y="84" font-size="13" font-weight="600" stroke="none">C  0.6  keep</text>

  <text class="muted" x="230" y="282" text-anchor="middle" font-size="12" stroke="none">IoU(A,B)=0.8 suppress</text>
  <text class="muted" x="230" y="302" text-anchor="middle" font-size="12" stroke="none">IoU(A,D)=0.7 suppress</text>
  <text class="muted" x="230" y="322" text-anchor="middle" font-size="12" stroke="none">IoU(A,C)=0.2 keep</text>

  <line class="accent" x1="436" y1="152" x2="498" y2="152" stroke-width="2" fill="none" marker-end="url(#nms-119-arrow)"/>

  <rect class="panel" x="512" y="72" width="188" height="200" rx="4" stroke-width="1.2"/>
  <text class="muted" x="606" y="96" text-anchor="middle" font-size="12" stroke="none">output</text>
  <text class="accent" x="606" y="128" text-anchor="middle" font-size="16" font-weight="700" stroke="none">A  0.9</text>
  <text class="accent" x="606" y="156" text-anchor="middle" font-size="16" font-weight="700" stroke="none">C  0.6</text>
  <text class="hi" x="606" y="196" text-anchor="middle" font-size="12" stroke="none">suppress B, D</text>
  <text class="ink" x="606" y="232" text-anchor="middle" font-size="14" font-weight="600" stroke="none">kept: [A, C]</text>
</svg>
