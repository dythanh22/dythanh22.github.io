  <text class="ink" x="520" y="102" text-anchor="middle" font-size="18" font-weight="600" stroke="none">6</text>
  <text class="ink" x="576" y="102" text-anchor="middle" font-size="18" font-weight="600" stroke="none">9</text>
  <text class="ink" x="464" y="158" text-anchor="middle" font-size="18" font-weight="600" stroke="none">2</text>
