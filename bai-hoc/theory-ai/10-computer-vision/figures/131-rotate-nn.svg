  <text class="muted" x="340" y="268" text-anchor="middle" font-size="12" stroke="none">3 at (0,2) maps to (0,0); center 5 stays</text>
  <text class="muted" x="340" y="292" text-anchor="middle" font-size="12" stroke="none">[[3, 6, 9], [2, 5, 8], [1, 4, 7]]</text>
