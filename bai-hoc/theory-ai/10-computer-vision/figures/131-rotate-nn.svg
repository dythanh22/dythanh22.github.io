  <rect class="cell" x="436" y="180" width="56" height="56" stroke-width="1.2"/>
  <rect class="cell" x="492" y="180" width="56" height="56" stroke-width="1.2"/>
  <rect class="cell" x="548" y="180" width="56" height="56" stroke-width="1.2"/>

