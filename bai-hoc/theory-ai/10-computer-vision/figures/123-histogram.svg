<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="hist-123-title">
  <title id="hist-123-title">Image histogram n=16, peak at 100</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .axis { fill: none; stroke: #1A1A1A; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .axis { stroke: #E8EAED; }
    }
  </style>
  <text id="hist-123-heading" class="ink" x="320" y="28" text-anchor="middle" font-size="16" font-weight="600">Image histogram, n = 16</text>
  <line class="axis" x1="64" y1="292" x2="600" y2="292" stroke-width="1.25"/>
  <line class="axis" x1="64" y1="48" x2="64" y2="292" stroke-width="1.25"/>
  <text class="muted" x="56" y="296" text-anchor="end" font-size="12">0</text>
  <text class="muted" x="56" y="212" text-anchor="end" font-size="12">2</text>
  <text class="muted" x="56" y="128" text-anchor="end" font-size="12">4</text>
  <text class="muted" x="56" y="52" text-anchor="end" font-size="12">5</text>
  <!-- scale: 1 count = 42 px; y = 292 - 42*count -->
  <rect class="accent" x="88" y="208" width="56" height="84"/>
  <text class="muted" x="116" y="198" text-anchor="middle" font-size="12">2</text>
  <text class="ink" x="116" y="312" text-anchor="middle" font-size="13">0</text>
  <rect class="accent" x="168" y="124" width="56" height="168"/>
  <text class="muted" x="196" y="114" text-anchor="middle" font-size="12">4</text>
  <text class="ink" x="196" y="312" text-anchor="middle" font-size="13">50</text>
  <rect class="hi" x="248" y="82" width="56" height="210"/>
  <text class="hi" x="276" y="72" text-anchor="middle" font-size="12" stroke="none">5</text>
  <text class="ink" x="276" y="312" text-anchor="middle" font-size="13">100</text>
  <rect class="accent" x="328" y="208" width="56" height="84"/>
  <text class="muted" x="356" y="198" text-anchor="middle" font-size="12">2</text>
  <text class="ink" x="356" y="312" text-anchor="middle" font-size="13">150</text>
  <rect class="accent" x="408" y="208" width="56" height="84"/>
  <text class="muted" x="436" y="198" text-anchor="middle" font-size="12">2</text>
  <text class="ink" x="436" y="312" text-anchor="middle" font-size="13">200</text>
  <rect class="accent" x="488" y="250" width="56" height="42"/>
  <text class="muted" x="516" y="240" text-anchor="middle" font-size="12">1</text>
  <text class="ink" x="516" y="312" text-anchor="middle" font-size="13">255</text>
  <text class="ink" x="332" y="344" text-anchor="middle" font-size="13">intensity</text>
  <text class="ink" x="20" y="170" text-anchor="middle" font-size="13" transform="rotate(-90 20 170)">count</text>
</svg>
