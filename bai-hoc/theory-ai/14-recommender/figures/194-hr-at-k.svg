<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="hrk-194-title">
  <title id="hrk-194-title">5 users, 3 hits, HR@3 = 3/5 = 0.6</title>
  <style>
