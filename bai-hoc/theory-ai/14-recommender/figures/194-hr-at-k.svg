  <rect class="box-ac" x="160" y="256" width="400" height="76" rx="4" stroke-width="1.5"/>
  <text id="hrk-194-result" class="ink" x="360" y="288" text-anchor="middle" font-size="16" font-weight="600" stroke="none">hits = 3 of 5 users</text>
  <text class="hi" x="360" y="314" text-anchor="middle" font-size="14" font-weight="600" stroke="none">HR@3 = 3/5 = 0.6</text>
