<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="mfsgd-169-title">
  <title id="mfsgd-169-title">MF prediction 3.98, error 0.02 from mu=3.5, biases, and p dot q</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .accent-soft { fill: #2F6FED; fill-opacity: 0.10; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .hi-soft { fill: #C45C0A; fill-opacity: 0.10; stroke: #C45C0A; }
    .card { fill: none; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    
  </style>
  <defs>
    <marker id="mfsgd-169-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" class="ink" stroke="none"/>
    </marker>
  </defs>

  <text id="mfsgd-169-heading" class="ink" x="360" y="26" text-anchor="middle" font-size="16" font-weight="600">hat r = 3.98,  e = 0.02</text>

  <rect class="accent-soft card" x="16" y="48" width="132" height="100" rx="8" stroke-width="1.5"/>
  <text class="accent" x="82" y="78" text-anchor="middle" font-size="13" font-weight="600" stroke="none">&#x03BC;</text>
  <text class="ink" x="82" y="110" text-anchor="middle" font-size="18" font-weight="600" stroke="none">3.5</text>

  <text class="ink" x="158" y="104" text-anchor="middle" font-size="18" stroke="none">+</text>

  <rect class="accent-soft card" x="174" y="48" width="132" height="100" rx="8" stroke-width="1.5"/>
  <text class="accent" x="240" y="78" text-anchor="middle" font-size="13" font-weight="600" stroke="none">b_u</text>
  <text class="ink" x="240" y="110" text-anchor="middle" font-size="18" font-weight="600" stroke="none">0.2</text>

  <text class="ink" x="316" y="104" text-anchor="middle" font-size="18" stroke="none">+</text>

  <rect class="accent-soft card" x="332" y="48" width="132" height="100" rx="8" stroke-width="1.5"/>
  <text class="accent" x="398" y="78" text-anchor="middle" font-size="13" font-weight="600" stroke="none">b_i</text>
  <text class="ink" x="398" y="110" text-anchor="middle" font-size="18" font-weight="600" stroke="none">-0.1</text>

  <text class="ink" x="474" y="104" text-anchor="middle" font-size="18" stroke="none">+</text>

  <rect class="accent-soft card" x="490" y="48" width="214" height="100" rx="8" stroke-width="1.5"/>
  <text class="accent" x="597" y="74" text-anchor="middle" font-size="13" font-weight="600" stroke="none">p_u &#x00B7; q_i</text>
  <text class="muted" x="597" y="96" text-anchor="middle" font-size="11" stroke="none">[0.5, 0.3] &#x00B7; [0.4, 0.6]</text>
  <text class="ink" x="597" y="126" text-anchor="middle" font-size="16" font-weight="600" stroke="none">0.20 + 0.18 = 0.38</text>

  <line class="ink" x1="360" y1="156" x2="360" y2="184" stroke-width="1.5" marker-end="url(#mfsgd-169-arrow)"/>

  <rect class="hi-soft card" x="160" y="190" width="400" height="76" rx="8" stroke-width="1.5"/>
  <text class="muted" x="360" y="216" text-anchor="middle" font-size="13" stroke="none">3.5 + 0.2 + (-0.1) + 0.38</text>
  <text class="hi" x="360" y="246" text-anchor="middle" font-size="18" font-weight="600" stroke="none">hat r_ui = 3.98</text>

  <rect class="accent-soft card" x="120" y="290" width="480" height="64" rx="8" stroke-width="1.5"/>
  <text class="ink" x="360" y="316" text-anchor="middle" font-size="14" stroke="none">r_ui = 4.0</text>
  <text class="hi" x="360" y="340" text-anchor="middle" font-size="16" font-weight="600" stroke="none">e_ui = 4.0 - 3.98 = 0.02</text>
