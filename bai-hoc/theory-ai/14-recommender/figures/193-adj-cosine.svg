<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="adjcos-193-title">
  <title id="adjcos-193-title">Adjusted cosine A,B = -1.0; every user A=+1, B=-1 vs mean</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .box { fill: none; stroke: #1A1A1A; }
    .box-ac { fill: #2F6FED; fill-opacity: 0.10; stroke: #2F6FED; }
    .box-hi { fill: #C45C0A; fill-opacity: 0.10; stroke: #C45C0A; }
    .box-soft { fill: none; stroke: #5C6570; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    
  </style>

  <text id="adjcos-193-heading" class="ink" x="360" y="28" text-anchor="middle" font-size="16" font-weight="600" stroke="none">Adjusted cosine(A, B) = -1.0</text>

  <text class="muted" x="80" y="64" text-anchor="middle" font-size="12" stroke="none">user</text>
  <text class="muted" x="220" y="64" text-anchor="middle" font-size="12" stroke="none">A vs mean</text>
  <text class="muted" x="360" y="64" text-anchor="middle" font-size="12" stroke="none">B vs mean</text>
  <text class="muted" x="500" y="64" text-anchor="middle" font-size="12" stroke="none">product</text>

  <rect class="box-ac" x="160" y="76" width="120" height="48" rx="4" stroke-width="1.5"/>
  <rect class="box-hi" x="300" y="76" width="120" height="48" rx="4" stroke-width="1.5"/>
  <rect class="box-soft" x="440" y="76" width="120" height="48" rx="4" stroke-width="1.5"/>
  <text class="ink" x="80" y="106" text-anchor="middle" font-size="14" font-weight="600" stroke="none">1</text>
  <text class="accent" x="220" y="106" text-anchor="middle" font-size="18" font-weight="700" stroke="none">+1</text>
  <text class="hi" x="360" y="106" text-anchor="middle" font-size="18" font-weight="700" stroke="none">-1</text>
  <text class="ink" x="500" y="106" text-anchor="middle" font-size="16" font-weight="600" stroke="none">-1</text>

  <rect class="box-ac" x="160" y="136" width="120" height="48" rx="4" stroke-width="1.5"/>
  <rect class="box-hi" x="300" y="136" width="120" height="48" rx="4" stroke-width="1.5"/>
  <rect class="box-soft" x="440" y="136" width="120" height="48" rx="4" stroke-width="1.5"/>
  <text class="ink" x="80" y="166" text-anchor="middle" font-size="14" font-weight="600" stroke="none">2</text>
  <text class="accent" x="220" y="166" text-anchor="middle" font-size="18" font-weight="700" stroke="none">+1</text>
  <text class="hi" x="360" y="166" text-anchor="middle" font-size="18" font-weight="700" stroke="none">-1</text>
  <text class="ink" x="500" y="166" text-anchor="middle" font-size="16" font-weight="600" stroke="none">-1</text>

  <rect class="box-ac" x="160" y="196" width="120" height="48" rx="4" stroke-width="1.5"/>
  <rect class="box-hi" x="300" y="196" width="120" height="48" rx="4" stroke-width="1.5"/>
  <rect class="box-soft" x="440" y="196" width="120" height="48" rx="4" stroke-width="1.5"/>
  <text class="ink" x="80" y="226" text-anchor="middle" font-size="14" font-weight="600" stroke="none">3</text>
  <text class="accent" x="220" y="226" text-anchor="middle" font-size="18" font-weight="700" stroke="none">+1</text>
  <text class="hi" x="360" y="226" text-anchor="middle" font-size="18" font-weight="700" stroke="none">-1</text>
  <text class="ink" x="500" y="226" text-anchor="middle" font-size="16" font-weight="600" stroke="none">-1</text>

  <rect class="box-hi" x="140" y="268" width="440" height="64" rx="4" stroke-width="1.5"/>
  <text id="adjcos-193-result" class="ink" x="360" y="296" text-anchor="middle" font-size="15" font-weight="600" stroke="none">num = -3, den = sqrt(3)*sqrt(3) = 3</text>
  <text class="hi" x="360" y="318" text-anchor="middle" font-size="14" font-weight="600" stroke="none">sim_adj(A, B) = -3/3 = -1.0</text>
</svg>
