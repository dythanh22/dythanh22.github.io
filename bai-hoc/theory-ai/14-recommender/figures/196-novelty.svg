<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="nov-196-title">
  <title id="nov-196-title">p=0.5, 0.1, 0.01 map to novelty 1.0, 3.32, 6.64</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .box-ac { fill: #2F6FED; fill-opacity: 0.10; stroke: #2F6FED; }
    .box-hi { fill: #C45C0A; fill-opacity: 0.10; stroke: #C45C0A; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .box-ac { fill: #8AB4F8; fill-opacity: 0.16; stroke: #8AB4F8; }
      .box-hi { fill: #F9AB00; fill-opacity: 0.16; stroke: #F9AB00; }
    }
  </style>

  <text id="nov-196-heading" class="ink" x="360" y="28" text-anchor="middle" font-size="16" font-weight="600" stroke="none">novelty(i) = -log2 p(i)</text>

  <line class="muted" x1="80" y1="300" x2="640" y2="300" stroke-width="1.25" fill="none"/>

  <rect id="nov-196-a" class="accent" x="140" y="267" width="88" height="33" rx="3" stroke="none"/>
  <rect id="nov-196-b" class="accent" x="316" y="190" width="88" height="110" rx="3" stroke="none"/>
  <rect id="nov-196-c" class="hi" x="492" y="80" width="88" height="220" rx="3" stroke="none"/>

  <text class="ink" x="184" y="259" text-anchor="middle" font-size="13" font-weight="600" stroke="none">1.0</text>
  <text class="ink" x="360" y="182" text-anchor="middle" font-size="13" font-weight="600" stroke="none">3.32</text>
  <text class="hi" x="536" y="72" text-anchor="middle" font-size="13" font-weight="700" stroke="none">6.64</text>

  <text class="ink" x="184" y="322" text-anchor="middle" font-size="14" font-weight="600" stroke="none">A</text>
  <text class="ink" x="360" y="322" text-anchor="middle" font-size="14" font-weight="600" stroke="none">B</text>
  <text class="ink" x="536" y="322" text-anchor="middle" font-size="14" font-weight="600" stroke="none">C</text>

  <text class="muted" x="184" y="342" text-anchor="middle" font-size="12" stroke="none">p = 0.5</text>
  <text class="muted" x="360" y="342" text-anchor="middle" font-size="12" stroke="none">p = 0.1</text>
  <text class="muted" x="536" y="342" text-anchor="middle" font-size="12" stroke="none">p = 0.01</text>

  <rect class="box-ac" x="88" y="48" width="200" height="28" rx="4" stroke-width="1"/>
  <text class="muted" x="188" y="67" text-anchor="middle" font-size="12" stroke="none">less popular, higher novelty</text>
</svg>
