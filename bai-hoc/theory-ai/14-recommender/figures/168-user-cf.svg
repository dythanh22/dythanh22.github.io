<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="usercf-168-title">
  <title id="usercf-168-title">User-based CF: (0.9*5 + 0.7*4 + 0.5*3)/2.1 = 8.8/2.1 ~ 4.19</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .accent-soft { fill: #2F6FED; fill-opacity: 0.10; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .hi-soft { fill: #C45C0A; fill-opacity: 0.10; stroke: #C45C0A; }
    .card { fill: none; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    
  </style>
  <defs>
    <marker id="usercf-168-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" class="ink" stroke="none"/>
    </marker>
  </defs>

  <text id="usercf-168-heading" class="ink" x="360" y="26" text-anchor="middle" font-size="16" font-weight="600">Predict User A rating for Movie X</text>

  <rect class="accent-soft card" x="24" y="48" width="200" height="132" rx="8" stroke-width="1.5"/>
  <text class="accent" x="124" y="76" text-anchor="middle" font-size="13" font-weight="600" stroke="none">User B</text>
  <text class="ink" x="124" y="108" text-anchor="middle" font-size="14" stroke="none">sim = 0.9</text>
  <text class="ink" x="124" y="140" text-anchor="middle" font-size="14" stroke="none">r = 5</text>
  <text class="muted" x="124" y="164" text-anchor="middle" font-size="12" stroke="none">0.9 &#x00D7; 5 = 4.5</text>

  <rect class="accent-soft card" x="260" y="48" width="200" height="132" rx="8" stroke-width="1.5"/>
  <text class="accent" x="360" y="76" text-anchor="middle" font-size="13" font-weight="600" stroke="none">User C</text>
  <text class="ink" x="360" y="108" text-anchor="middle" font-size="14" stroke="none">sim = 0.7</text>
  <text class="ink" x="360" y="140" text-anchor="middle" font-size="14" stroke="none">r = 4</text>
  <text class="muted" x="360" y="164" text-anchor="middle" font-size="12" stroke="none">0.7 &#x00D7; 4 = 2.8</text>

  <rect class="accent-soft card" x="496" y="48" width="200" height="132" rx="8" stroke-width="1.5"/>
  <text class="accent" x="596" y="76" text-anchor="middle" font-size="13" font-weight="600" stroke="none">User D</text>
  <text class="ink" x="596" y="108" text-anchor="middle" font-size="14" stroke="none">sim = 0.5</text>
  <text class="ink" x="596" y="140" text-anchor="middle" font-size="14" stroke="none">r = 3</text>
  <text class="muted" x="596" y="164" text-anchor="middle" font-size="12" stroke="none">0.5 &#x00D7; 3 = 1.5</text>

  <line class="ink" x1="124" y1="188" x2="200" y2="218" stroke-width="1.5" marker-end="url(#usercf-168-arrow)"/>
  <line class="ink" x1="360" y1="188" x2="360" y2="218" stroke-width="1.5" marker-end="url(#usercf-168-arrow)"/>
  <line class="ink" x1="596" y1="188" x2="520" y2="218" stroke-width="1.5" marker-end="url(#usercf-168-arrow)"/>

  <rect class="hi-soft card" x="160" y="224" width="400" height="88" rx="8" stroke-width="1.5"/>
  <text class="hi" x="360" y="252" text-anchor="middle" font-size="13" font-weight="600" stroke="none">Weighted average</text>
  <text class="ink" x="360" y="280" text-anchor="middle" font-size="15" stroke="none">(4.5 + 2.8 + 1.5) / (0.9 + 0.7 + 0.5)</text>
  <text class="muted" x="360" y="300" text-anchor="middle" font-size="13" stroke="none">8.8 / 2.1</text>

  <text class="hi" x="360" y="344" text-anchor="middle" font-size="16" font-weight="600" stroke="none">hat r(A, X) &#x2248; 4.19</text>
</svg>
