  <text class="hi" x="221" y="212" text-anchor="middle" font-size="11" stroke="none">18.1</text>
  <text class="accent" x="280" y="236" text-anchor="middle" font-size="12" stroke="none">mean = 6.4</text>

  <text class="muted" x="500" y="236" text-anchor="middle" font-size="12">[1.9, 2, ..., 9, 18.1]</text>
