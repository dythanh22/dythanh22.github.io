<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="win-199-title">
  <title id="win-199-title">10% winsorize [1..9, 100] to [1.9, 2..9, 18.1]; mean 14.5 to 6.4</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .axis { fill: none; stroke: #1A1A1A; }
    .cap { fill: none; stroke: #2F6FED; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    
  </style>

  <text id="win-199-heading" class="ink" x="360" y="28" text-anchor="middle" font-size="16" font-weight="600">10% winsorize: 1 &#x2192; 1.9, 100 &#x2192; 18.1</text>

  <!-- map v: 0..100 -> x = 120 + v*5.6 -->
  <text class="muted" x="16" y="96" text-anchor="start" font-size="12">original</text>
  <line class="axis" x1="120" y1="92" x2="680" y2="92" stroke-width="1.5"/>
  <line class="cap" x1="130.6" y1="60" x2="130.6" y2="204" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line class="cap" x1="221.4" y1="60" x2="221.4" y2="204" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="accent" x="131" y="52" text-anchor="middle" font-size="12" stroke="none">L = 1.9</text>
  <text class="accent" x="221" y="76" text-anchor="middle" font-size="12" stroke="none">U = 18.1</text>

  <circle class="hi" cx="125.6" cy="92" r="5" data-allow-overlap="1"/>
  <circle class="ink" cx="131.2" cy="92" r="5" data-allow-overlap="1"/>
  <circle class="ink" cx="136.8" cy="92" r="5" data-allow-overlap="1"/>
  <circle class="ink" cx="142.4" cy="92" r="5" data-allow-overlap="1"/>
  <circle class="ink" cx="148.0" cy="92" r="5" data-allow-overlap="1"/>
  <circle class="ink" cx="153.6" cy="92" r="5" data-allow-overlap="1"/>
  <circle class="ink" cx="159.2" cy="92" r="5" data-allow-overlap="1"/>
