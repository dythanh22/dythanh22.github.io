  <circle class="ink" cx="170.4" cy="92" r="5" data-allow-overlap="1"/>
  <circle class="hi" cx="680" cy="92" r="6" data-allow-overlap="1"/>
  <text class="muted" x="148" y="116" text-anchor="middle" font-size="11">1..9</text>
  <text class="hi" x="680" y="76" text-anchor="middle" font-size="12" stroke="none">100</text>
  <text class="hi" x="280" y="116" text-anchor="middle" font-size="12" stroke="none">mean = 14.5</text>

  <line class="hi" x1="126" y1="100" x2="131" y2="168" stroke-width="1.25" fill="none"/>
  <line class="hi" x1="668" y1="108" x2="232" y2="168" stroke-width="1.25" fill="none"/>

  <text class="muted" x="16" y="192" text-anchor="start" font-size="12">winsorized</text>
  <line class="axis" x1="120" y1="188" x2="680" y2="188" stroke-width="1.5"/>
  <circle class="hi" cx="130.6" cy="188" r="5" data-allow-overlap="1"/>
  <circle class="ink" cx="131.2" cy="188" r="5" data-allow-overlap="1"/>
  <circle class="ink" cx="136.8" cy="188" r="5" data-allow-overlap="1"/>
  <circle class="ink" cx="142.4" cy="188" r="5" data-allow-overlap="1"/>
