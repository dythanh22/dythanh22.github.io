<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="kfold-85-title">
  <title id="kfold-85-title">K-Fold indices N=10 k=5 fold_size=2</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .cell { fill: #E8F0FE; stroke: #2F6FED; }
    .vcell { fill: #FCE8D5; stroke: #C45C0A; }
    .box { fill: none; stroke: #1A1A1A; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    
  </style>
  <text id="kfold-85-heading" class="ink" x="360" y="28" text-anchor="middle" font-size="15" font-weight="600">K-Fold: N=10, k=5, fold_size=2</text>

  <!-- Five fold boxes: w=96, gutter=16, total=544, x0=88 -->
  <rect class="vcell" x="88" y="52" width="96" height="72" rx="4" stroke-width="1.5"/>
  <text class="hi" x="136" y="74" text-anchor="middle" font-size="12" font-weight="600" stroke="none">Fold 0</text>
  <text class="ink" x="136" y="100" text-anchor="middle" font-size="14" font-weight="600">[0, 1]</text>

  <rect class="cell" x="200" y="52" width="96" height="72" rx="4" stroke-width="1.5"/>
  <text class="accent" x="248" y="74" text-anchor="middle" font-size="12" font-weight="600" stroke="none">Fold 1</text>
  <text class="ink" x="248" y="100" text-anchor="middle" font-size="14" font-weight="600">[2, 3]</text>

  <rect class="cell" x="312" y="52" width="96" height="72" rx="4" stroke-width="1.5"/>
  <text class="accent" x="360" y="74" text-anchor="middle" font-size="12" font-weight="600" stroke="none">Fold 2</text>
  <text class="ink" x="360" y="100" text-anchor="middle" font-size="14" font-weight="600">[4, 5]</text>

  <rect class="cell" x="424" y="52" width="96" height="72" rx="4" stroke-width="1.5"/>
  <text class="accent" x="472" y="74" text-anchor="middle" font-size="12" font-weight="600" stroke="none">Fold 3</text>
  <text class="ink" x="472" y="100" text-anchor="middle" font-size="14" font-weight="600">[6, 7]</text>

  <rect class="cell" x="536" y="52" width="96" height="72" rx="4" stroke-width="1.5"/>
  <text class="accent" x="584" y="74" text-anchor="middle" font-size="12" font-weight="600" stroke="none">Fold 4</text>
  <text class="ink" x="584" y="100" text-anchor="middle" font-size="14" font-weight="600">[8, 9]</text>

  <text class="muted" x="360" y="154" text-anchor="middle" font-size="12">Iteration 1: Fold 0 = validation, Folds 1-4 = train</text>

  <rect class="vcell" x="88" y="172" width="168" height="56" rx="4" stroke-width="1.5"/>
  <text class="hi" x="172" y="194" text-anchor="middle" font-size="11" font-weight="600" stroke="none">validation</text>
  <text class="ink" x="172" y="214" text-anchor="middle" font-size="14" font-weight="600">[0, 1]</text>

  <rect class="cell" x="280" y="172" width="352" height="56" rx="4" stroke-width="1.5"/>
  <text class="accent" x="456" y="194" text-anchor="middle" font-size="11" font-weight="600" stroke="none">training</text>
  <text class="ink" x="456" y="214" text-anchor="middle" font-size="14" font-weight="600">[2, 3, 4, 5, 6, 7, 8, 9]</text>

  <rect class="box" x="160" y="252" width="400" height="56" rx="4" stroke-width="1.5"/>
  <text class="ink" x="360" y="276" text-anchor="middle" font-size="13">CV_score = (0.85+0.82+0.88+0.79+0.86) / 5</text>
  <text class="hi" x="360" y="296" text-anchor="middle" font-size="14" font-weight="700" stroke="none">CV_score = 0.84</text>
</svg>
