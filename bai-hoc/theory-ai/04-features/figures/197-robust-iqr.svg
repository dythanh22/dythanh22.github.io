<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="robust-197-title">
  <title id="robust-197-title">Robust scale: Q2 = 55, IQR = 55, outlier 1000</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .axis { fill: none; stroke: #1A1A1A; }
    .box-fill { fill: #2F6FED; fill-opacity: 0.12; stroke: #2F6FED; }
    .fill-none { fill: none; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    
  </style>
  <text id="robust-197-heading" class="ink" x="320" y="26" text-anchor="middle" font-size="15" font-weight="600">Robust scale: Q2 = 55, IQR = 55, outlier 1000</text>
  <!-- bulk 10..90: x = 48 + (v-10)*4.4 -&gt; 48..400; break; 1000 at x=552 -->
  <line class="axis" x1="40" y1="210" x2="400" y2="210" stroke-width="1.5"/>
  <line class="axis" x1="432" y1="210" x2="580" y2="210" stroke-width="1.5"/>
  <!-- axis break marks -->
  <line class="ink" x1="396" y1="202" x2="408" y2="218" stroke-width="1.25"/>
  <line class="ink" x1="404" y1="202" x2="416" y2="218" stroke-width="1.25"/>
  <line class="ink" x1="424" y1="202" x2="436" y2="218" stroke-width="1.25"/>
  <text class="muted" x="48" y="232" text-anchor="middle" font-size="11">10</text>
  <text class="muted" x="125" y="232" text-anchor="middle" font-size="11">27.5</text>
  <text class="muted" x="246" y="232" text-anchor="middle" font-size="11">55</text>
  <text class="muted" x="367" y="232" text-anchor="middle" font-size="11">82.5</text>
  <text class="muted" x="414" y="232" text-anchor="middle" font-size="11">90</text>
  <text class="hi" x="552" y="232" text-anchor="middle" font-size="11" stroke="none">1000</text>
  <!-- bulk points 10,20,...,90 at y=210; x=48+(v-10)*4.4 -->
  <circle class="accent" cx="48" cy="210" r="4" data-allow-overlap="1"/>
  <circle class="accent" cx="92" cy="210" r="4" data-allow-overlap="1"/>
  <circle class="accent" cx="136" cy="210" r="4" data-allow-overlap="1"/>
  <circle class="accent" cx="180" cy="210" r="4" data-allow-overlap="1"/>
  <circle class="accent" cx="224" cy="210" r="4" data-allow-overlap="1"/>
  <circle class="accent" cx="268" cy="210" r="4" data-allow-overlap="1"/>
  <circle class="accent" cx="312" cy="210" r="4" data-allow-overlap="1"/>
  <circle class="accent" cx="356" cy="210" r="4" data-allow-overlap="1"/>
  <circle class="accent" cx="400" cy="210" r="4" data-allow-overlap="1"/>
  <circle class="hi" cx="552" cy="210" r="6" data-allow-overlap="1"/>
  <!-- box Q1=27.5 (x=125) to Q3=82.5 (x=367), height 48 at y=106 -->
  <rect class="box-fill" x="125" y="106" width="242" height="48" rx="2" stroke-width="2"/>
  <!-- median Q2=55 at x=246 -->
  <line class="hi fill-none" x1="246" y1="106" x2="246" y2="154" stroke-width="2.5"/>
  <!-- whisker 10 to Q1 -->
  <line class="accent fill-none" x1="48" y1="130" x2="125" y2="130" stroke-width="2"/>
  <line class="accent fill-none" x1="48" y1="118" x2="48" y2="142" stroke-width="2"/>
  <!-- whisker Q3 to 90 -->
  <line class="accent fill-none" x1="367" y1="130" x2="400" y2="130" stroke-width="2"/>
  <line class="accent fill-none" x1="400" y1="118" x2="400" y2="142" stroke-width="2"/>
  <text class="accent" x="125" y="92" text-anchor="middle" font-size="12" stroke="none">Q1 = 27.5</text>
  <text class="hi" x="246" y="92" text-anchor="middle" font-size="12" stroke="none">Q2 = 55</text>
  <text class="accent" x="367" y="92" text-anchor="middle" font-size="12" stroke="none">Q3 = 82.5</text>
  <!-- IQR brace -->
  <line class="hi fill-none" x1="125" y1="168" x2="367" y2="168" stroke-width="1.5"/>
  <line class="hi fill-none" x1="125" y1="162" x2="125" y2="174" stroke-width="1.5"/>
  <line class="hi fill-none" x1="367" y1="162" x2="367" y2="174" stroke-width="1.5"/>
  <text class="hi" x="246" y="190" text-anchor="middle" font-size="13" stroke="none">IQR = 55</text>
  <!-- outlier annotation -->
  <text class="hi" x="552" y="160" text-anchor="middle" font-size="12" stroke="none">outlier</text>
  <text class="hi" x="552" y="178" text-anchor="middle" font-size="12" stroke="none">scaled = 17.18</text>
  <text class="muted" x="320" y="262" text-anchor="middle" font-size="12">Data: [10, 20, ..., 90, 1000]; (1000 - 55) / 55 = 17.18</text>
  <text class="ink" x="320" y="286" text-anchor="middle" font-size="12">value</text>
</svg>
