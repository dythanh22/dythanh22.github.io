<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="zscore-28-title">
  <title id="zscore-28-title">z-scores of [10, 20, 30, 40, 50], mean = 30</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .axis { fill: none; stroke: #1A1A1A; }
    .mean { fill: none; stroke: #C45C0A; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .axis { stroke: #E8EAED; }
      .mean { stroke: #F9AB00; }
    }
  </style>
  <text id="zscore-28-heading" class="ink" x="320" y="28" text-anchor="middle" font-size="15" font-weight="600">z-score of [10, 20, 30, 40, 50], mean = 30</text>
  <!-- x = 80 + (v-10)*12 ; 10,20,30,40,50 -> 80,200,320,440,560 -->
  <text class="muted" x="40" y="100" text-anchor="middle" font-size="11">x</text>
  <line class="axis" x1="64" y1="96" x2="576" y2="96" stroke-width="1.5"/>
  <line class="mean" x1="320" y1="48" x2="320" y2="200" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="hi" x="388" y="62" text-anchor="middle" font-size="12" stroke="none">mean = 30</text>
  <circle class="accent" cx="80" cy="96" r="6" data-allow-overlap="1"/>
  <circle class="accent" cx="200" cy="96" r="6" data-allow-overlap="1"/>
  <circle class="hi" cx="320" cy="96" r="6" data-allow-overlap="1"/>
  <circle class="accent" cx="440" cy="96" r="6" data-allow-overlap="1"/>
  <circle class="accent" cx="560" cy="96" r="6" data-allow-overlap="1"/>
  <text class="ink" x="80" y="80" text-anchor="middle" font-size="12" stroke="none">10</text>
  <text class="ink" x="200" y="80" text-anchor="middle" font-size="12" stroke="none">20</text>
  <text class="hi" x="320" y="80" text-anchor="middle" font-size="12" stroke="none">30</text>
  <text class="ink" x="440" y="80" text-anchor="middle" font-size="12" stroke="none">40</text>
  <text class="ink" x="560" y="80" text-anchor="middle" font-size="12" stroke="none">50</text>
  <text class="muted" x="40" y="204" text-anchor="middle" font-size="11">z</text>
  <line class="axis" x1="64" y1="200" x2="576" y2="200" stroke-width="1.5"/>
  <circle class="accent" cx="80" cy="200" r="6" data-allow-overlap="1"/>
  <circle class="accent" cx="200" cy="200" r="6" data-allow-overlap="1"/>
  <circle class="hi" cx="320" cy="200" r="6" data-allow-overlap="1"/>
  <circle class="accent" cx="440" cy="200" r="6" data-allow-overlap="1"/>
  <circle class="accent" cx="560" cy="200" r="6" data-allow-overlap="1"/>
  <text class="ink" x="80" y="228" text-anchor="middle" font-size="12" stroke="none">-1.26</text>
  <text class="ink" x="200" y="228" text-anchor="middle" font-size="12" stroke="none">-0.63</text>
  <text class="hi" x="320" y="228" text-anchor="middle" font-size="12" stroke="none">0</text>
  <text class="ink" x="440" y="228" text-anchor="middle" font-size="12" stroke="none">0.63</text>
  <text class="ink" x="560" y="228" text-anchor="middle" font-size="12" stroke="none">1.26</text>
  <text class="muted" x="320" y="260" text-anchor="middle" font-size="12">s &#x2248; 15.81; z = (x - 30) / 15.81</text>
</svg>
