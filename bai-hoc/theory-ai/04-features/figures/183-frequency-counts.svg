<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-labelledby="freqenc-183-title">
  <title id="freqenc-183-title">City counts NY=4, LA=3, Chicago=2, Houston=1, n=10</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .nofill { fill: none; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    
  </style>

  <text id="freqenc-183-heading" class="ink" x="340" y="28" text-anchor="middle" font-size="15" font-weight="600">City counts, n = 10</text>

  <line class="ink nofill" x1="72" y1="320" x2="640" y2="320" stroke-width="1.25"/>
  <line class="ink nofill" x1="72" y1="56" x2="72" y2="320" stroke-width="1.25"/>

  <line class="muted nofill" x1="72" y1="80" x2="640" y2="80" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  <line class="muted nofill" x1="72" y1="140" x2="640" y2="140" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  <line class="muted nofill" x1="72" y1="200" x2="640" y2="200" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  <line class="muted nofill" x1="72" y1="260" x2="640" y2="260" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  <text class="muted" x="60" y="84" text-anchor="end" font-size="12">4</text>
  <text class="muted" x="60" y="144" text-anchor="end" font-size="12">3</text>
  <text class="muted" x="60" y="204" text-anchor="end" font-size="12">2</text>
  <text class="muted" x="60" y="264" text-anchor="end" font-size="12">1</text>
  <text class="muted" x="60" y="324" text-anchor="end" font-size="12">0</text>
  <text class="ink" x="20" y="190" text-anchor="middle" font-size="13" transform="rotate(-90 20 190)">count(c)</text>

  <!-- NY count=4, height=240, top=80 -->
  <rect class="hi" x="110" y="80" width="90" height="240" rx="2" stroke="none"/>
  <text class="ink" x="155" y="68" text-anchor="middle" font-size="14" font-weight="700">4</text>
  <text class="ink" x="155" y="344" text-anchor="middle" font-size="13">New York</text>
  <text class="muted" x="155" y="362" text-anchor="middle" font-size="11">4/10 = 0.4</text>

  <!-- LA count=3, height=180, top=140 -->
  <rect class="accent" x="250" y="140" width="90" height="180" rx="2" stroke="none"/>
  <text class="ink" x="295" y="128" text-anchor="middle" font-size="14" font-weight="700">3</text>
  <text class="ink" x="295" y="344" text-anchor="middle" font-size="13">Los Angeles</text>
  <text class="muted" x="295" y="362" text-anchor="middle" font-size="11">3/10 = 0.3</text>

  <!-- Chicago count=2, height=120, top=200 -->
  <rect class="accent" x="390" y="200" width="90" height="120" rx="2" stroke="none"/>
  <text class="ink" x="435" y="188" text-anchor="middle" font-size="14" font-weight="700">2</text>
  <text class="ink" x="435" y="344" text-anchor="middle" font-size="13">Chicago</text>
  <text class="muted" x="435" y="362" text-anchor="middle" font-size="11">2/10 = 0.2</text>

  <!-- Houston count=1, height=60, top=260 -->
  <rect class="accent" x="530" y="260" width="90" height="60" rx="2" stroke="none"/>
  <text class="ink" x="575" y="248" text-anchor="middle" font-size="14" font-weight="700">1</text>
  <text class="ink" x="575" y="344" text-anchor="middle" font-size="13">Houston</text>
  <text class="muted" x="575" y="362" text-anchor="middle" font-size="11">1/10 = 0.1</text>

  <text class="muted" x="340" y="388" text-anchor="middle" font-size="12">encoded count sequence [4, 3, 2, 4, 1, 3, 4, 2, 4, 3]</text>
</svg>
