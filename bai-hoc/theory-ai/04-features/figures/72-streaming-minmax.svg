  <text class="muted" x="486" y="58" text-anchor="middle" font-size="12">9</text>
  <text class="muted" x="566" y="58" text-anchor="middle" font-size="12">3</text>
  <text class="muted" x="70" y="98" text-anchor="middle" font-size="12">x</text>
  <rect class="cell" x="130" y="74" width="72" height="36" stroke-width="1.2"/>
