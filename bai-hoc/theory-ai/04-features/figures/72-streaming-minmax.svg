  <text class="hi" x="566" y="194" text-anchor="middle" font-size="14" font-weight="600" stroke="none">9</text>
  <text class="ink" x="320" y="242" text-anchor="middle" font-size="13">final: min = 1, max = 9</text>
  <text class="muted" x="320" y="268" text-anchor="middle" font-size="12">Blue cells: min update; amber cells: max update</text>
  <text class="muted" x="320" y="290" text-anchor="middle" font-size="12">O(1) time and O(1) space per element</text>
