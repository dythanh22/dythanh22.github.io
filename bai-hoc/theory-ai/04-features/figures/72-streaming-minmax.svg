  <text class="accent" x="246" y="146" text-anchor="middle" font-size="14" font-weight="600" stroke="none">2</text>
  <text class="ink" x="326" y="146" text-anchor="middle" font-size="14">2</text>
  <text class="accent" x="406" y="146" text-anchor="middle" font-size="14" font-weight="600" stroke="none">1</text>
