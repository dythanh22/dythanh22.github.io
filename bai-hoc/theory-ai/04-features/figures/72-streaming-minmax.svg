<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" role="img" aria-labelledby="stream-72-title">
  <title id="stream-72-title">Streaming min/max on [5, 2, 8, 1, 9, 3]</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .cell { fill: #FFFFFF; stroke: #1A1A1A; }
    .upd { fill: #E8F0FE; stroke: #2F6FED; }
