  <text class="ink" x="326" y="98" text-anchor="middle" font-size="14">8</text>
  <text class="ink" x="406" y="98" text-anchor="middle" font-size="14">1</text>
  <text class="ink" x="486" y="98" text-anchor="middle" font-size="14">9</text>
  <text class="ink" x="566" y="98" text-anchor="middle" font-size="14">3</text>
