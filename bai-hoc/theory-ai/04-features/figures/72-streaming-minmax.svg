  <rect class="cell" x="210" y="170" width="72" height="36" stroke-width="1.2"/>
  <rect class="upd-hi" x="290" y="170" width="72" height="36" stroke-width="1.5"/>
  <rect class="cell" x="370" y="170" width="72" height="36" stroke-width="1.2"/>
  <rect class="upd-hi" x="450" y="170" width="72" height="36" stroke-width="1.5"/>
  <rect class="final" x="530" y="170" width="72" height="36" stroke-width="1.5"/>
  <text class="ink" x="166" y="194" text-anchor="middle" font-size="14">5</text>
  <text class="ink" x="246" y="194" text-anchor="middle" font-size="14">5</text>
  <text class="hi" x="326" y="194" text-anchor="middle" font-size="14" font-weight="600" stroke="none">8</text>
  <text class="ink" x="406" y="194" text-anchor="middle" font-size="14">8</text>
