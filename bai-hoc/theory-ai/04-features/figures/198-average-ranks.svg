<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="rank-198-title">
  <title id="rank-198-title">Average ranks: [100, 200, 200, 300, 400] to [1, 2.5, 2.5, 4, 5]</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .box { fill: none; stroke: #2F6FED; }
    .box-hi { fill: none; stroke: #C45C0A; }
    .axis { fill: none; stroke: #1A1A1A; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    
  </style>

  <text id="rank-198-heading" class="ink" x="320" y="28" text-anchor="middle" font-size="16" font-weight="600">Average rank: ties share 2.5, skip 3</text>

  <!-- values row -->
  <text class="muted" x="40" y="88" text-anchor="start" font-size="12">value</text>
  <rect class="box" x="96" y="64" width="72" height="40" rx="4" stroke-width="1.5"/>
  <text class="ink" x="132" y="90" text-anchor="middle" font-size="15">100</text>
  <rect class="box-hi" x="192" y="64" width="72" height="40" rx="4" stroke-width="1.75"/>
  <text class="hi" x="228" y="90" text-anchor="middle" font-size="15" stroke="none">200</text>
  <rect class="box-hi" x="288" y="64" width="72" height="40" rx="4" stroke-width="1.75"/>
  <text class="hi" x="324" y="90" text-anchor="middle" font-size="15" stroke="none">200</text>
  <rect class="box" x="384" y="64" width="72" height="40" rx="4" stroke-width="1.5"/>
  <text class="ink" x="420" y="90" text-anchor="middle" font-size="15">300</text>
  <rect class="box" x="480" y="64" width="72" height="40" rx="4" stroke-width="1.5"/>
  <text class="ink" x="516" y="90" text-anchor="middle" font-size="15">400</text>

  <!-- arrows -->
  <line class="muted" x1="132" y1="112" x2="132" y2="148" stroke-width="1.25" fill="none"/>
  <line class="hi" x1="228" y1="112" x2="276" y2="148" stroke-width="1.25" fill="none"/>
  <line class="hi" x1="324" y1="112" x2="276" y2="148" stroke-width="1.25" fill="none"/>
  <line class="muted" x1="420" y1="112" x2="420" y2="148" stroke-width="1.25" fill="none"/>
  <line class="muted" x1="516" y1="112" x2="516" y2="148" stroke-width="1.25" fill="none"/>

  <!-- rank axis 1..5 -->
  <line class="axis" x1="96" y1="168" x2="552" y2="168" stroke-width="1.5"/>
  <text class="muted" x="40" y="172" text-anchor="start" font-size="12">rank</text>

  <circle class="accent" cx="132" cy="168" r="6" data-allow-overlap="1"/>
  <text class="accent" x="132" y="196" text-anchor="middle" font-size="14" stroke="none">1</text>

  <circle class="hi" cx="276" cy="168" r="7" data-allow-overlap="1"/>
  <text class="hi" x="276" y="196" text-anchor="middle" font-size="14" font-weight="600" stroke="none">2.5</text>

  <circle class="muted" cx="324" cy="168" r="3.5" opacity="0.55" data-allow-overlap="1"/>
  <text class="muted" x="324" y="196" text-anchor="middle" font-size="12">3</text>

  <circle class="accent" cx="420" cy="168" r="6" data-allow-overlap="1"/>
  <text class="accent" x="420" y="196" text-anchor="middle" font-size="14" stroke="none">4</text>

  <circle class="accent" cx="516" cy="168" r="6" data-allow-overlap="1"/>
  <text class="accent" x="516" y="196" text-anchor="middle" font-size="14" stroke="none">5</text>

  <text class="muted" x="320" y="236" text-anchor="middle" font-size="12">Two 200s share ranks 2 and 3; average = 2.5</text>
  <text class="ink" x="320" y="260" text-anchor="middle" font-size="13">[100, 200, 200, 300, 400] &#x2192; [1, 2.5, 2.5, 4, 5]</text>
</svg>
