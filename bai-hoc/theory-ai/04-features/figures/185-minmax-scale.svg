<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="minmax-185-title">
  <title id="minmax-185-title">Min-max scale [10, 20, 30, 40, 50] to [0, 1]</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .axis { fill: none; stroke: #1A1A1A; }
    .dash { fill: none; stroke: #2F6FED; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .axis { stroke: #E8EAED; }
      .dash { stroke: #8AB4F8; }
    }
  </style>
  <text id="minmax-185-heading" class="ink" x="320" y="28" text-anchor="middle" font-size="15" font-weight="600">Min-max scale: [10, 20, 30, 40, 50] to [0, 1]</text>
  <!-- x = 80 + (v-10)*12 -->
  <text class="muted" x="44" y="96" text-anchor="middle" font-size="11">x</text>
  <line class="axis" x1="64" y1="92" x2="576" y2="92" stroke-width="1.5"/>
  <circle class="hi" cx="80" cy="92" r="6" data-allow-overlap="1"/>
  <circle class="accent" cx="200" cy="92" r="6" data-allow-overlap="1"/>
  <circle class="accent" cx="320" cy="92" r="6" data-allow-overlap="1"/>
  <circle class="accent" cx="440" cy="92" r="6" data-allow-overlap="1"/>
  <circle class="hi" cx="560" cy="92" r="6" data-allow-overlap="1"/>
  <text class="hi" x="80" y="76" text-anchor="middle" font-size="12" stroke="none">10</text>
  <text class="ink" x="200" y="76" text-anchor="middle" font-size="12" stroke="none">20</text>
  <text class="ink" x="320" y="76" text-anchor="middle" font-size="12" stroke="none">30</text>
  <text class="ink" x="440" y="76" text-anchor="middle" font-size="12" stroke="none">40</text>
  <text class="hi" x="560" y="76" text-anchor="middle" font-size="12" stroke="none">50</text>
  <text class="muted" x="80" y="56" text-anchor="middle" font-size="11">min</text>
  <text class="muted" x="560" y="56" text-anchor="middle" font-size="11">max</text>
  <line class="dash" x1="80" y1="102" x2="80" y2="178" stroke-width="1.25" stroke-dasharray="5 4"/>
  <line class="dash" x1="200" y1="102" x2="200" y2="178" stroke-width="1.25" stroke-dasharray="5 4"/>
  <line class="dash" x1="320" y1="102" x2="320" y2="178" stroke-width="1.25" stroke-dasharray="5 4"/>
  <line class="dash" x1="440" y1="102" x2="440" y2="178" stroke-width="1.25" stroke-dasharray="5 4"/>
  <line class="dash" x1="560" y1="102" x2="560" y2="178" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text class="muted" x="44" y="192" text-anchor="middle" font-size="11">x'</text>
  <line class="axis" x1="64" y1="188" x2="576" y2="188" stroke-width="1.5"/>
  <circle class="hi" cx="80" cy="188" r="6" data-allow-overlap="1"/>
  <circle class="accent" cx="200" cy="188" r="6" data-allow-overlap="1"/>
  <circle class="accent" cx="320" cy="188" r="6" data-allow-overlap="1"/>
  <circle class="accent" cx="440" cy="188" r="6" data-allow-overlap="1"/>
  <circle class="hi" cx="560" cy="188" r="6" data-allow-overlap="1"/>
  <text class="hi" x="80" y="216" text-anchor="middle" font-size="12" stroke="none">0.0</text>
  <text class="ink" x="200" y="216" text-anchor="middle" font-size="12" stroke="none">0.25</text>
  <text class="ink" x="320" y="216" text-anchor="middle" font-size="12" stroke="none">0.5</text>
  <text class="ink" x="440" y="216" text-anchor="middle" font-size="12" stroke="none">0.75</text>
  <text class="hi" x="560" y="216" text-anchor="middle" font-size="12" stroke="none">1.0</text>
  <text class="ink" x="320" y="252" text-anchor="middle" font-size="13">x' = (x - 10) / 40</text>
</svg>
