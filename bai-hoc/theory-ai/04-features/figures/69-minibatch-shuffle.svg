<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="mbatch-69-title">
  <title id="mbatch-69-title">Index shuffle then mini-batches of B=100</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .cell { fill: #FFFFFF; stroke: #1A1A1A; }
    .pcell { fill: #E8F0FE; stroke: #2F6FED; }
    .bcell { fill: #FCE8D5; stroke: #C45C0A; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .cell { fill: #1E1E1E; stroke: #E8EAED; }
      .pcell { fill: #1A2A44; stroke: #8AB4F8; }
      .bcell { fill: #3D2A12; stroke: #F9AB00; }
    }
  </style>
  <text id="mbatch-69-heading" class="ink" x="360" y="28" text-anchor="middle" font-size="15" font-weight="600">N = 10000, B = 100 &#x2192; 100 iterations / epoch</text>

  <text class="muted" x="80" y="58" font-size="12">indices</text>
  <rect class="cell" x="80" y="68" width="48" height="36" rx="3" stroke-width="1.2"/>
  <rect class="cell" x="136" y="68" width="48" height="36" rx="3" stroke-width="1.2"/>
  <rect class="cell" x="192" y="68" width="48" height="36" rx="3" stroke-width="1.2"/>
  <text class="ink" x="104" y="92" text-anchor="middle" font-size="13" font-weight="600">0</text>
  <text class="ink" x="160" y="92" text-anchor="middle" font-size="13" font-weight="600">1</text>
  <text class="ink" x="216" y="92" text-anchor="middle" font-size="13" font-weight="600">2</text>
  <text class="muted" x="268" y="92" text-anchor="middle" font-size="16">...</text>
  <rect class="cell" x="292" y="68" width="64" height="36" rx="3" stroke-width="1.2"/>
  <text class="ink" x="324" y="92" text-anchor="middle" font-size="13" font-weight="600">9999</text>

  <line class="accent" x1="160" y1="112" x2="160" y2="138" stroke-width="2" fill="none"/>
  <polygon class="accent" points="154,138 160,150 166,138" stroke="none"/>
  <text class="muted" x="178" y="136" font-size="11">Fisher-Yates shuffle</text>

  <text class="muted" x="80" y="176" font-size="12">&#x03C0; = shuffled indices</text>
  <rect class="pcell" x="80" y="186" width="48" height="36" rx="3" stroke-width="1.5"/>
  <rect class="pcell" x="136" y="186" width="48" height="36" rx="3" stroke-width="1.5"/>
  <rect class="pcell" x="192" y="186" width="48" height="36" rx="3" stroke-width="1.5"/>
  <text class="accent" x="104" y="210" text-anchor="middle" font-size="13" font-weight="600" stroke="none">&#x03C0;1</text>
  <text class="accent" x="160" y="210" text-anchor="middle" font-size="13" font-weight="600" stroke="none">&#x03C0;2</text>
  <text class="accent" x="216" y="210" text-anchor="middle" font-size="13" font-weight="600" stroke="none">&#x03C0;3</text>
  <text class="muted" x="268" y="210" text-anchor="middle" font-size="16">...</text>
  <rect class="pcell" x="292" y="186" width="64" height="36" rx="3" stroke-width="1.5"/>
  <text class="accent" x="324" y="210" text-anchor="middle" font-size="13" font-weight="600" stroke="none">&#x03C0;N</text>

  <line class="hi" x1="160" y1="230" x2="160" y2="256" stroke-width="2" fill="none"/>
  <polygon class="hi" points="154,256 160,268 166,256" stroke="none"/>
  <text class="muted" x="178" y="254" font-size="11">chunk B = 100</text>

  <rect class="bcell" x="80" y="276" width="120" height="36" rx="3" stroke-width="1.5"/>
  <text class="hi" x="140" y="299" text-anchor="middle" font-size="12" font-weight="600" stroke="none">batch 0 (100)</text>
  <rect class="bcell" x="216" y="276" width="120" height="36" rx="3" stroke-width="1.5"/>
  <text class="hi" x="276" y="299" text-anchor="middle" font-size="12" font-weight="600" stroke="none">batch 1 (100)</text>
  <text class="muted" x="360" y="299" text-anchor="middle" font-size="16">...</text>
  <rect class="bcell" x="392" y="276" width="132" height="36" rx="3" stroke-width="1.5"/>
  <text class="hi" x="458" y="299" text-anchor="middle" font-size="12" font-weight="600" stroke="none">batch 99 (100)</text>
</svg>
