<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" role="img" aria-labelledby="poly-171-title">
  <title id="poly-171-title">Degree-2 polynomial: x=2 maps to [1, 2, 4]</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .hi-bg { fill: #C45C0A; opacity: 0.12; stroke: none; }
    .cell { fill: none; stroke: #5C6570; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .hi-bg { fill: #F9AB00; opacity: 0.18; }
      .cell { stroke: #9AA0A6; }
    }
  </style>

  <text id="poly-171-heading" class="ink" x="280" y="28" text-anchor="middle" font-size="16" font-weight="600">Degree 2: [1, x, x&#x00B2;]</text>

  <!-- highlight row x=2 -->
  <rect class="hi-bg" x="48" y="132" width="464" height="40" rx="4"/>

  <!-- header -->
  <text class="muted" x="100" y="72" text-anchor="middle" font-size="13">x</text>
  <text class="muted" x="220" y="72" text-anchor="middle" font-size="13">1</text>
  <text class="muted" x="340" y="72" text-anchor="middle" font-size="13">x</text>
  <text class="muted" x="460" y="72" text-anchor="middle" font-size="13">x&#x00B2;</text>
  <line class="cell" x1="48" y1="84" x2="512" y2="84" stroke-width="1"/>

  <!-- row x=1 -->
  <text class="ink" x="100" y="116" text-anchor="middle" font-size="14">1</text>
  <text class="ink" x="220" y="116" text-anchor="middle" font-size="14">1</text>
  <text class="ink" x="340" y="116" text-anchor="middle" font-size="14">1</text>
  <text class="ink" x="460" y="116" text-anchor="middle" font-size="14">1</text>

  <!-- row x=2 highlighted -->
  <text class="hi" x="100" y="158" text-anchor="middle" font-size="15" font-weight="600" stroke="none">2</text>
  <text class="hi" x="220" y="158" text-anchor="middle" font-size="15" font-weight="600" stroke="none">1</text>
  <text class="hi" x="340" y="158" text-anchor="middle" font-size="15" font-weight="600" stroke="none">2</text>
  <text class="hi" x="460" y="158" text-anchor="middle" font-size="15" font-weight="600" stroke="none">4</text>

  <!-- row x=3 -->
  <text class="ink" x="100" y="200" text-anchor="middle" font-size="14">3</text>
  <text class="ink" x="220" y="200" text-anchor="middle" font-size="14">1</text>
  <text class="ink" x="340" y="200" text-anchor="middle" font-size="14">3</text>
  <text class="ink" x="460" y="200" text-anchor="middle" font-size="14">9</text>

  <!-- row x=4 -->
  <text class="ink" x="100" y="240" text-anchor="middle" font-size="14">4</text>
  <text class="ink" x="220" y="240" text-anchor="middle" font-size="14">1</text>
  <text class="ink" x="340" y="240" text-anchor="middle" font-size="14">4</text>
  <text class="ink" x="460" y="240" text-anchor="middle" font-size="14">16</text>

  <!-- row x=5 -->
  <text class="ink" x="100" y="280" text-anchor="middle" font-size="14">5</text>
  <text class="ink" x="220" y="280" text-anchor="middle" font-size="14">1</text>
  <text class="ink" x="340" y="280" text-anchor="middle" font-size="14">5</text>
  <text class="ink" x="460" y="280" text-anchor="middle" font-size="14">25</text>

  <text id="poly-171-caption" class="hi" x="280" y="320" text-anchor="middle" font-size="13" stroke="none">x = 2 &#x2192; [1, 2, 4]</text>
</svg>
