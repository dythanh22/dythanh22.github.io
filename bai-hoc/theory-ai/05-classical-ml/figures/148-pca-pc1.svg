<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" role="img" aria-labelledby="pca-148-title">
  <title id="pca-148-title">PCA centered scatter with PC1; lambda approx 2.98 and 0.17</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .axis { fill: none; stroke: #1A1A1A; }
    .pc { fill: none; stroke: #2F6FED; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .axis { stroke: #E8EAED; }
      .pc { stroke: #8AB4F8; }
    }
  </style>

  <text id="pca-148-heading" class="ink" x="320" y="26" text-anchor="middle" font-size="16" font-weight="600">Centered X and PC1</text>

  <!-- origin at (320,240); scale 80 px/unit -->
  <line class="axis" x1="136" y1="240" x2="512" y2="240" stroke-width="1.5"/>
  <line class="axis" x1="320" y1="72" x2="320" y2="408" stroke-width="1.5"/>

  <text class="muted" x="160" y="258" text-anchor="middle" font-size="11">-2</text>
  <text class="muted" x="240" y="258" text-anchor="middle" font-size="11">-1</text>
  <text class="muted" x="400" y="258" text-anchor="middle" font-size="11">1</text>
  <text class="muted" x="480" y="258" text-anchor="middle" font-size="11">2</text>
  <text class="muted" x="308" y="404" text-anchor="end" font-size="11">-2</text>
  <text class="muted" x="308" y="324" text-anchor="end" font-size="11">-1</text>
  <text class="muted" x="308" y="164" text-anchor="end" font-size="11">1</text>
  <text class="muted" x="308" y="84" text-anchor="end" font-size="11">2</text>
  <text class="ink" x="520" y="244" text-anchor="start" font-size="13">x</text>
  <text class="ink" x="328" y="68" text-anchor="start" font-size="13">y</text>

  <!-- PC1 along diagonal [1,1] -->
  <line class="pc" x1="201" y1="359" x2="439" y2="121" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.55"/>
  <line class="pc" x1="320" y1="240" x2="416" y2="144" stroke-width="2.5"/>
  <polygon class="accent" points="416,144 403,148 409,136" stroke="none"/>

  <!-- centered points: (-1.25,-1.5), (-0.25,-0.5), (-0.25,0.5), (1.75,1.5) -->
  <circle class="accent" cx="220" cy="360" r="7" data-allow-overlap="1"/>
  <circle class="accent" cx="300" cy="280" r="7" data-allow-overlap="1"/>
  <circle class="accent" cx="300" cy="200" r="7" data-allow-overlap="1"/>
  <circle class="accent" cx="460" cy="120" r="7" data-allow-overlap="1"/>

  <text class="muted" x="206" y="380" text-anchor="end" font-size="11" stroke="none">(-1.25, -1.5)</text>
  <text class="muted" x="316" y="296" text-anchor="start" font-size="11" stroke="none">(-0.25, -0.5)</text>
  <text class="muted" x="316" y="192" text-anchor="start" font-size="11" stroke="none">(-0.25, 0.5)</text>
  <text class="muted" x="476" y="110" text-anchor="start" font-size="11" stroke="none">(1.75, 1.5)</text>

  <text id="pca-148-pc1" class="accent" x="400" y="118" text-anchor="end" font-size="13" font-weight="600" stroke="none">PC1</text>
  <text class="hi" x="528" y="84" text-anchor="start" font-size="13" font-weight="600" stroke="none">&#x03BB;&#x2081; &#x2248; 2.98</text>
  <text class="muted" x="528" y="106" text-anchor="start" font-size="13" stroke="none">&#x03BB;&#x2082; &#x2248; 0.17</text>
  <text class="muted" x="320" y="434" text-anchor="middle" font-size="12" stroke="none">X_c after centering; mean = (3.25, 2.5)</text>
</svg>
