<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="ridge-147-title">
  <title id="ridge-147-title">Ridge closed form, lambda=1, beta-hat approx [1.09, 1.77]</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .cell { fill: #FFFFFF; stroke: #1A1A1A; }
    .hiCell { fill: #FFF4E8; stroke: #C45C0A; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    
  </style>

  <text id="ridge-147-heading" class="ink" x="380" y="26" text-anchor="middle" font-size="16" font-weight="600">Ridge closed form, &#x03BB; = 1</text>

  <text class="muted" x="92" y="56" text-anchor="middle" font-size="12">X^T X</text>
  <rect class="cell" x="36" y="70" width="56" height="48" stroke-width="1.5"/>
  <rect class="cell" x="92" y="70" width="56" height="48" stroke-width="1.5"/>
  <rect class="cell" x="36" y="118" width="56" height="48" stroke-width="1.5"/>
  <rect class="cell" x="92" y="118" width="56" height="48" stroke-width="1.5"/>
  <text class="ink" x="64" y="100" text-anchor="middle" font-size="16" font-weight="600">14</text>
  <text class="ink" x="120" y="100" text-anchor="middle" font-size="16" font-weight="600">23</text>
  <text class="ink" x="64" y="148" text-anchor="middle" font-size="16" font-weight="600">23</text>
  <text class="ink" x="120" y="148" text-anchor="middle" font-size="16" font-weight="600">38</text>

  <line class="accent" x1="164" y1="118" x2="196" y2="118" stroke-width="2" fill="none"/>
  <polygon class="accent" points="196,112 210,118 196,124" stroke="none"/>
  <text class="muted" x="187" y="102" text-anchor="middle" font-size="11">+ &#x03BB;I</text>

  <text class="muted" x="278" y="56" text-anchor="middle" font-size="12">X^T X + &#x03BB;I</text>
  <rect class="cell" x="222" y="70" width="56" height="48" stroke-width="1.5"/>
  <rect class="cell" x="278" y="70" width="56" height="48" stroke-width="1.5"/>
  <rect class="cell" x="222" y="118" width="56" height="48" stroke-width="1.5"/>
  <rect class="cell" x="278" y="118" width="56" height="48" stroke-width="1.5"/>
  <text class="ink" x="250" y="100" text-anchor="middle" font-size="16" font-weight="600">15</text>
  <text class="ink" x="306" y="100" text-anchor="middle" font-size="16" font-weight="600">23</text>
  <text class="ink" x="250" y="148" text-anchor="middle" font-size="16" font-weight="600">23</text>
  <text class="ink" x="306" y="148" text-anchor="middle" font-size="16" font-weight="600">39</text>
  <rect class="hiCell" x="222" y="180" width="112" height="32" rx="4" stroke-width="1.5"/>
  <text id="ridge-147-det" class="hi" x="278" y="202" text-anchor="middle" font-size="12" font-weight="600" stroke="none">det = 56</text>

  <line class="accent" x1="350" y1="118" x2="382" y2="118" stroke-width="2" fill="none"/>
  <polygon class="accent" points="382,112 396,118 382,124" stroke="none"/>
  <text class="muted" x="373" y="102" text-anchor="middle" font-size="11">inverse</text>

  <text class="muted" x="480" y="56" text-anchor="middle" font-size="12">(1/56) adj</text>
  <rect class="cell" x="408" y="70" width="72" height="48" stroke-width="1.5"/>
  <rect class="cell" x="480" y="70" width="72" height="48" stroke-width="1.5"/>
  <rect class="cell" x="408" y="118" width="72" height="48" stroke-width="1.5"/>
  <rect class="cell" x="480" y="118" width="72" height="48" stroke-width="1.5"/>
  <text class="ink" x="444" y="100" text-anchor="middle" font-size="15" font-weight="600">39</text>
  <text class="ink" x="516" y="100" text-anchor="middle" font-size="15" font-weight="600">-23</text>
  <text class="ink" x="444" y="148" text-anchor="middle" font-size="15" font-weight="600">-23</text>
  <text class="ink" x="516" y="148" text-anchor="middle" font-size="15" font-weight="600">15</text>
  <text class="muted" x="480" y="202" text-anchor="middle" font-size="12">&#x00D7; X^T y = [57, 94]^T</text>

  <line class="accent" x1="568" y1="118" x2="600" y2="118" stroke-width="2" fill="none"/>
  <polygon class="accent" points="600,112 614,118 600,124" stroke="none"/>
  <text class="muted" x="591" y="102" text-anchor="middle" font-size="11">solve</text>

  <text class="muted" x="678" y="56" text-anchor="middle" font-size="12">&#x03B2;&#x0302;</text>
  <rect class="hiCell" x="638" y="70" width="80" height="48" stroke-width="1.5"/>
  <rect class="hiCell" x="638" y="118" width="80" height="48" stroke-width="1.5"/>
  <text id="ridge-147-b0" class="hi" x="678" y="100" text-anchor="middle" font-size="16" font-weight="700" stroke="none">1.09</text>
  <text id="ridge-147-b1" class="hi" x="678" y="148" text-anchor="middle" font-size="16" font-weight="700" stroke="none">1.77</text>

  <text id="ridge-147-eq" class="ink" x="380" y="252" text-anchor="middle" font-size="14">&#x03B2;&#x0302; = (1/56) [61, 99]^T &#x2248; [1.09, 1.77]^T</text>
  <text class="muted" x="380" y="278" text-anchor="middle" font-size="12">Adding &#x03BB;I on the diagonal makes X^T X invertible and shrinks weights.</text>
  <text class="muted" x="380" y="302" text-anchor="middle" font-size="12">Ridge pulls &#x03B2; toward the origin relative to OLS.</text>
</svg>
