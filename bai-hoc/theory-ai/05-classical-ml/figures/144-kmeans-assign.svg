<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" role="img" aria-labelledby="kmeans-144-title">
  <title id="kmeans-144-title">K-Means assignment: C1={x1,x2} C2={x3,x4}</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .axis { fill: none; stroke: #1A1A1A; }
    .link { fill: none; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .axis { stroke: #E8EAED; }
    }
  </style>

  <text id="kmeans-144-heading" class="ink" x="350" y="26" text-anchor="middle" font-size="16" font-weight="600">K-Means assignment: nearest centroid</text>

  <!-- origin (0,0) at (80,370); scale 52 px/unit -->
  <line class="axis" x1="80" y1="370" x2="404" y2="370" stroke-width="1.5"/>
  <line class="axis" x1="80" y1="370" x2="80" y2="46" stroke-width="1.5"/>

  <text class="muted" x="80" y="390" text-anchor="middle" font-size="11">0</text>
  <text class="muted" x="132" y="390" text-anchor="middle" font-size="11">1</text>
  <text class="muted" x="184" y="390" text-anchor="middle" font-size="11">2</text>
  <text class="muted" x="236" y="390" text-anchor="middle" font-size="11">3</text>
  <text class="muted" x="288" y="390" text-anchor="middle" font-size="11">4</text>
  <text class="muted" x="340" y="390" text-anchor="middle" font-size="11">5</text>
  <text class="muted" x="392" y="390" text-anchor="middle" font-size="11">6</text>
  <text class="muted" x="66" y="374" text-anchor="end" font-size="11">0</text>
  <text class="muted" x="66" y="322" text-anchor="end" font-size="11">1</text>
  <text class="muted" x="66" y="270" text-anchor="end" font-size="11">2</text>
  <text class="muted" x="66" y="218" text-anchor="end" font-size="11">3</text>
  <text class="muted" x="66" y="166" text-anchor="end" font-size="11">4</text>
  <text class="muted" x="66" y="114" text-anchor="end" font-size="11">5</text>
  <text class="muted" x="66" y="62" text-anchor="end" font-size="11">6</text>
  <text class="ink" x="242" y="424" text-anchor="middle" font-size="13">x</text>
  <text class="ink" x="24" y="208" text-anchor="middle" font-size="13" transform="rotate(-90 24 208)">y</text>

  <!-- assignment links: point to chosen centroid -->
  <line class="accent link" x1="132" y1="266" x2="132" y2="318" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.75" data-allow-overlap="1"/>
  <line class="accent link" x1="184" y1="318" x2="132" y2="318" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.75" data-allow-overlap="1"/>
  <line class="hi link" x1="288" y1="110" x2="340" y2="110" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.75" data-allow-overlap="1"/>
  <line class="hi link" x1="340" y1="162" x2="340" y2="110" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.75" data-allow-overlap="1"/>

  <!-- points -->
  <circle class="accent" cx="132" cy="266" r="7" data-allow-overlap="1"/>
  <circle class="accent" cx="184" cy="318" r="7" data-allow-overlap="1"/>
  <circle class="hi" cx="288" cy="110" r="7" data-allow-overlap="1"/>
  <circle class="hi" cx="340" cy="162" r="7" data-allow-overlap="1"/>

  <!-- centroids as diamonds -->
  <polygon class="accent" points="132,308 142,318 132,328 122,318" data-allow-overlap="1"/>
  <polygon class="hi" points="340,100 350,110 340,120 330,110" data-allow-overlap="1"/>

  <text class="accent" x="118" y="250" text-anchor="end" font-size="12" stroke="none">x1=(1,2)</text>
  <text class="accent" x="198" y="338" text-anchor="start" font-size="12" stroke="none">x2=(2,1)</text>
  <text class="hi" x="274" y="96" text-anchor="end" font-size="12" stroke="none">x3=(4,5)</text>
  <text class="hi" x="356" y="178" text-anchor="start" font-size="12" stroke="none">x4=(5,4)</text>
  <text class="accent" x="118" y="344" text-anchor="end" font-size="12" font-weight="600" stroke="none">&#x03BC;1=(1,1)</text>
  <text class="hi" x="356" y="96" text-anchor="start" font-size="12" font-weight="600" stroke="none">&#x03BC;2=(5,5)</text>

  <circle class="accent" cx="470" cy="120" r="6"/>
  <text class="ink" x="486" y="124" text-anchor="start" font-size="13" stroke="none">Cluster 1: {x1, x2}</text>
  <circle class="hi" cx="470" cy="152" r="6"/>
  <text class="ink" x="486" y="156" text-anchor="start" font-size="13" stroke="none">Cluster 2: {x3, x4}</text>
  <polygon class="muted" points="470,182 478,190 470,198 462,190" stroke="none"/>
  <text class="ink" x="486" y="194" text-anchor="start" font-size="13" stroke="none">centroid</text>
  <text class="muted" x="470" y="228" text-anchor="start" font-size="12" stroke="none">assign to nearest centroid</text>
</svg>
