<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="rf-146-title">
  <title id="rf-146-title">Majority vote A=3, B=2, C=0</title>
  <style>
    .ink { fill: #1A1A1A; stroke: #1A1A1A; }
    .muted { fill: #5C6570; stroke: #5C6570; }
    .accent { fill: #2F6FED; stroke: #2F6FED; }
    .hi { fill: #C45C0A; stroke: #C45C0A; }
    .axis { fill: none; stroke: #1A1A1A; }
    .chip-a { fill: #C45C0A; fill-opacity: 0.12; stroke: #C45C0A; }
    .chip-b { fill: #2F6FED; fill-opacity: 0.12; stroke: #2F6FED; }
    .fill-none { fill: none; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8EAED; stroke: #E8EAED; }
      .muted { fill: #9AA0A6; stroke: #9AA0A6; }
      .accent { fill: #8AB4F8; stroke: #8AB4F8; }
      .hi { fill: #F9AB00; stroke: #F9AB00; }
      .axis { stroke: #E8EAED; }
      .chip-a { fill: #F9AB00; fill-opacity: 0.18; stroke: #F9AB00; }
      .chip-b { fill: #8AB4F8; fill-opacity: 0.18; stroke: #8AB4F8; }
    }
  </style>

  <text id="rf-146-heading" class="ink" x="320" y="26" text-anchor="middle" font-size="16" font-weight="600">Hard vote: A = 3, B = 2, C = 0</text>

  <rect class="chip-a" x="64" y="44" width="88" height="40" rx="4" stroke-width="1.5"/>
  <text class="ink" x="108" y="69" text-anchor="middle" font-size="13" stroke="none">T1: A</text>
  <rect class="chip-b" x="170" y="44" width="88" height="40" rx="4" stroke-width="1.5"/>
  <text class="ink" x="214" y="69" text-anchor="middle" font-size="13" stroke="none">T2: B</text>
  <rect class="chip-a" x="276" y="44" width="88" height="40" rx="4" stroke-width="1.5"/>
  <text class="ink" x="320" y="69" text-anchor="middle" font-size="13" stroke="none">T3: A</text>
  <rect class="chip-a" x="382" y="44" width="88" height="40" rx="4" stroke-width="1.5"/>
  <text class="ink" x="426" y="69" text-anchor="middle" font-size="13" stroke="none">T4: A</text>
  <rect class="chip-b" x="488" y="44" width="88" height="40" rx="4" stroke-width="1.5"/>
  <text class="ink" x="532" y="69" text-anchor="middle" font-size="13" stroke="none">T5: B</text>

  <line class="axis" x1="72" y1="340" x2="600" y2="340" stroke-width="1.25"/>
  <line class="axis" x1="72" y1="140" x2="72" y2="340" stroke-width="1.25"/>

  <text class="muted" x="64" y="344" text-anchor="end" font-size="12">0</text>
  <text class="muted" x="64" y="288" text-anchor="end" font-size="12">1</text>
  <text class="muted" x="64" y="232" text-anchor="end" font-size="12">2</text>
  <text class="muted" x="64" y="176" text-anchor="end" font-size="12">3</text>
  <line class="muted fill-none" x1="72" y1="284" x2="600" y2="284" stroke-width="1" opacity="0.25"/>
  <line class="muted fill-none" x1="72" y1="228" x2="600" y2="228" stroke-width="1" opacity="0.25"/>
  <line class="muted fill-none" x1="72" y1="172" x2="600" y2="172" stroke-width="1" opacity="0.25"/>

  <rect class="hi" x="140" y="172" width="80" height="168"/>
  <text class="hi" x="180" y="160" text-anchor="middle" font-size="13" font-weight="600" stroke="none">3</text>
  <text class="ink" x="180" y="362" text-anchor="middle" font-size="13" stroke="none">A</text>
  <text class="hi" x="180" y="380" text-anchor="middle" font-size="11" stroke="none">mode</text>

  <rect class="accent" x="280" y="228" width="80" height="112"/>
  <text class="muted" x="320" y="216" text-anchor="middle" font-size="13" stroke="none">2</text>
  <text class="ink" x="320" y="362" text-anchor="middle" font-size="13" stroke="none">B</text>

  <line class="muted fill-none" x1="420" y1="340" x2="500" y2="340" stroke-width="3"/>
  <text class="muted" x="460" y="328" text-anchor="middle" font-size="13">0</text>
  <text class="ink" x="460" y="362" text-anchor="middle" font-size="13" stroke="none">C</text>

  <text class="ink" x="22" y="240" text-anchor="middle" font-size="13" transform="rotate(-90 22 240)">votes</text>
