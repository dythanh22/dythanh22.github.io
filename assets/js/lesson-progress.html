<script>
(() => {
  // ~320: tiếng Việt kỹ thuật đếm theo khoảng trắng (âm tiết) nên cao hơn “từ” tiếng Anh
  const READ_PREFIX = "read:";
  const WORDS_PER_MIN = 320;

  const pathKey = (pathname) => READ_PREFIX + pathname.replace(/\/index\.html$/, "/").replace(/\.html$/, "");

  const lessonHrefLinks = () =>
    [...document.querySelectorAll(
      "#quarto-sidebar a.sidebar-link[href], .sidebar-navigation a.sidebar-link[href]"
    )].filter((a) => {
      if (a.getAttribute("data-bs-toggle") === "collapse") return false;
      const href = a.getAttribute("href") || "";
      if (!href || href.startsWith("#")) return false;
      try {
        const path = new URL(a.href, location.origin).pathname;
        return /\.html?$/i.test(path) || /\/$/.test(path);
      } catch (_) {
        return false;
      }
    });

  const markCurrentRead = () => {
    try {
      localStorage.setItem(pathKey(location.pathname), "1");
    } catch (_) {
      /* private mode / quota */
    }
  };

  const readingMinutes = () => {
    const content = document.querySelector("#quarto-document-content");
    if (!content) return null;
    const text = (content.innerText || "").trim();
    if (!text) return null;
    const words = text.split(/\s+/).filter(Boolean).length;
    return Math.max(1, Math.round(words / WORDS_PER_MIN));
  };

  const appendReadingTime = (badge) => {
    const mins = readingMinutes();
    if (mins != null) {
      badge.textContent += ` · ~${mins} phút đọc`;
    }
  };

  const injectCompletion = () => {
    const path = location.pathname;
    const isCapstone = /lesson-10-end-to-end-capstone/.test(path);
    const isUNetComplete = /UNet\/complete-unet/.test(path);
    const isTheoryComplete = /theory-ai\/15-mlops\/retraining-trigger-design/.test(path);
    const isMathComplete = /math-base\/07-graph-theory\/message-passing-neural-networks/.test(path);
    if (!isCapstone && !isUNetComplete && !isTheoryComplete && !isMathComplete) return;

    const content = document.querySelector("#quarto-document-content");
    if (!content) return;
    if (content.querySelector(".series-completion")) return;

    const box = document.createElement("div");
    box.className = "series-completion";

    let title;
    let next;
    if (isMathComplete) {
      title = "Bạn đã hoàn thành chuỗi Math Base";
      next =
        '<a href="../../theory-ai/">Tiếp: Theory AI →</a>' +
        ' · <a href="../../architecture-models/">Architecture Models →</a>';
    } else if (isTheoryComplete) {
      title = "Bạn đã hoàn thành chuỗi Theory AI";
      next =
        '<a href="../architecture-models/">Tiếp: Architecture Models →</a>' +
        ' · <a href="../ai-optimize/">AI Optimization →</a>' +
        ' · <a href="../math-base/">Ôn Math Base →</a>';
    } else if (isCapstone) {
      title = "Bạn đã hoàn thành chuỗi AI Optimization";
      next = '<a href="../architecture-models/">Quay lại Architecture Models →</a>' +
        ' · <a href="../theory-ai/">Ôn Theory AI →</a>' +
        ' · <a href="../math-base/">Ôn Math Base →</a>';
    } else {
      title = "Bạn đã hoàn thành Architecture Models (U-Net)";
      next =
        '<a href="../../math-base/">Ôn Math Base →</a>' +
        ' · <a href="../../theory-ai/">Ôn Theory AI →</a>' +
        ' · <a href="../../ai-optimize/">Tiếp: AI Optimization →</a>';
    }

    box.innerHTML = `<strong>${title}</strong><p>${next}</p>`;
    content.appendChild(box);
  };

  /** Crumb section tự trỏ về trang hiện tại → chuyển về tổng quan chuỗi (+ neo nếu có) */
  const fixSeriesBreadcrumb = () => {
    const path = location.pathname;
    const isTheory = /\/bai-hoc\/theory-ai\//.test(path);
    const isMath = /\/bai-hoc\/math-base\//.test(path);
    if (!isTheory && !isMath) return;
    if (/\/(theory-ai|math-base)\/(index\.html)?$/.test(path.replace(/\/+$/, ""))) return;

    const crumbs = document.querySelectorAll(
      "nav.quarto-page-breadcrumbs ol.breadcrumb > li.breadcrumb-item > a"
    );
    if (crumbs.length < 2) return;

    const first = crumbs[0];
    const current = path.replace(/\/$/, "");
    let firstPath;
    try {
      firstPath = new URL(first.href, location.origin).pathname.replace(/\/$/, "");
    } catch (_) {
      return;
    }
    if (firstPath !== current && firstPath + ".html" !== current && firstPath !== current.replace(/\.html$/, "")) {
      return;
    }

    const label = (first.textContent || "").trim();
    const theorySlugMap = {
      "1. Probability": "probability",
      "2. Statistics": "statistics",
      "3. Linear Algebra": "linear-algebra",
      "4. Features": "features",
      "5. Classical ML": "classical-ml",
      "6. Metrics": "metrics",
      "7. Activations & Losses": "activations-losses",
      "8. Optimizers": "optimizers",
      "9. Deep Learning": "deep-learning",
      "10. Computer Vision": "computer-vision",
      "11. NLP": "nlp",
      "12. Reinforcement Learning": "reinforcement-learning",
      "13. Time Series": "time-series",
      "14. Recommender": "recommender",
      "15. MLOps": "mlops",
    };
    const mathSlugMap = {
      "1. Probability": "probability",
      "2. Statistics": "statistics",
      "3. Linear Algebra": "linear-algebra",
      "4. Calculus": "calculus",
      "5. Optimization": "optimization",
      "6. Information Theory": "information-theory",
      "7. Graph Theory": "graph-theory",
    };
    const slugMap = isMath ? mathSlugMap : theorySlugMap;
    const slug = slugMap[label] || label.toLowerCase().replace(/^\d+\.\s*/, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    first.setAttribute("href", "../../index.html#" + slug);
  };

  const injectBadge = () => {
    const active = document.querySelector(
      "#quarto-sidebar a.sidebar-item-text.sidebar-link.active, " +
        ".sidebar-navigation a.sidebar-item-text.sidebar-link.active"
    );
    if (!active) return;

    const titleBlock = document.getElementById("title-block-header");
    if (!titleBlock) return;
    if (document.querySelector(".lesson-progress")) return;

    const label = (active.textContent || "").trim();
    const li = active.closest("li.sidebar-item");
    const pageLinks = lessonHrefLinks();

    // Series overview (short-title "Tổng quan chuỗi")
    if (/tổng quan chuỗi/i.test(label)) {
      const count = pageLinks.filter((a) => a !== active).length;
      const badge = document.createElement("p");
      badge.className = "lesson-progress";
      badge.textContent =
        count > 0 ? `Tổng quan chuỗi · ${count} bài` : "Tổng quan chuỗi";
      appendReadingTime(badge);
      titleBlock.insertAdjacentElement("afterend", badge);
      return;
    }

    if (li && li.classList.contains("sidebar-item-section")) {
      const nested = li.querySelectorAll(":scope > ul a.sidebar-link[href]");
      if (nested.length > 0) {
        const badge = document.createElement("p");
        badge.className = "lesson-progress";
        badge.textContent = `${label} · Tổng quan · ${nested.length} bài`;
        appendReadingTime(badge);
        titleBlock.insertAdjacentElement("afterend", badge);
      }
      return;
    }

    const list = active.closest("ul");
    if (!list) return;

    const links = [
      ...list.querySelectorAll(
        ":scope > li > .sidebar-item-container > a.sidebar-link[href]"
      ),
    ].filter((a) => a.getAttribute("data-bs-toggle") !== "collapse");
    if (links.length < 1) return;

    const idx = links.indexOf(active);
    if (idx < 0) return;

    const sectionTitle =
      list
        .closest(".sidebar-item-section")
        ?.querySelector(
          ":scope > .sidebar-item-container .sidebar-item-text, :scope > .sidebar-item-container a"
        )
        ?.textContent?.trim() || "";

    const badge = document.createElement("p");
    badge.className = "lesson-progress";
    const chapter = `Bài ${idx + 1}/${links.length}`;
    badge.textContent = sectionTitle ? `${sectionTitle} · ${chapter}` : chapter;
    appendReadingTime(badge);
    titleBlock.insertAdjacentElement("afterend", badge);
  };

  const run = () => {
    markCurrentRead();
    fixSeriesBreadcrumb();
    injectBadge();
    injectCompletion();
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", run);
  } else {
    run();
  }
})();
</script>
